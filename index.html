:root{
  --ink:#0b0b0c;
  --ink-2:#131315;
  --text:#ece6da;
  --text-dim:#9c948a;
  --wine:#7a1f2b;
  --gold:#ab8b5c;
  --line: rgba(236,230,218,0.12);
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'Inter', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--ink); color:var(--text); font-family:var(--font-sans); font-weight:300; min-height:100vh; }
a{color:inherit;}
::selection{ background:var(--wine); color:var(--text); }
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:#2a2a2c;}

#splash{
  position:fixed; inset:0; z-index:10000;
  background:#000 url('assets/splash.jpg') center center / cover no-repeat;
  cursor:pointer;
  display:flex; align-items:flex-end; justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
}
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .tap-hint{
  margin-bottom:7vh; font-size:10px; letter-spacing:0.28em; text-transform:uppercase;
  color:#e8ddc8; opacity:0.75; animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }

header{
  padding:36px 6vw 18px; display:flex; align-items:baseline; justify-content:space-between;
  flex-wrap:wrap; gap:14px; max-width:1180px; margin:0 auto;
}
.wordmark{ font-family:var(--font-serif); font-style:italic; font-weight:500; font-size:clamp(20px,2.4vw,26px); cursor:pointer; }
.wordmark span{ color:var(--text-dim); font-style:normal; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-left:12px; }

nav.tabs{
  display:flex; gap:26px; flex-wrap:wrap; padding:0 6vw 26px; max-width:1180px; margin:0 auto;
  border-bottom:1px solid var(--line); overflow-x:auto;
}
.tab{
  background:none; border:none; cursor:pointer; color:var(--text-dim);
  font-size:12px; letter-spacing:0.13em; text-transform:uppercase; padding:0 0 14px;
  position:relative; transition:color 0.2s ease; white-space:nowrap; flex:0 0 auto;
}
.tab::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--gold); transform:scaleX(0); transition:transform 0.25s ease; }
.tab:hover{ color:var(--text); }
.tab.active{ color:var(--text); }
.tab.active::after{ transform:scaleX(1); }
.tab.addtab{ color:var(--gold); }

main{ padding:8px 6vw 100px; max-width:1180px; margin:0 auto; }
.panel{ display:none; animation:fadein 0.4s ease; }
.panel.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{ font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
h1.page-title{ font-family:var(--font-serif); font-weight:500; font-size:clamp(32px,5vw,52px); margin:0 0 8px; line-height:1.05; }
.page-sub{ color:var(--text-dim); font-size:14px; font-weight:300; margin-bottom:40px; max-width:560px; line-height:1.6; }

.hero{ padding:20px 0 56px; border-bottom:1px solid var(--line); margin-bottom:48px; }
.hero h2{ font-family:var(--font-serif); font-weight:500; font-style:italic; font-size:clamp(38px,7vw,72px); margin:0 0 18px; line-height:1.05; }
.hero p{ color:var(--text-dim); font-size:15px; line-height:1.7; max-width:480px; font-weight:300; }

.doorway:hover{ background:var(--ink-2); }
.doorway .num{ font-size:10px; color:var(--text-dim); letter-spacing:0.18em; text-transform:uppercase; }
.doorway h3{ font-family:var(--font-serif); font-weight:500; font-size:20px; margin:10px 0 8px; }
.doorway p{ font-size:12.5px; color:var(--text-dim); margin:0; line-height:1.6; font-weight:300;}

.pingrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px; }

.pin .pin-img{ width:100%; aspect-ratio:4/5; background:#1a1a1c; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; }
.pin .pin-body{ padding:15px 17px 19px; }
.pin .pin-title{ font-family:var(--font-serif); font-size:16.5px; font-weight:500; line-height:1.3; }
.pin .pin-meta{ font-size:11px; color:var(--gold); margin-top:5px; letter-spacing:0.03em; }
.pin .pin-desc{ font-size:12.5px; color:var(--text-dim); margin-top:6px; line-height:1.55; font-weight:300; }
.pin a.pin-link{ display:inline-block; margin-top:11px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; color:var(--gold); border-bottom:1px solid transparent; }
.pin a.pin-link:hover{ border-bottom-color:var(--gold); }
.pin .pin-remove{ position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%; background:rgba(11,11,12,0.7); color:var(--text); border:1px solid var(--line); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.2s ease; }
.pin:hover .pin-remove{ opacity:1; }

.add-form{ border:1px solid var(--line); padding:24px 26px; margin-bottom:34px; }

.add-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:14px;}
.add-form label{ display:block; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.add-form input[type=text], .add-form input[type=url], .add-form textarea, .add-form input[type=number], .add-form select{
  background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text);

}
.add-form input:focus, .add-form textarea:focus, .add-form select:focus{ outline:none; border-bottom-color:var(--gold); }
.add-form textarea{ min-height:60px; resize:vertical; }
.add-form input[type=file]{ font-size:12px; color:var(--text-dim); width:100%; }
.thumb-preview{ width:70px; height:70px; object-fit:cover; margin-top:8px; border:1px solid var(--line); display:none; }
.btn{ font-family:var(--font-sans); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; background:none; color:var(--text); border:1px solid var(--gold); padding:12px 26px; cursor:pointer; transition:background 0.2s ease, color 0.2s ease; }
.btn:hover{ background:var(--gold); color:var(--ink); }
.btn-quiet{ border-color:var(--line); color:var(--text-dim); }

.id-card{ border:1px solid var(--line); margin-bottom:22px; }

.id-card .id-head span:last-child{ font-size:11px; color:var(--text-dim); letter-spacing:0.05em; font-family:var(--font-sans); }

.field-row{ display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }

.field-label{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }

.field-input:focus{ outline:none; border-bottom-color:var(--gold); }

.note-line{ padding:16px 0; font-size:13px; color:var(--text-dim); border-bottom:1px solid var(--line); margin-bottom:16px; font-style:italic; }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:40px; }

.pr-row{ display:grid; grid-template-columns:1fr 1fr 120px 30px; gap:14px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.pr-row .pr-date{ color:var(--text-dim); font-size:11px; }

.recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }

.recipe-card .rc-tag{ display:inline-block; font-size:10px; letter-spacing:0.1em; color:var(--gold); margin-top:12px; text-transform:uppercase; }

.lock-screen{ border:1px solid var(--line); max-width:400px; margin:60px auto; padding:48px 36px; text-align:center; }

footer{ text-align:center; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim); padding:40px 20px 60px; border-top:1px solid var(--line); }

@media(max-width:640px){
  .field-row{ grid-template-columns:1fr; gap:3px; }
  .pr-row{ grid-template-columns:1fr 1fr; }
  .country-row{ grid-template-columns:1fr 90px 24px; }
}
</style>

function loadList(key, fallback){ try{ const raw = localStorage.getItem(key); if(raw){ const p = JSON.parse(raw); if(Array.isArray(p)) return p; } }catch(e){} return fallback; }
function loadObj(key, fallback){ try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){} return fallback; }
function saveList(key, list){ try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){ alert('Could not save — this browser storage may be full.'); } }
function saveObj(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ alert('Could not save — this browser storage may be full.'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

let editables = loadObj(K.editables, {});
function getVal(id, fallback){ return (editables[id]!==undefined) ? editables[id] : fallback; }
function saveField(el){ editables[el.dataset.fid] = el.value; saveObj(K.editables, editables); }
function editableFieldRows(fields){
  return fields.map(f=>'<div class="field-row"><div class="field-label">'+f.label+'</div><input class="field-input" data-fid="'+f.id+'" value="'+esc(getVal(f.id,f.value))+'" placeholder="fill in" onchange="saveField(this)"></div>').join('');
}

function pinCard(def, item){
  const imgStyle = item.img ? "background-image:url('"+item.img+"')" : "";
  const metaVals = def.extraFields.filter(f=>f.type!=='textarea' && f.key!=='link' && item[f.key]).map(f=>esc(item[f.key]));
  const noteVals = def.extraFields.filter(f=>f.type==='textarea' && item[f.key]);
  const linkField = def.extraFields.find(f=>f.key==='link');
  return '' +
    '<div class="pin">' +
      '<div class="pin-remove" onclick="removeBoardItem(\''+def._key+'\',\''+item.id+'\')">&times;</div>' +
      '<div class="pin-img" style="'+imgStyle+'">'+(item.img?'':'no photo')+'</div>' +
      '<div class="pin-body">' +
        '<div class="pin-title">'+esc(item[def.titleField.key]||'untitled')+'</div>' +
        (metaVals.length?'<div class="pin-meta">'+metaVals.join(' · ')+'</div>':'') +
        noteVals.map(f=>'<div class="pin-desc">'+esc(item[f.key])+'</div>').join('') +
        (linkField && item.link ? '<a class="pin-link" href="'+item.link+'" target="_blank" rel="noopener">view →</a>' : '') +
      '</div>' +
    '</div>';
}
let pendingThumb = {};
async function previewFile(kind){
  const input = document.getElementById(kind+'-file');
  const thumb = document.getElementById(kind+'-thumb');
  if(input.files && input.files[0]){
    const durl = await fileToDataURL(input.files[0]);
    pendingThumb[kind] = durl; thumb.src = durl; thumb.style.display='block';
  }
}
function boardForm(key, def){
  const extraHtml = def.extraFields.map(f=>{
    const inputHtml = f.type==='textarea' ? '<textarea id="'+key+'-'+f.key+'"></textarea>' : '<input type="'+(f.type==='url'?'url':'text')+'" id="'+key+'-'+f.key+'">';
    return '<div><label>'+f.label+'</label>'+inputHtml+'</div>';
  }).join('');
  return '' +
    '<div class="add-form"><div class="eyebrow">pin something new</div>' +
      '<div class="row"><div><label>'+def.titleField.label+'</label><input type="text" id="'+key+'-title"></div>' +
      '<div><label>Photo</label><input type="file" accept="image/*" id="'+key+'-file" onchange="previewFile(\''+key+'\')"><img class="thumb-preview" id="'+key+'-thumb"></div></div>' +
      '<div class="row">'+extraHtml+'</div>' +
      '<button class="btn" onclick="addBoardItem(\''+key+'\')">Pin it</button>' +
    '</div>';
}
function panelBoard(key){
  const def = BOARD_DEFS[key]; def._key = key;
  const items = boardData[key] || [];
  const grid = items.length ? '<div class="pingrid">'+items.map(it=>pinCard(def,it)).join('')+'</div>' : '<p style="color:var(--text-dim);font-size:13px;">'+def.emptyMsg+'</p>';
  return '<h1 class="page-title">'+def.label+'</h1><p class="page-sub"></p>' + boardForm(key, def) + grid + (BOARD_DEFS[key]._custom ? '<div class="delete-tab-link" onclick="deleteCustomTab(\''+key+'\')">delete this tab</div>' : '');
}
function addBoardItem(key){
  const def = BOARD_DEFS[key];
  const titleVal = document.getElementById(key+'-title').value.trim();
  if(!titleVal) return;
  const item = { id: uid(), img: pendingThumb[key] || "" };
  item[def.titleField.key] = titleVal;
  def.extraFields.forEach(f=>{ const el = document.getElementById(key+'-'+f.key); item[f.key] = el ? el.value.trim() : ""; });
  boardData[key] = boardData[key] || [];
  boardData[key].push(item);
  saveList(def.storageKey, boardData[key]);
  pendingThumb[key] = null;
  showPanel(currentTab);
}
function removeBoardItem(key,id){
  boardData[key] = (boardData[key]||[]).filter(x=>x.id!==id);
  saveList(BOARD_DEFS[key].storageKey, boardData[key]);
  showPanel(currentTab);
}

let pendingDiaryImages = {};
function diaryComposer(key, def){

      '<button class="btn" onclick="addDiaryEntry(\''+key+'\')">Save entry</button>' +
    '</div>';

async function addPendingDiaryImages(key, input){
  pendingDiaryImages[key] = pendingDiaryImages[key] || [];
  for(const f of input.files){ pendingDiaryImages[key].push(await fileToDataURL(f)); }
  input.value = '';
  renderDiaryPreview(key);
}
function renderDiaryPreview(key){
  const box = document.getElementById('dy-'+key+'-preview'); if(!box) return;
  const list = pendingDiaryImages[key] || [];
  box.innerHTML = list.map((src,i)=>'<div class="attach-thumb"><img src="'+src+'"><div class="rm" onclick="removePendingDiaryImage(\''+key+'\','+i+')">&times;</div></div>').join('');
}
function removePendingDiaryImage(key,i){ pendingDiaryImages[key].splice(i,1); renderDiaryPreview(key); }
function addDiaryEntry(key){
  const def = DIARY_DEFS[key];
  const text = document.getElementById('dy-'+key+'-text').value.trim();
  const place = def.placeField ? document.getElementById('dy-'+key+'-place').value.trim() : '';
  const date = def.placeField ? (document.getElementById('dy-'+key+'-date').value.trim() || todayStr()) : todayStr();
  const images = pendingDiaryImages[key] || [];
  if(!text && images.length===0 && !place) return;
  diaryData[key] = diaryData[key] || [];
  diaryData[key].push({ id:uid(), place, date, text, images });
  saveList(def.storageKey, diaryData[key]);
  pendingDiaryImages[key] = [];
  showPanel(currentTab);
}
function removeDiaryEntry(key,id){
  diaryData[key] = (diaryData[key]||[]).filter(x=>x.id!==id);
  saveList(DIARY_DEFS[key].storageKey, diaryData[key]);
  showPanel(currentTab);
}
function diaryEntries(key, def){
  const list = (diaryData[key]||[]).slice().reverse();
  if(!list.length) return '<p style="color:var(--text-dim);font-size:13px;">'+def.emptyMsg+'</p>';
  return list.map(e=>{
    const imgs = (e.images&&e.images.length) ? '<div class="entry-images">'+e.images.map(i=>'<img src="'+i+'" onclick="window.open(this.src)">').join('')+'</div>' : '';
    return '<div class="entry"><div class="entry-date">'+esc(e.date)+'</div>'+(e.place?'<div class="entry-place">'+esc(e.place)+'</div>':'')+(e.text?'<div class="entry-text">'+esc(e.text)+'</div>':'')+imgs+'<div class="entry-remove" onclick="removeDiaryEntry(\''+key+'\',\''+e.id+'\')">remove entry</div></div>';
  }).join('');
}

function panelJournal(){
  const unlocked = sessionStorage.getItem(K.unlocked) === '1';
  if(!unlocked){
    return '<div class="eyebrow">10</div><h1 class="page-title">journal</h1><p class="page-sub">Private.</p>' +
      '<div class="lock-screen"><h2>enter the password</h2><p>A soft lock, not a vault — enough for privacy.</p>' +
      '<input type="password" id="journal-pw" placeholder="•••••••••"><button class="btn" style="width:100%;" onclick="tryUnlock()">Unlock</button><div class="err" id="journal-err"></div></div>';
  }
  const entries = journalEntries.slice().reverse().map(e=>{
    const imgs = (e.images&&e.images.length) ? '<div class="entry-images">'+e.images.map(i=>'<img src="'+i+'" onclick="window.open(this.src)">').join('')+'</div>' : '';
    const audio = e.audio ? '<audio controls src="'+e.audio+'"></audio>' : '';
    return '<div class="entry"><div class="entry-date">'+e.date+'</div><div class="entry-text">'+esc(e.text)+'</div>'+imgs+audio+'<div class="entry-remove" onclick="removeJournalEntry(\''+e.id+'\')">remove entry</div></div>';
  }).join('') || '<p style="color:var(--text-dim);font-size:13px;">No entries yet.</p>';

  return '' +
    '<div class="eyebrow">10</div><button class="lock-btn" onclick="lockJournal()">Lock</button>' +
    '<h1 class="page-title">journal</h1><p class="page-sub">Unlocked for this session.</p>' +
    '<div class="composer">' +
      '<textarea id="jr-text" placeholder="What is on your mind..."></textarea>' +
      '<div class="composer-tools"><label class="file-label">+ photo<input type="file" accept="image/*" multiple style="display:none" onchange="addPendingImages(this)"></label><button class="tool-btn" id="rec-btn" onclick="toggleRecording()">● record voice note</button></div>' +
      '<div class="attach-preview" id="attach-preview"></div>' +
      '<button class="btn" onclick="addJournal()">Write it down</button>' +
      '<div class="storage-note">Photos and voice notes are saved right in this browser. That works well day to day, but heavy files can eventually bump against the browser storage limit — say the word if you want this moved to a proper backend later.</div>' +
    '</div>' + entries;
}
let pendingImages = [];
let pendingAudioDataURL = null;
let mediaRecorder, audioChunks = [], mediaStream = null;
function renderPendingAttachments(){
  const box = document.getElementById('attach-preview'); if(!box) return;
  let html = pendingImages.map((src,i)=>'<div class="attach-thumb"><img src="'+src+'"><div class="rm" onclick="removePendingImage('+i+')">&times;</div></div>').join('');
  if(pendingAudioDataURL){ html += '<audio controls src="'+pendingAudioDataURL+'" style="height:40px;"></audio>'; }
  box.innerHTML = html;
}
function removePendingImage(i){ pendingImages.splice(i,1); renderPendingAttachments(); }
async function addPendingImages(input){ for(const f of input.files){ pendingImages.push(await fileToDataURL(f)); } input.value=''; renderPendingAttachments(); }
async function toggleRecording(){
  const btn = document.getElementById('rec-btn');
  if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert('Voice notes need microphone access, which this browser does not support here.'); return; }
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(mediaStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async ()=>{
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      pendingAudioDataURL = await fileToDataURL(blob);
      renderPendingAttachments();
      mediaStream.getTracks().forEach(t=>t.stop());
      btn.textContent = '● record voice note'; btn.classList.remove('recording');
    };
    mediaRecorder.start();
    btn.textContent = '■ stop recording'; btn.classList.add('recording');
  }catch(err){ alert('Microphone access was blocked — check this browser&#39;s site permissions to record a voice note.'); }
}
function addJournal(){
  const text = document.getElementById('jr-text').value.trim();
  if(!text && pendingImages.length===0 && !pendingAudioDataURL) return;
  journalEntries.push({ id:uid(), text, date: todayStr(), images: pendingImages.slice(), audio: pendingAudioDataURL });
  saveList(K.journal, journalEntries);
  pendingImages = []; pendingAudioDataURL = null;
  showPanel(currentTab);
}
function removeJournalEntry(id){ journalEntries = journalEntries.filter(x=>x.id!==id); saveList(K.journal, journalEntries); showPanel(currentTab); }
function tryUnlock(){
  const val = document.getElementById('journal-pw').value;
  if(val === DATA.journalPassword){ sessionStorage.setItem(K.unlocked,'1'); showPanel(currentTab); }
  else{ document.getElementById('journal-err').textContent = 'wrong password — try again'; }
}
function lockJournal(){ sessionStorage.removeItem(K.unlocked); showPanel(currentTab); }

function createCustomTab(){
  const name = document.getElementById('newtab-name').value.trim();
  const type = document.getElementById('newtab-type').value;
  if(!name) return;
  const id = uid();
  const ct = { id, label:name, type };
  customTabs.push(ct);
  saveList(K.customTabs, customTabs);
  if(type==='board'){
    BOARD_DEFS[id] = { label:name, storageKey:"sam_custom_board_"+id, titleField:{key:"title",label:"Title"}, extraFields:[{key:"note",label:"Note",type:"textarea"},{key:"date",label:"Date",type:"text"},{key:"link",label:"Link",type:"url"}], seed:[], emptyMsg:"Nothing pinned yet.", _custom:true };
    boardData[id] = [];
  }
  if(type==='diary'){
    DIARY_DEFS[id] = { label:name, storageKey:"sam_custom_diary_"+id, placeField:true, placeLabel:"Title", seed:[], emptyMsg:"No entries yet." };
    diaryData[id] = [];
  }
  showPanel('custom-'+id);
}
function deleteCustomTab(id){
  customTabs = customTabs.filter(t=>t.id!==id);
  saveList(K.customTabs, customTabs);
  showPanel('home');
}
function panelCustomNotes(ct){
  const key = "sam_custom_notes_"+ct.id;

function saveNotes(id){ localStorage.setItem("sam_custom_notes_"+id, document.getElementById('notes-'+id).value); }
function panelCustomDiary(ct){
  const def = DIARY_DEFS[ct.id];
  return '<h1 class="page-title">'+esc(ct.label)+'</h1><p class="page-sub"></p>' + diaryComposer(ct.id, def) + diaryEntries(ct.id, def) + '<div class="delete-tab-link" onclick="deleteCustomTab(\''+ct.id+'\')">delete this tab</div>';

const PANEL_RENDERERS = {
  home:panelHome, charles:panelCharles, me:panelMe, health:panelHealth,
  wishlist:()=>panelBoard('wishlist'), interiors:()=>panelBoard('interiors'), photos:()=>panelBoard('photos'), concerts:()=>panelBoard('concerts'),
  travel:panelTravel, recipes:panelRecipes, journal:panelJournal, thoughts:panelThoughts, newtab:panelNewTab
};

function showPanel(id){
  currentTab = id;
  renderNav(id);
  const stage = document.getElementById('mainStage');
  let html;
  if(id.indexOf('custom-')===0){
    const cid = id.slice(7);
    const ct = customTabs.find(t=>t.id===cid);
    if(!ct){ html = '<p>Tab not found.</p>'; }
    else if(ct.type==='notes') html = panelCustomNotes(ct);
    else if(ct.type==='board') html = panelBoard(ct.id);
    else if(ct.type==='diary') html = panelCustomDiary(ct);
  } else if(PANEL_RENDERERS[id]){
    html = PANEL_RENDERERS[id]();
  } else {
    html = panelHome(); currentTab = 'home'; id = 'home';
  }
  stage.innerHTML = '<div class="panel active">'+html+'</div>';
  stage.querySelectorAll('.doorway[data-tab]').forEach(el=> el.addEventListener('click', ()=> showPanel(el.dataset.tab)));
  window.scrollTo({top:0, behavior:'smooth'});
  history.replaceState(null,'','#'+id);
}
