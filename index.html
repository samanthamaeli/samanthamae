<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sam's space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Oswald:wght@400;500;600;700&family=Special+Elite&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   CONFIG NOTE: all of Sam's editable personal data lives in the
   DATA object near the top of the <script> at the bottom of this
   file. Design/markup below never needs to be touched to update
   content — just edit DATA.
   ============================================================ */

:root{
  --ink:#0c0a0b;
  --ink-2:#141011;
  --paper:#efe6d8;
  --paper-dim:#d9cfc0;
  --blood:#a3181f;
  --blood-bright:#c62430;
  --rust:#5c2229;
  --gold:#b98a3d;
  --line: rgba(239,230,216,0.18);
  --shadow: rgba(0,0,0,0.6);
  --font-display: 'Playfair Display', serif;
  --font-mono: 'Special Elite', monospace;
  --font-condensed: 'Oswald', sans-serif;
  --font-script: 'Caveat', cursive;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-condensed);
  min-height:100vh;
  overflow-x:hidden;
}

/* film grain overlay */
.grain{
  position:fixed; inset:0; pointer-events:none; z-index:9999;
  opacity:0.05; mix-blend-mode:overlay;
}

/* red gel ambient light */
body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 900px 600px at 15% -5%, rgba(163,24,31,0.35), transparent 60%),
    radial-gradient(ellipse 700px 500px at 105% 15%, rgba(90,20,25,0.25), transparent 55%);
}

a{color:inherit;}

::selection{ background:var(--blood); color:var(--paper); }

/* ---------------- Scrollbar ---------------- */
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:var(--rust); border-radius:0;}

/* ---------------- Top marquee strip ---------------- */
.marquee{
  position:relative; z-index:5;
  background:var(--blood);
  color:var(--paper);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  overflow:hidden;
  white-space:nowrap;
  padding:5px 0;
  border-bottom:1px solid #000;
}
.marquee span{display:inline-block; padding-right:60px; animation: scrollmarquee 28s linear infinite;}
@keyframes scrollmarquee{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

/* ---------------- Header / ticket nav ---------------- */
header{
  position:relative; z-index:5;
  padding:26px 5vw 10px;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:16px;
}
.wordmark{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:600;
  font-size:clamp(22px,3vw,30px);
  letter-spacing:0.02em;
}
.wordmark small{
  display:block;
  font-family:var(--font-mono);
  font-style:normal;
  font-size:10px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--paper-dim);
  margin-top:2px;
}

nav.tabs{
  display:flex; gap:10px; flex-wrap:wrap;
  position:relative; z-index:5;
  padding:0 5vw 22px;
}
.tab{
  position:relative;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:10px 16px 10px 14px;
  cursor:pointer;
  border:none;
  clip-path: polygon(0 0, 100% 0, 100% 70%, 96% 100%, 0 100%);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  display:flex; align-items:center; gap:8px;
}
.tab::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:var(--ink);
  opacity:0.25;
}
.tab:hover{ transform:translateY(-2px); }
.tab.active{
  background:var(--blood-bright);
  color:var(--paper);
}
.tab.active::before{ background:var(--paper); opacity:0.8; }

/* ---------------- Main stage ---------------- */
main{
  position:relative; z-index:2;
  padding:10px 5vw 90px;
  max-width:1180px;
  margin:0 auto;
}
.panel{ display:none; animation:fadein 0.35s ease; }
.panel.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--blood-bright);
  margin-bottom:8px;
}
h1.page-title{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:700;
  font-size:clamp(34px,6vw,64px);
  margin:0 0 6px;
  line-height:1.02;
}
.page-sub{
  color:var(--paper-dim);
  font-size:14px;
  margin-bottom:36px;
  max-width:520px;
}

/* ---------------- HOME ---------------- */
.admit-one{
  border:2px dashed var(--paper-dim);
  padding:44px clamp(20px,5vw,64px);
  text-align:center;
  position:relative;
  margin:20px 0 50px;
  background:linear-gradient(180deg, rgba(163,24,31,0.08), transparent 60%);
}
.admit-one::before, .admit-one::after{
  content:"";
  position:absolute; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:50%;
  background:var(--ink);
  border:2px dashed var(--paper-dim);
}
.admit-one::before{ left:-14px; }
.admit-one::after{ right:-14px; }
.admit-one .stub-label{
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
  color:var(--blood-bright);
}
.admit-one h2{
  font-family:var(--font-display);
  font-style:italic;
  font-size:clamp(30px,6vw,58px);
  margin:10px 0;
}
.admit-one p{
  font-family:var(--font-script);
  font-size:22px;
  color:var(--paper-dim);
  margin:0;
}

.grid-3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:22px; margin-top:20px; }
.doorway{
  border:1px solid var(--line);
  padding:22px 20px;
  position:relative;
  background:rgba(255,255,255,0.02);
  cursor:pointer;
  transition:border-color 0.2s ease, background 0.2s ease;
}
.doorway:hover{ border-color:var(--blood-bright); background:rgba(163,24,31,0.06); }
.doorway .num{
  font-family:var(--font-mono);
  font-size:11px; color:var(--gold); letter-spacing:0.1em;
}
.doorway h3{
  font-family:var(--font-display); font-style:italic;
  font-size:22px; margin:8px 0 6px;
}
.doorway p{ font-size:13px; color:var(--paper-dim); margin:0; line-height:1.5;}

/* ---------------- Polaroid ---------------- */
.polagrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:30px; }
.polaroid{
  background:var(--paper);
  color:var(--ink);
  padding:14px 14px 18px;
  box-shadow:6px 8px 0 rgba(0,0,0,0.45);
  transform:rotate(var(--r,-1.5deg));
  position:relative;
}
.polaroid:nth-child(2n){ --r:1.5deg; }
.polaroid:nth-child(3n){ --r:-0.8deg; }
.polaroid .tape{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
  width:70px; height:22px;
  background:rgba(239,230,216,0.55);
  border:1px solid rgba(0,0,0,0.05);
}
.polaroid .photo{
  width:100%; aspect-ratio:1/1;
  background:linear-gradient(135deg,#2b2426,#0c0a0b);
  background-size:cover; background-position:center;
  margin-bottom:12px;
  display:flex; align-items:center; justify-content:center;
  color:var(--paper-dim); font-family:var(--font-mono); font-size:11px; text-align:center; padding:10px;
}
.polaroid .cap-title{
  font-family:var(--font-script); font-size:22px; font-weight:600; line-height:1.1;
}
.polaroid .cap-sub{ font-size:12px; color:#5c4f45; margin:4px 0 10px; }
.polaroid a.link-btn{
  display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
  text-transform:uppercase; text-decoration:none; color:var(--paper);
  background:var(--blood-bright); padding:7px 12px;
}

.add-form{
  border:1px solid var(--line);
  padding:20px;
  margin-bottom:34px;
  background:rgba(255,255,255,0.02);
}
.add-form .eyebrow{ margin-bottom:14px; }
.add-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:10px;}
.add-form input, .add-form textarea{
  background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
  font-family:var(--font-condensed); font-size:13px; padding:10px 12px; width:100%;
}
.add-form textarea{ min-height:70px; resize:vertical; }
.add-form button{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
  background:var(--gold); color:#1a1310; border:none; padding:11px 20px; cursor:pointer;
}
.add-form button:hover{ background:#cf9d49; }

/* ---------------- ID card (Charles / handoff) ---------------- */
.id-card{
  border:1px solid var(--line);
  background:rgba(255,255,255,0.02);
  padding:0;
  margin-bottom:26px;
  overflow:hidden;
}
.id-card .id-head{
  background:var(--blood);
  padding:12px 20px;
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
  display:flex; justify-content:space-between;
}
.id-card .id-body{ padding:22px 24px; }
.field-row{
  display:grid; grid-template-columns:180px 1fr;
  gap:14px;
  padding:11px 0;
  border-bottom:1px dotted var(--line);
  font-size:14px;
}
.field-row:last-child{ border-bottom:none; }
.field-label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--gold);
}
.field-value{ color:var(--paper); }
.field-value.placeholder{ color:var(--paper-dim); font-style:italic; }

.warn-strip{
  border-left:3px solid var(--blood-bright);
  background:rgba(163,24,31,0.1);
  padding:12px 16px;
  font-size:13px;
  margin:16px 0;
  color:var(--paper);
}
.warn-strip b{ color:#ff8b8f; }

/* ---------------- Recipe cards ---------------- */
.recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px; }
.recipe-card{
  border:1px solid var(--line);
  background:rgba(255,255,255,0.02);
}
.recipe-card .rc-head{
  padding:16px 18px;
  border-bottom:1px dashed var(--line);
}
.recipe-card .rc-head .num{ font-family:var(--font-mono); font-size:10px; color:var(--gold); letter-spacing:0.15em;}
.recipe-card h3{ font-family:var(--font-display); font-style:italic; margin:6px 0 0; font-size:22px;}
.recipe-card .rc-body{ padding:16px 18px; font-size:13px; color:var(--paper-dim); line-height:1.6; white-space:pre-line;}
.recipe-card .rc-tag{
  display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
  background:var(--rust); color:var(--paper); padding:4px 8px; margin-top:10px; text-transform:uppercase;
}

/* ---------------- Journal ---------------- */
.lock-screen{
  border:2px dashed var(--paper-dim);
  max-width:420px; margin:40px auto; padding:40px 30px; text-align:center;
}
.lock-screen .icon{ font-size:34px; margin-bottom:10px; }
.lock-screen h2{ font-family:var(--font-display); font-style:italic; font-size:28px; margin:0 0 6px;}
.lock-screen p{ font-size:13px; color:var(--paper-dim); margin-bottom:20px;}
.lock-screen input{
  width:100%; background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
  padding:12px; font-family:var(--font-mono); text-align:center; letter-spacing:0.3em; margin-bottom:12px;
}
.lock-screen button{
  width:100%; background:var(--blood-bright); color:var(--paper); border:none; padding:13px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer;
}
.lock-screen .err{ color:#ff8b8f; font-size:12px; height:16px; margin-top:8px; }

.entry{
  border-left:3px solid var(--gold);
  padding:14px 18px;
  margin-bottom:16px;
  background:rgba(255,255,255,0.02);
}
.entry .entry-date{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; color:var(--paper-dim); text-transform:uppercase; }
.entry .entry-text{ margin-top:8px; font-size:14px; line-height:1.6; white-space:pre-line; }
.lock-btn{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--paper-dim); padding:8px 14px; cursor:pointer;
  float:right;
}

/* ---------------- Thoughts ---------------- */
.thought{
  border-bottom:1px dotted var(--line);
  padding:20px 0;
  display:grid; grid-template-columns:60px 1fr; gap:16px;
}
.thought .t-num{ font-family:var(--font-mono); font-size:22px; color:var(--rust); }
.thought .t-text{ font-family:var(--font-script); font-size:23px; line-height:1.35; color:var(--paper);}
.thought .t-date{ font-family:var(--font-mono); font-size:10px; color:var(--paper-dim); margin-top:6px; letter-spacing:0.1em;}

footer{
  position:relative; z-index:2;
  text-align:center;
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--paper-dim); padding:30px 20px 50px;
  border-top:1px solid var(--line);
}

/* ---------------- Splash / entry screen ---------------- */
#splash{
  position:fixed; inset:0; z-index:10000;
  background:#000 url('assets/splash.jpg') center center / cover no-repeat;
  cursor:pointer;
  display:flex; align-items:flex-end; justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
}
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .enter-hint{
  position:absolute;
  left:50%; top:48.5%;
  transform:translate(-50%,-50%);
  width:120px; height:44px;
  /* invisible hit-zone over the baked-in ENTER text; whole splash is clickable too */
}
#splash .tap-hint{
  margin-bottom:6vh;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--paper-dim);
  opacity:0.8;
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }

@media(max-width:640px){
  .field-row{ grid-template-columns:1fr; gap:2px; }
  nav.tabs{ overflow-x:auto; flex-wrap:nowrap; padding-bottom:16px; }
  .tab{ flex:0 0 auto; }
}
</style>
</head>

  try{
    const raw = localStorage.getItem(key);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed) && parsed.length) return parsed; }
  }catch(e){}
  return fallback;
}
function saveList(key, list){
  try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){}
}

let wishlist = loadList(STORE_KEYS.wishlist, DATA.wishlist);
let recipes = loadList(STORE_KEYS.recipes, DATA.recipes);
let thoughts = loadList(STORE_KEYS.thoughts, DATA.thoughts);
let journalEntries = loadList(STORE_KEYS.journal, []);

const TABS = [
  { id:"home", label:"Home" },
  { id:"charles", label:"Charles" },
  { id:"me", label:"About Me" },
  { id:"wishlist", label:"Wishlist" },
  { id:"recipes", label:"Recipes" },
  { id:"journal", label:"Journal" },
  { id:"thoughts", label:"Thoughts" }
];

function todayStr(){
  return new Date().toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}

function renderNav(activeId){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t => `<button class="tab ${t.id===activeId?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=> showPanel(btn.dataset.tab));
  });
}

function fieldRows(rows){
  return rows.map(r=>`
    <div class="field-row">
      <div class="field-label">${r.label}</div>
      <div class="field-value ${r.placeholder?'placeholder':''}">${r.value}</div>
    </div>`).join('');
}

function panelHome(){
  return `
    <div class="eyebrow">// 001</div>
    <h1 class="page-title">welcome in.</h1>
    <p class="page-sub">Everything about my world, filed in one place — for me, and for whoever needs the handoff.</p>

    <div class="admit-one">
      <div class="stub-label">admit one</div>
      <h2>sam's world</h2>
      <p>a life, organized like a backstage pass</p>
    </div>

    <div class="grid-3">
      <div class="doorway" data-tab="charles"><div class="num">02</div><h3>Charles</h3><p>Care notes, vet + insurance info, in case anyone else is on dog duty.</p></div>
      <div class="doorway" data-tab="me"><div class="num">03</div><h3>About Me</h3><p>Sizes, staples, the small stuff worth knowing — the real handoff doc.</p></div>
      <div class="doorway" data-tab="wishlist"><div class="num">04</div><h3>Wishlist</h3><p>Things I want, pinned with a photo and a little context.</p></div>
      <div class="doorway" data-tab="recipes"><div class="num">05</div><h3>Recipes</h3><p>What's cooking, kept somewhere better than a screenshot folder.</p></div>
      <div class="doorway" data-tab="journal"><div class="num">06</div><h3>Journal</h3><p>Locked. Just mine.</p></div>
      <div class="doorway" data-tab="thoughts"><div class="num">07</div><h3>Thoughts</h3><p>Loose lines, half-formed ideas, from the vault.</p></div>
    </div>
  `;
}

function panelCharles(){
  const c = DATA.charles;
  return `
    <div class="eyebrow">// 002</div>
    <h1 class="page-title">Charles</h1>
    <p class="page-sub">Everything anyone would need to know if they were on dog duty.</p>

    <div class="warn-strip"><b>Handle with care —</b> nail trims are with Victoria at Barking Babies only. Do not brush the incisors.</div>

    <div class="id-card">
      <div class="id-head"><span>daily care</span><span>Charles Villavicencio</span></div>
      <div class="id-body">${fieldRows(c.care)}</div>
    </div>

    <div class="id-card">
      <div class="id-head"><span>vet on file</span><span>&nbsp;</span></div>
      <div class="id-body">
        ${fieldRows([
          { label:"Clinic", value:c.vet.clinic },
          { label:"Phone", value:c.vet.phone },
          { label:"Emergency clinic", value:c.vet.emergencyClinic, placeholder:c.vet.emergencyClinic.startsWith('[') },
          { label:"Emergency phone", value:c.vet.emergencyPhone, placeholder:c.vet.emergencyPhone.startsWith('[') }
        ])}
      </div>
    </div>

    <div class="id-card">
      <div class="id-head"><span>insurance — Fetch Pet Insurance</span><span>${c.insurance.policyNumber}</span></div>
      <div class="id-body">
        ${fieldRows([
          { label:"Annual premium", value:c.insurance.annualPremium },
          { label:"Deductible", value:c.insurance.deductible },
          { label:"Reimbursement", value:c.insurance.reimbursement },
          { label:"Annual coverage limit", value:c.insurance.annualLimit },
          { label:"Policy start", value:c.insurance.startDate },
          { label:"Renewal date", value:c.insurance.renewalDate },
          { label:"Portal login", value:c.insurance.portalLogin },

        ])}
      </div>
    </div>

    <div class="id-card">
      <div class="id-head"><span>legal / ID</span><span>&nbsp;</span></div>
      <div class="id-body">
        ${fieldRows([
          { label:"Birthday", value:c.legal.birthday },
          { label:"Microchip", value:c.legal.microchip },
          { label:"Address", value:c.legal.address }
        ])}
      </div>
    </div>
  `;

function panelMe(){
  return `
    <div class="eyebrow">// 003</div>
    <h1 class="page-title">about me</h1>
    <p class="page-sub">The handoff doc — if someone needed to know what to get me, or how to take care of me.</p>
    <div class="id-card">
      <div class="id-head"><span>the essentials</span><span>${DATA.name}</span></div>
      <div class="id-body">${fieldRows(DATA.aboutMe)}</div>
    </div>
  `;
}

function panelWishlist(){
  const cards = wishlist.map((w,i)=>`
    <div class="polaroid">
      <div class="tape"></div>
      <div class="photo" style="${w.img?`background-image:url('${w.img}')`:''}">${w.img?'':'photo goes here'}</div>
      <div class="cap-title">${w.title}</div>
      <div class="cap-sub">${w.note||''}</div>
      ${w.link?`<a class="link-btn" href="${w.link}" target="_blank" rel="noopener">view</a>`:''}
    </div>`).join('');

  return `
    <div class="eyebrow">// 004</div>
    <h1 class="page-title">wishlist</h1>
    <p class="page-sub">Pinned things, with a picture and a little why.</p>

    <div class="add-form">
      <div class="eyebrow">pin something new</div>
      <div class="row">
        <input id="wl-title" placeholder="What is it?">
        <input id="wl-link" placeholder="Link (optional)">
      </div>
      <div class="row">
        <input id="wl-img" placeholder="Image URL (optional)">
        <input id="wl-note" placeholder="Short note">
      </div>
      <button onclick="addWishlist()">Pin it</button>
    </div>

    <div class="polagrid">${cards}</div>
  `;
}

function panelRecipes(){
  const cards = recipes.map(r=>`
    <div class="recipe-card">
      <div class="rc-head"><div class="num">recipe</div><h3>${r.title}</h3></div>
      <div class="rc-body">${r.body}${r.tag?`<div><span class="rc-tag">${r.tag}</span></div>`:''}</div>
    </div>`).join('');

  return `
    <div class="eyebrow">// 005</div>
    <h1 class="page-title">recipes</h1>
    <p class="page-sub">Kiss the chef — the ones worth keeping.</p>

    <div class="add-form">
      <div class="eyebrow">add a recipe</div>
      <div class="row">
        <input id="rc-title" placeholder="Recipe name">
        <input id="rc-tag" placeholder="Tag (e.g. staple, dinner party)">
      </div>
      <textarea id="rc-body" placeholder="Ingredients + steps"></textarea>
      <button onclick="addRecipe()">Save recipe</button>
    </div>

    <div class="recipe-grid">${cards}</div>
  `;
}

function panelJournal(){
  const unlocked = sessionStorage.getItem(STORE_KEYS.unlocked) === '1';
  if(!unlocked){
    return `
      <div class="eyebrow">// 006</div>
      <h1 class="page-title">journal</h1>
      <p class="page-sub">Locked. Just mine.</p>
      <div class="lock-screen">
        <div class="icon">🔒</div>
        <h2>enter the password</h2>
        <p>this is a soft lock, not a vault — enough to keep it private.</p>
        <input type="password" id="journal-pw" placeholder="•••••••••">
        <button onclick="tryUnlock()">Unlock</button>
        <div class="err" id="journal-err"></div>
      </div>
    `;
  }
  const entries = journalEntries.slice().reverse().map(e=>`
    <div class="entry">
      <div class="entry-date">${e.date}</div>
      <div class="entry-text">${e.text}</div>
    </div>`).join('') || `<p style="color:var(--paper-dim);font-size:13px;">No entries yet — write the first one below.</p>`;

  return `
    <div class="eyebrow">// 006</div>
    <button class="lock-btn" onclick="lockJournal()">Lock</button>
    <h1 class="page-title">journal</h1>
    <p class="page-sub">Unlocked for this session.</p>

    <div class="add-form">
      <div class="eyebrow">new entry</div>
      <textarea id="jr-text" placeholder="What's on your mind..."></textarea>
      <button onclick="addJournal()">Write it down</button>
    </div>

    ${entries}
  `;
}

function panelThoughts(){
  const items = thoughts.slice().reverse().map((t,i)=>`
    <div class="thought">
      <div class="t-num">${String(thoughts.length-i).padStart(2,'0')}</div>
      <div>
        <div class="t-text">${t.text}</div>
        ${t.date?`<div class="t-date">${t.date}</div>`:''}
      </div>
    </div>`).join('');

  return `
    <div class="eyebrow">// 007</div>
    <h1 class="page-title">from the vault</h1>
    <p class="page-sub">Loose lines. Half-formed ideas. A running collection of thoughts.</p>

    <div class="add-form">
      <div class="eyebrow">add a thought</div>
      <textarea id="th-text" placeholder="Write it before it slips..."></textarea>
      <button onclick="addThought()">Drop it in</button>
    </div>

    ${items}
  `;
}

const PANEL_RENDERERS = {
  home: panelHome, charles: panelCharles, me: panelMe, wishlist: panelWishlist,
  recipes: panelRecipes, journal: panelJournal, thoughts: panelThoughts
};

function showPanel(id){
  renderNav(id);
  const stage = document.getElementById('mainStage');
  stage.innerHTML = `<div class="panel active">${PANEL_RENDERERS[id]()}</div>`;
  stage.querySelectorAll('.doorway[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=> showPanel(el.dataset.tab));
  });
  window.scrollTo({top:0, behavior:'smooth'});
  history.replaceState(null,'','#'+id);
}

/* ---- add-item handlers ---- */
function addWishlist(){
  const title = document.getElementById('wl-title').value.trim();
  if(!title) return;
  const item = {
    title, link: document.getElementById('wl-link').value.trim(),
    img: document.getElementById('wl-img').value.trim(),
    note: document.getElementById('wl-note').value.trim()
  };
  if(wishlist.length===1 && wishlist[0].title==="add your first find") wishlist = [];
  wishlist.push(item);
  saveList(STORE_KEYS.wishlist, wishlist);
  showPanel('wishlist');
}

function addRecipe(){
  const title = document.getElementById('rc-title').value.trim();
  const body = document.getElementById('rc-body').value.trim();
  if(!title || !body) return;
  const item = { title, tag: document.getElementById('rc-tag').value.trim(), body };
  if(recipes.length===1 && recipes[0].title==="add your first recipe") recipes = [];
  recipes.push(item);
  saveList(STORE_KEYS.recipes, recipes);
  showPanel('recipes');
}

function addThought(){
  const text = document.getElementById('th-text').value.trim();
  if(!text) return;
  if(thoughts.length===1 && thoughts[0].text==="this page is listening.") thoughts = [];
  thoughts.push({ text, date: todayStr() });
  saveList(STORE_KEYS.thoughts, thoughts);
  showPanel('thoughts');
}

function addJournal(){
  const text = document.getElementById('jr-text').value.trim();
  if(!text) return;
  journalEntries.push({ text, date: todayStr() });
  saveList(STORE_KEYS.journal, journalEntries);
  showPanel('journal');
}

function tryUnlock(){
  const val = document.getElementById('journal-pw').value;
  if(val === DATA.journalPassword){
    sessionStorage.setItem(STORE_KEYS.unlocked,'1');
    showPanel('journal');
  }else{
    document.getElementById('journal-err').textContent = 'wrong password — try again';
  }
}
function lockJournal(){
  sessionStorage.removeItem(STORE_KEYS.unlocked);
  showPanel('journal');
}

document.getElementById('buildDate').textContent = todayStr();

const startTab = (location.hash||'').replace('#','') || 'home';
showPanel(TABS.some(t=>t.id===startTab) ? startTab : 'home');

/* ---- splash / entry screen ---- */
const SPLASH_KEY = 'sam_entered';
function enterSite(){
  sessionStorage.setItem(SPLASH_KEY,'1');
  document.getElementById('splash').classList.add('hidden');
}
if(sessionStorage.getItem(SPLASH_KEY) === '1'){
  document.getElementById('splash').classList.add('hidden');
}
</script>
