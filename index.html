function scaleAmount(line,factor){
  if(factor===1) return line;
  const m=line.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m) return line;
  let val;
  if(m[1].indexOf(" ")>0 && m[1].indexOf("/")>0){ const p=m[1].split(/\s+/); const fr=p[1].split("/"); val=parseFloat(p[0])+parseFloat(fr[0])/parseFloat(fr[1]); }
  else if(m[1].indexOf("/")>0){ const fr=m[1].split("/"); val=parseFloat(fr[0])/parseFloat(fr[1]); }
  else val=parseFloat(m[1]);
  if(isNaN(val)) return line;
  return fmtNum(val*factor)+" "+m[2];
}
function fmtNum(n){
  const whole=Math.floor(n+1e-9), frac=n-whole;
  const table=[[0.125,"1/8"],[0.25,"1/4"],[0.333,"1/3"],[0.375,"3/8"],[0.5,"1/2"],[0.625,"5/8"],[0.666,"2/3"],[0.75,"3/4"],[0.875,"7/8"]];
  for(const t of table){ if(Math.abs(frac-t[0])<0.04) return (whole?whole+" ":"")+t[1]; }
  if(frac<0.04) return String(whole);
  return (Math.round(n*100)/100).toString();
}

/* Parses a date the way a person writes one. A bare 2026-08-17 is read as a
   local date, not UTC, so it does not slide to the previous day out here. */
function parseLooseDate(s){
  if(!s) return null;
  s=String(s).trim(); if(!s) return null;
  const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; }
  const d2=new Date(s); return isNaN(d2)?null:d2;
}
/* The Date field is the entry's real date. The iso stamp is only when it was
   typed, so it is the fallback — otherwise backdating an entry does nothing. */
function entryDate(e){
  const d=parseLooseDate(e.date); if(d) return d;
  if(e.iso){ const d2=new Date(e.iso); if(!isNaN(d2)) return d2; }
  return null;
}

  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0;
  return ((Math.abs(h)%9)-4); // -4deg .. +4deg
}

async function toggleRec(){

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Voice notes need microphone access, which is not available here."); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});

    mediaRecorder.ondataavailable=ev=>chunks.push(ev.data);

function hashPw(s){
  let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; }
  let h2=52711;
  for(let i=s.length-1;i>=0;i--){ h2=((h2<<5)+h2^s.charCodeAt(i))|0; }
  return (h>>>0).toString(36)+"-"+(h2>>>0).toString(36);
}
function currentPwHash(){
  const stored=localStorage.getItem("sam_pwhash");
  return stored || DATA.journalPasswordHash;
}
function tryUnlock(){
  if(hashPw(document.getElementById("j-pw").value)===currentPwHash()){ sessionStorage.setItem(K.unlocked,"1"); showPanel("journal"); }

}

  if(hashPw(cur)!==currentPwHash()){ alert("Current password is not right."); return; }
  if(nw.length<4){ alert("Pick something at least 4 characters."); return; }
  saveRaw("sam_pwhash",hashPw(nw));
  sessionStorage.removeItem(K.unlocked);
  alert("Password changed. The journal is locked again.");
  showPanel("backup");
}

}

function exportAll(){
  const dump={};
  Object.keys(localStorage).forEach(k=>{ if(k.indexOf("sam_")===0) dump[k]=localStorage.getItem(k); });
  const payload={ _app:"sams-space", _version:1, _exported:nowISO(), data:dump };
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="sams-space-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  localStorage.setItem("sam_lastbackup", nowISO());
}
async function shrinkAllPhotos(){
  if(!confirm("Re-compress all existing photos on this site?\n\nThis keeps the smaller copy of each and cannot make a photo worse. Export a backup first if you want to be safe.")) return;
  const before=storageUsage(); let seen=0, changed=0;
  const shrink=async(s)=>{ if(!s||s.indexOf("data:image/")!==0) return s; seen++; const out=await compressDataURL(s); if(out!==s) changed++; return out; };
  for(const w of wishlist){ w.img=await shrink(w.img); }
  save(K.wishlist,wishlist);
  for(const b of visionBoards){ for(const it of b.items){ it.src=await shrink(it.src); } }
  save(K.vision,visionBoards);
  for(const p of photos){ p.img=await shrink(p.img); }
  save(K.photos,photos);
  for(const c of concerts){ c.img=await shrink(c.img); }
  save(K.concerts,concerts);
  for(const e of journalEntries){ if(e.images){ for(let i=0;i<e.images.length;i++){ e.images[i]=await shrink(e.images[i]); } } }
  save(K.journal,journalEntries);
  for(const e of travelEntries){ if(e.images){ for(let i=0;i<e.images.length;i++){ e.images[i]=await shrink(e.images[i]); } } }
  save(K.travel,travelEntries);
  for(const ct of customTabs){
    if(ct.type==="board"){ const sk="sam_cboard_"+ct.id; const l=load(sk,[]); for(const it of l){ it.img=await shrink(it.img); } save(sk,l); }
    if(ct.type==="diary"){ const sk="sam_cdiary_"+ct.id; const l=load(sk,[]); for(const it of l){ if(it.images){ for(let i=0;i<it.images.length;i++){ it.images[i]=await shrink(it.images[i]); } } } save(sk,l); }
  }
  const saved=Math.max(0, before-storageUsage());
  alert("Done. Re-compressed "+changed+" of "+seen+" photo"+(seen===1?"":"s")+".\nFreed "+fmtBytes(saved)+".");
  showPanel("backup");
}
function importAll(){
  const inp=document.getElementById("imp-file");
  if(!inp.files||!inp.files[0]){ alert("Choose a backup file first."); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||p._app!=="sams-space"||!p.data) throw new Error("not a valid backup");
      const n=Object.keys(p.data).length;
      if(!confirm("Restore this backup?\n\nExported: "+(p._exported||"unknown").slice(0,10)+"\nContains "+n+" record groups.\n\nEverything currently on the site will be replaced."))return;
      const keepSession=localStorage.getItem("sam_session");
      Object.keys(localStorage).forEach(k=>{ if(k.indexOf("sam_")===0) localStorage.removeItem(k); });
      Object.keys(p.data).forEach(k=>localStorage.setItem(k,p.data[k]));
      if(keepSession) localStorage.setItem("sam_session",keepSession);
      localStorage.setItem("sam_forcepush","1");
      alert("Restored. Reloading.");
      location.reload();
    }catch(err){ alert("Could not read that file — it does not look like a Sam's space backup."); }
  };
  r.readAsText(inp.files[0]);
}

function svgWrap(inner,defs){
  return '<svg viewBox="0 0 1200 190" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'+
    (defs||"")+inner+'</svg>';
}
function skyDefs(id,c1,c2){
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+c1+'"/><stop offset="100%" stop-color="'+c2+'"/></linearGradient></defs>';
}
function palm(x,y,s,fill){
  const f=[[-1,-0.55],[-0.72,-0.95],[0,-1.08],[0.72,-0.95],[1,-0.55]];
  let d='<path d="M'+x+' '+y+' q '+(3*s)+' '+(-26*s)+' '+(1*s)+' '+(-52*s)+'" stroke="'+fill+'" stroke-width="'+(2.4*s)+'" fill="none"/>';
  f.forEach(function(v){
    const tx=x+1*s, ty=y-52*s;
    d+='<path d="M'+tx+' '+ty+' q '+(v[0]*26*s)+' '+(v[1]*16*s)+' '+(v[0]*44*s)+' '+(v[1]*4*s)+
       ' q '+(-v[0]*20*s)+' '+(v[1]*10*s)+' '+(-v[0]*44*s)+' '+(-v[1]*4*s)+'" fill="'+fill+'"/>';
  });
  return d;
}
function star(x,y,r,col){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'"/>'; }
function frame(x,y,w,h,rot,col){
  return '<g transform="translate('+x+','+y+') rotate('+rot+')"><rect x="0" y="0" width="'+w+'" height="'+h+
    '" fill="rgba(242,235,223,0.05)" stroke="'+col+'" stroke-width="2"/></g>';
}

function allTabs(){
  return BUILTIN_TABS.concat(customTabs.map(c=>({id:"c-"+c.id,label:c.name}))).concat([{id:"newtab",label:"+ new tab",add:true}]);
}
let currentTab="home";
function tabBtn(t,active){
  const badge=(t.id==="inbox"&&inbox.length)?'<span class="badge">'+inbox.length+'</span>':"";
  const cls=["tab"]; if(t.id===active)cls.push("active"); if(t.add)cls.push("addtab");
  return '<button class="'+cls.join(" ")+'" onclick="showPanel(\''+t.id+'\')">'+esc(t.label)+badge+'</button>';
}
function renderNav(active){
  const nav=document.getElementById("tabNav");
  nav.innerHTML=allTabs().map(t=>tabBtn(t,active)).join("");
  /* The strip scrolls sideways on a phone, so bring the current tab into view. */
  try{
    const on=nav.querySelector(".tab.active");
    if(on && on.offsetParent!==null && nav.scrollWidth>nav.clientWidth){
      const target=on.offsetLeft-(nav.clientWidth/2)+(on.offsetWidth/2);
      if(nav.scrollTo) nav.scrollTo({left:Math.max(0,target),behavior:"smooth"});
      else nav.scrollLeft=Math.max(0,target);
    }
  }catch(e){}
}

  travel:panelTravel, planner:panelPlanner, recipes:panelRecipes, journal:panelJournal, thoughts:panelThoughts,
  tags:panelTags, tagview:panelTagView, search:panelSearch, backup:panelBackup, newtab:panelNewTab
};
function showPanel(id,fromHistory){
  let html;
  if(id.indexOf("c-")===0){
    const ct=customTabs.find(c=>c.id===id.slice(2));
    if(ct){ html=panelCustom(ct); } else { id="home"; html=panelHome(); }
  } else if(ROUTES[id]){ html=ROUTES[id](); }
  else { id="home"; html=panelHome(); }
  const sameTab=(id===currentTab);
  const keepY=sameTab?window.scrollY:0;
  /* page header graphics removed — the per-tab backgrounds carry the atmosphere now */
  currentTab=id;
  renderNav(id);
  document.getElementById("mainStage").innerHTML='<div class="panel">'+html+'</div>';
  if(sameTab) window.scrollTo({top:keepY});
  else window.scrollTo({top:0,behavior:"smooth"});
  onChromeScroll();
  document.body.setAttribute("data-page", id.indexOf("c-")===0 ? "custom" : id);
  if(document.getElementById("mood-grid")) renderMoodGrid();
  if(document.getElementById("globe-svg")) initGlobe();
  else if(globeRAF){ cancelAnimationFrame(globeRAF); globeRAF=null; }
  if(fromHistory || sameTab) history.replaceState(null,"","#"+id);
  else history.pushState(null,"","#"+id);
}
/* the phone's back gesture should step back through tabs, not leave the site */
window.addEventListener("popstate",()=>{
  const id=(location.hash||"").replace("#","")||"home";
  if(id!==currentTab) showPanel(id,true);
});

/* ============================================================
   TRAVEL PLANNER
   A trip holds five lists: legs (at a glance), flights, days
   (itinerary), outfits, tasks (bookings & to-dos). Marking a
   trip complete moves it to the archive; the planner is then
   empty and ready for the next one.
   ============================================================ */
let plannerTrip=null, plannerView="glance";

function openTrip(id){ plannerTrip=id; plannerView="glance"; showPanel("planner"); }
function closeTrip(){ plannerTrip=null; showPanel("planner"); }
function setPlannerView(v){ plannerView=v; showPanel("planner"); }
function saveTrips(){ save(K.trips,trips); }

function tripRange(t){
  const a=(t.start||"").trim(), b=(t.end||"").trim();
  if(a&&b) return a+" \u2013 "+b;
  return a||b||"dates to come";
}
function tripDayCount(t){
  const a=parseLooseDate(t.start), b=parseLooseDate(t.end);
  if(a&&b&&b>=a) return Math.round((b-a)/86400000)+1;
  return (t.days||[]).length;
}
function tripStats(t){
  const legs=t.legs||[], tasks=t.tasks||[], fits=t.outfits||[];
  const done=["Done","Booked"];
  return {
    days: tripDayCount(t),
    dests: legs.map(l=>(l.dest||"").trim().toLowerCase()).filter(Boolean)
      .filter((v,i,a)=>a.indexOf(v)===i).length,
    booked: legs.filter(l=>(l.stay||"").trim() && (l.status==="Booked"||l.status==="Confirmed")).length,
    open: tasks.filter(k=>done.indexOf(k.status)<0).length,
    fits: fits.filter(f=>(f.outfit||"").trim()).length
  };
}
function tStatusClass(v){
  v=(v||"").toLowerCase();
  if(v==="done"||v==="booked"||v==="confirmed"||v==="ready") return "ok";
  if(v==="in progress"||v==="waiting"||v==="planning") return "wip";
  if(v==="high") return "hot";
  return "";
}
/* Tap a status or priority to move it along, rather than opening the editor. */
function tCycle(kind,tripId,id,field,cycleName){
  const st=plannerStore(kind+":"+tripId); if(!st) return;
  const it=st.list.find(x=>x.id===id); if(!it) return;
  const arr=T_CYCLES[cycleName]||[]; const i=arr.indexOf(it[field]);
  it[field]=arr[(i+1)%arr.length];
  saveTrips(); showPanel("planner");
}
function tChip(kind,tripId,id,field,val,cycleName){
  return '<button class="t-stat '+tStatusClass(val)+'" onclick="tCycle(\'' +kind+ '\',\'' +tripId+ '\',\'' +id+
    '\',\'' +field+ '\',\'' +cycleName+ '\')">'+esc(val||"\u2014")+'</button>';
}
function tRowTools(kind,tripId,id){
  return '<div class="t-tools">'+editBtn(kind+":"+tripId,id)+
    '<div onclick="tRemove(\'' +kind+ '\',\'' +tripId+ '\',\'' +id+ '\')">&times;</div></div>';
}
function tRemove(kind,tripId,id){
  const st=plannerStore(kind+":"+tripId); if(!st) return;
  const i=st.list.findIndex(x=>x.id===id); if(i<0) return;
  const it=st.list[i]; st.list.splice(i,1); saveTrips(); showPanel("planner");
  queueUndo("row removed",()=>{ const s2=plannerStore(kind+":"+tripId);
    if(s2){ s2.list.splice(Math.min(i,s2.list.length),0,it); saveTrips(); showPanel("planner"); } });
}
function tAdd(kind,tripId,obj){
  const st=plannerStore(kind+":"+tripId); if(!st) return;
  st.list.push(Object.assign({id:uid()},obj)); saveTrips(); showPanel("planner");
}
function tVal(id){ const el=document.getElementById(id); return el?(el.value||"").trim():""; }

/* ---------- trip lifecycle ---------- */
function addTrip(){
  const name=tVal("tp-name"); if(!name){ alert("Give the trip a name."); return; }
  const t={ id:uid(), name:name, subtitle:tVal("tp-where"), start:tVal("tp-start"), end:tVal("tp-end"),
    status:"planning", fav:false, tags:[], legs:[], flights:[], days:[], outfits:[], tasks:[],
    created:nowISO() };
  trips.push(t);
  const gen=document.getElementById("tp-gen");
  saveTrips();
  if(gen && gen.checked) tGenerateDays(t.id,true);
  plannerTrip=t.id; plannerView="glance"; showPanel("planner");
}
function completeTrip(id){
  const t=tripById(id); if(!t) return;
  if(!confirm("Mark \u201c"+t.name+"\u201d as done?\n\nIt moves to past trips. Everything in it is kept and you can reopen it any time.")) return;
  t.status="complete"; t.completed=nowISO(); saveTrips(); plannerTrip=null; showPanel("planner");
}
function reopenTrip(id){
  const t=tripById(id); if(!t) return;
  t.status="planning"; saveTrips(); showPanel("planner");
}
function removeTrip(id){
  const i=trips.findIndex(t=>t.id===id); if(i<0) return;
  const t=trips[i];
  if(!confirm("Delete \u201c"+t.name+"\u201d and everything in it?")) return;
  trips.splice(i,1); saveTrips();
  if(plannerTrip===id) plannerTrip=null;
  showPanel("planner");
  queueUndo("trip deleted",()=>{ trips.splice(Math.min(i,trips.length),0,t); saveTrips(); showPanel("planner"); });
}
function renameTrip(id){
  const t=tripById(id); if(!t) return;
  const n=prompt("Trip name",t.name); if(n===null) return;
  const nn=n.trim(); if(!nn) return;
  t.name=nn; saveTrips(); showPanel("planner");
}
/* Lays out one row per date between the start and end dates. */
function tGenerateDays(id,quiet){
  const t=tripById(id); if(!t) return;
  const a=parseLooseDate(t.start), b=parseLooseDate(t.end);
  if(!a||!b||b<a){ if(!quiet) alert("Add a start and end date to the trip first."); return; }
  if(!t.days) t.days=[];
  const have={};
  t.days.forEach(d=>{ const q=parseLooseDate(d.date); if(q) have[q.toDateString()]=1; });
  let n=0;
  const d=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  while(d<=b && n<200){
    if(!have[d.toDateString()]){
      t.days.push({ id:uid(),
        date:d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}),
        base:"", anchor:"", ideas:"", resv:"", todo:"", priority:"Medium", status:"Open", notes:"" });
      n++;
    }
    d.setDate(d.getDate()+1);
  }
  saveTrips();
  if(!quiet){ alert(n?("Added "+n+" day"+(n===1?"":"s")+"."):"Every date already has a row."); showPanel("planner"); }
}
/* Mirrors the itinerary into the outfit planner so the dates line up. */
function tOutfitsFromDays(id){
  const t=tripById(id); if(!t) return;
  if(!t.days||!t.days.length){ alert("Build the itinerary first, then this will match it."); return; }
  if(!t.outfits) t.outfits=[];
  const have={}; t.outfits.forEach(o=>{ have[(o.date||"").trim()]=1; });
  let n=0;
  tSortByDate(t.days).forEach(d=>{
    if(have[(d.date||"").trim()]) return;
    t.outfits.push({ id:uid(), date:d.date, dest:d.base||"", occasion:"", outfit:"", shoes:"",
      layers:"", status:"Not started", buy:"No", laundry:"", link:"" });
    n++;
  });
  saveTrips(); showPanel("planner");
  alert(n?("Added "+n+" outfit row"+(n===1?"":"s")+"."):"Every day already has an outfit row.");
}
function tSortByDate(list, year){
  const at=x=>{ let s=x.date||""; if(year && s && !hasYear(s)) s=s+", "+year;
    const d=parseLooseDate(s); return d?d.getTime():8.64e15; };
  return list.map((x,i)=>({x:x,i:i,t:at(x)})).sort((a,b)=> a.t-b.t || a.i-b.i ).map(o=>o.x);
}
function hasYear(s){ return /\b(19|20)\d{2}\b/.test(String(s||"")); }
function tripYear(t){
  const d=parseLooseDate(t&&t.start)||parseLooseDate(t&&t.end);
  return d?d.getFullYear():new Date().getFullYear();
}
/* Works out the weekday. When the date has no year (e.g. "Sep 10") it is read
   against the trip's year rather than defaulting to 2001. */
function tDow(s, year){
  if(!s) return "";
  let str=String(s);
  if(year && !hasYear(str)) str=str.replace(/\s*$/,"")+", "+year;
  const d=parseLooseDate(str);
  return d?d.toLocaleDateString("en-US",{weekday:"short"}):"";
}

/* ---------- paste-in from a spreadsheet ---------- */
const T_IMPORT={
  tleg:{ label:"at a glance",
    cols:[["dates",["dates","date"]],["nights",["nights"]],["dest",["destination","dest"]],
      ["stay",["stay","hotel","accommodation"]],["status",["status"]],["plan",["key plan","plan"]],
      ["travel",["travel","route"]],["notes",["notes","note"]]] },
  tflight:{ label:"flights",
    cols:[["date",["date"]],["route",["route","flight"]],["time",["time"]],["detail",["detail","details"]]] },
  tday:{ label:"itinerary",
    cols:[["date",["date"]],["base",["base","destination"]],["anchor",["main plan","anchor","plan"]],
      ["ideas",["optional","ideas"]],["resv",["reservation","time"]],["todo",["to-do","todo","task"]],
      ["priority",["priority"]],["status",["status"]],["notes",["notes","links","note"]]] },
  toutfit:{ label:"outfits",
    cols:[["date",["date"]],["dest",["destination","dest"]],["occasion",["occasion","vibe"]],
      ["outfit",["main outfit","outfit"]],["shoes",["shoes","bag"]],["layers",["layers","accessories"]],
      ["status",["status"]],["buy",["needs purchase","purchase","buy"]],
      ["laundry",["laundry","rewear"]],["link",["photo","product","link"]]] },
  ttask:{ label:"bookings & to-dos",
    cols:[["dest",["destination","dest"]],["cat",["category","cat"]],["task",["task","booking"]],
      ["due",["due"]],["status",["status"]],["priority",["priority"]],
      ["conf",["confirmation","address"]],["cost",["cost"]],["notes",["notes","link","note"]]] }
};
function tImport(kind,tripId){
  const box=document.getElementById("timp-"+kind); if(!box) return;
  const text=(box.value||"").trim();
  if(!text){ alert("Paste some rows first."); return; }
  const spec=T_IMPORT[kind]; const st=plannerStore(kind+":"+tripId); if(!spec||!st) return;
  const rows=parseCSV(text, text.indexOf("\t")>=0 ? "\t" : ",");
  if(!rows.length){ alert("Nothing to read in that."); return; }
  /* If the first row looks like headers, use it to match columns by name. */
  const head=rows[0].map(x=>(x||"").toLowerCase().trim());
  let map=null, start=0;
  const hits=spec.cols.filter(cc=>findCol(head,cc[1])>=0).length;
  if(hits>=2){ map={}; spec.cols.forEach(cc=>{ map[cc[0]]=findCol(head,cc[1]); }); start=1; }
  let n=0;
  for(let r=start;r<rows.length;r++){
    const row=rows[r];
    if(!row.some(x=>(x||"").trim()!=="")) continue;
    const o={id:uid()};
    spec.cols.forEach((cc,i)=>{
      const at = map ? map[cc[0]] : i;
      o[cc[0]] = (at>=0 && row[at]!==undefined) ? String(row[at]).trim() : "";
    });
    if(!Object.keys(o).some(k=>k!=="id"&&o[k])) continue;
    st.list.push(o); n++;
  }
  saveTrips(); box.value="";
  showPanel("planner");
  alert(n?("Added "+n+" row"+(n===1?"":"s")+"."):"No rows found in that paste.");
}
function tImportBox(kind,tripId){
  return collapsibleForm("timpf-"+kind,"paste from a spreadsheet",
    '<div class="add-form"><div class="hint">Copy the rows out of your sheet (include the header row if you have one) and paste them here. Columns are matched by name where possible.</div>'+
    '<textarea id="timp-'+kind+'" placeholder="Paste rows here" style="min-height:110px;"></textarea>'+
    '<button class="btn btn-sm" onclick="tImport(\'' +kind+ '\',\'' +tripId+ '\')">Add these rows</button></div>');
}

/* ---------- the panel ---------- */
function panelPlanner(){
  const t = plannerTrip ? tripById(plannerTrip) : null;
  return t ? plannerTripView(t) : plannerList();
}

function plannerList(){
  const active=trips.filter(t=>t.status!=="complete");

    const s=tripStats(t), done=t.status==="complete";
    return '<div class="trip-card'+(done?" past":"")+'">'+
      '<div class="tc-top"><div class="tc-head"><div class="tc-name" onclick="openTrip(\'' +t.id+ '\')">'+esc(t.name)+'</div>'+
      (t.subtitle?'<div class="tc-sub">'+esc(t.subtitle)+'</div>':"")+
      '<div class="tc-dates">'+esc(tripRange(t))+'</div></div>'+starHTML("trips",t.id,t.fav)+'</div>'+
      '<div class="tc-stats">'+
        '<div><b>'+s.days+'</b><span>days</span></div>'+
        '<div><b>'+s.dests+'</b><span>stops</span></div>'+
        '<div><b>'+s.booked+'</b><span>booked</span></div>'+
        '<div><b>'+s.open+'</b><span>open to-dos</span></div>'+
      '</div>'+
      '<div class="tc-acts"><button class="chip" onclick="openTrip(\'' +t.id+ '\')">open</button>'+
      (done?'<button class="chip ghost" onclick="reopenTrip(\'' +t.id+ '\')">reopen</button>'
           :'<button class="chip ghost" onclick="completeTrip(\'' +t.id+ '\')">mark complete</button>')+
      '<button class="chip ghost" onclick="renameTrip(\'' +t.id+ '\')">rename</button>'+
      '<button class="chip ghost danger" onclick="removeTrip(\'' +t.id+ '\')">delete</button></div></div>';
  };
  const form=collapsibleForm("tp-new","plan a new trip",
    '<div class="add-form">'+
    '<div class="row"><div><label>Trip name</label><input type="text" id="tp-name" placeholder="Europe 2026"></div>'+
    '<div><label>Where</label><input type="text" id="tp-where" placeholder="Italy \u00b7 Greece \u00b7 T&uuml;rkiye"></div></div>'+
    '<div class="row"><div><label>Start date</label><input type="text" id="tp-start" placeholder="Sep 10, 2026"></div>'+
    '<div><label>End date</label><input type="text" id="tp-end" placeholder="Sep 27, 2026"></div></div>'+
    '<label class="tp-check"><input type="checkbox" id="tp-gen" checked> lay out a row for every date</label>'+
    '<button class="btn" onclick="addTrip()">Start planning</button></div>', !trips.length);

  const activeHTML = active.length
    ? active.map(card).join("")
    : '<p class="empty-msg">Nothing in the works. Start a trip and it will build itself out from the dates.</p>';

  const pastHTML = past.length
    ? '<div class="eyebrow" style="margin-top:52px;">past trips</div>'+past.map(card).join("")
    : "";

  return '<div class="eyebrow">15</div><h1 class="page-title">travel planner</h1>'+
    '<p class="page-sub">Everything for a trip in one place: the shape of it, the days, what you are wearing, and what still needs booking. Finished trips move to the archive and stay there.</p>'+
    form+activeHTML+pastHTML;
}

function plannerTripView(t){
  const s=tripStats(t);
  const views=[["glance","at a glance"],["days","itinerary"],["outfits","outfits"],["tasks","bookings & to-dos"]];
  const nav='<div class="subnav">'+views.map(v=>
    '<button class="chip '+(plannerView===v[0]?"active":"")+'" onclick="setPlannerView(\'' +v[0]+ '\')">'+v[1]+'</button>').join("")+'</div>';

  const pulse='<div class="t-pulse">'+
    [[s.days,"trip days"],[s.dests,"destinations"],[s.booked,"booked stays"],
     [s.open,"open to-dos"],[s.fits,"outfits planned"]]
    .map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>';

  let body="";
  if(plannerView==="glance") body=tGlance(t);
  else if(plannerView==="days") body=tDays(t);
  else if(plannerView==="outfits") body=tOutfits(t);
  else body=tTasks(t);

  return '<button class="t-back" onclick="closeTrip()">&larr; all trips</button>'+
    '<div class="eyebrow">15</div><h1 class="page-title">'+esc(t.name)+'</h1>'+
    '<p class="page-sub">'+esc([t.subtitle,tripRange(t)].filter(Boolean).join("  \u00b7  "))+
    (t.status==="complete"?'  \u00b7  <em>past trip</em>':"")+'</p>'+
    pulse+nav+body;
}

/* ----- at a glance: legs + flights ----- */
function tGlance(t){

  const addLeg=collapsibleForm("tp-leg","add a leg",

    '<div><label>Destination</label><input type="text" id="tl-dest"></div></div>'+
    '<div class="row"><div><label>Stay</label><textarea id="tl-stay"></textarea></div>'+
    '<div><label>Key plan</label><input type="text" id="tl-plan"></div>'+

    return '<div class="t-row compact"><div class="t-main">'+
      '<div class="t-title small">'+esc(f.route||"\u2014")+'</div>'+
      '<div class="t-meta">'+esc([f.date,f.time].filter(Boolean).join(" \u00b7 "))+'</div>'+
      (f.detail?'<div class="t-note">'+esc(f.detail)+'</div>':"")+
      '</div><div class="t-side">'+tRowTools("tflight",t.id,f.id)+'</div></div>';

  const addFlight=collapsibleForm("tp-fl","add a flight",

    '<div><label>Time</label><input type="text" id="tf-time" placeholder="13:30\u201308:05 +1"></div></div>'+
    '<div class="row"><div><label>Detail</label><textarea id="tf-detail"></textarea></div></div>'+
    '<button class="btn btn-sm" onclick="tAddFlight(\'' +t.id+ '\')">Add flight</button></div>');

  return '<div class="eyebrow" style="margin-top:34px;">the shape of it</div>'+addLeg+tImportBox("tleg",t.id)+rows+

function tAddLeg(id){
  const dest=tVal("tl-dest"), dates=tVal("tl-dates");

  tAdd("tflight",id,{date:tVal("tf-date"),route:r,time:tVal("tf-time"),detail:tVal("tf-detail")});

/* ----- itinerary ----- */
function tDays(t){
  const yr=tripYear(t);
  const list=tSortByDate(t.days||[], yr);
  const rows=list.length?list.map(d=>{
    if(isEditing("tday:"+t.id,d.id)) return '<div class="t-row editing">'+editFormHTML("tday:"+t.id,d)+'</div>';
    const dow=tDow(d.date, yr);
    return '<div class="t-row"><div class="t-date">'+esc(d.date||"\u2014")+
      (dow?'<span>'+esc(dow)+'</span>':"")+'</div>'+
      '<div class="t-main">'+
      (d.base?'<div class="t-base">'+esc(d.base)+'</div>':"")+
      (d.anchor?'<div class="t-title small">'+esc(d.anchor)+'</div>':'<div class="t-title small dim">nothing planned</div>')+
      (d.resv?'<div class="t-line"><i>booked</i> '+esc(d.resv)+'</div>':"")+
      (d.ideas?'<div class="t-line"><i>maybe</i> '+esc(d.ideas)+'</div>':"")+
      (d.todo?'<div class="t-line"><i>to-do</i> '+esc(d.todo)+'</div>':"")+
      (d.notes?'<div class="t-note">'+esc(d.notes)+'</div>':"")+
      '</div><div class="t-side">'+
      tChip("tday",t.id,d.id,"status",d.status,"day")+
      tChip("tday",t.id,d.id,"priority",d.priority,"pri")+

  const addTask=collapsibleForm("tp-task","add a to-do",

    '<div><label>Destination</label><input type="text" id="tt-dest" placeholder="All"></div></div>'+
    '<div class="row"><div><label>Category</label><select id="tt-cat">'+T_CATS.map(x=>'<option>'+x+'</option>').join("")+'</select></div>'+
    '<div><label>Priority</label><select id="tt-pri">'+T_PRIORITY.map(x=>'<option '+(x==="High"?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'+
    '<div><label>Due date</label><input type="text" id="tt-due"></div></div>'+
    '<button class="btn btn-sm" onclick="tAddTask(\'' +t.id+ '\')">Add to-do</button></div>');

  return filters+addTask+tImportBox("ttask",t.id)+rows;

  tAdd("ttask",id,{task:task,dest:tVal("tt-dest")||"All",cat:tVal("tt-cat")||"Other",
    due:tVal("tt-due"),status:"Not started",priority:tVal("tt-pri")||"Medium",conf:"",cost:"",notes:""});

/* ============================================================
   CLOUD SYNC (Supabase)

   The whole site still reads and writes localStorage exactly as
   before. This layer mirrors those writes up to a private table
   and pulls them down on every device. Nothing here is readable
   without signing in: the key below is the public "publishable"
   key, and the table's row-level rule limits every row to the
   account that wrote it.
   ============================================================ */
const SB_URL="https://hruabbqmsmflwdywtvop.supabase.co";
const SB_KEY="sb_publishable_kq0s9s6gFNnN6PyMqnkhQQ_erwXAaVO";
const SESS_KEY="sam_session", PEND_KEY="sam_pending", FORCE_KEY="sam_forcepush";
const NOSYNC=["sam_unlocked","sam_entered","sam_session","sam_pending","sam_forcepush"];
let cloudOn=false, pushTimer=null, pushing=false;

function syncable(k){ return k.indexOf("sam_")===0 && NOSYNC.indexOf(k)<0; }
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
function setSession(s){ if(s) localStorage.setItem(SESS_KEY,JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); }
function pendingKeys(){ try{ const a=JSON.parse(localStorage.getItem(PEND_KEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function setPending(a){ try{ localStorage.setItem(PEND_KEY,JSON.stringify(a)); }catch(e){} }

function cloudMark(key){
  if(!syncable(key)) return;
  const a=pendingKeys();
  if(a.indexOf(key)<0){ a.push(key); setPending(a); }
  if(cloudOn){ syncBadge("busy","saving"); clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush,900); }
}
function syncBadge(state,txt){
  const el=document.getElementById("syncpill"); if(!el) return;
  el.className="syncpill "+state; el.textContent=txt;
}

async function sbAuth(path,body){
  const r=await fetch(SB_URL+"/auth/v1/"+path,{method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||("sign-in failed ("+r.status+")"));
  return j;
}
function storeAuth(j){
  const old=getSession()||{};
  setSession({ at:j.access_token, rt:j.refresh_token,
    exp:Date.now()+((j.expires_in||3600)*1000),
    uid:(j.user&&j.user.id)||old.uid, email:(j.user&&j.user.email)||old.email });
}
async function sbToken(){
  let s=getSession(); if(!s) throw new Error("not signed in");
  if(Date.now()>(s.exp||0)-60000){ storeAuth(await sbAuth("token?grant_type=refresh_token",{refresh_token:s.rt})); s=getSession(); }
  return s.at;
}
async function sbRest(path,opts){
  const t=await sbToken();
  opts=opts||{};
  const h=Object.assign({"apikey":SB_KEY,"Authorization":"Bearer "+t,"Content-Type":"application/json"},opts.headers||{});
  const r=await fetch(SB_URL+"/rest/v1/"+path,Object.assign({},opts,{headers:h}));
  if(!r.ok){ let tx=""; try{ tx=await r.text(); }catch(e){} throw new Error("cloud "+r.status+" "+tx.slice(0,120)); }
  return r;
}
/* Photos make some rows large, so uploads go in size-capped batches. */
function chunkRows(rows,maxBytes){
  const out=[]; let cur=[], n=0;
  rows.forEach(r=>{ const sz=(r.value||"").length;
    if(cur.length && n+sz>maxBytes){ out.push(cur); cur=[]; n=0; }
    cur.push(r); n+=sz; });
  if(cur.length) out.push(cur);
  return out;
}
async function cloudPush(){
  if(!cloudOn || pushing) return true;
  const keys=pendingKeys();
  if(!keys.length){ syncBadge("ok","synced"); return true; }
  const s=getSession(); if(!s||!s.uid) return false;
  const stamp=new Date().toISOString();
  const rows=keys.filter(k=>localStorage.getItem(k)!==null)
    .map(k=>({user_id:s.uid,key:k,value:localStorage.getItem(k),updated_at:stamp}));
  pushing=true; syncBadge("busy","saving");
  try{
    for(const batch of chunkRows(rows,2500000)){
      await sbRest("space_data",{method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
        body:JSON.stringify(batch)});
    }
    setPending(pendingKeys().filter(k=>keys.indexOf(k)<0));
    syncBadge("ok","synced");
    return true;
  }catch(e){ syncBadge("bad","not saved"); return false; }
  finally{ pushing=false; }
}
/* Returns true if anything on this device actually changed. */
async function cloudPull(){
  const r=await sbRest("space_data?select=key,value",{method:"GET"});
  const rows=await r.json();
  const remote={}; (rows||[]).forEach(x=>{ remote[x.key]=x.value; });
  const rkeys=Object.keys(remote);
  if(!rkeys.length){ await cloudPushAll(false); return false; }
  let changed=false;
  rkeys.forEach(k=>{ if(syncable(k) && localStorage.getItem(k)!==remote[k]){
    try{ localStorage.setItem(k,remote[k]); changed=true; }catch(e){} } });
  const localOnly=Object.keys(localStorage).filter(k=>syncable(k)&&rkeys.indexOf(k)<0);
  if(localOnly.length){
    const a=pendingKeys(); localOnly.forEach(k=>{ if(a.indexOf(k)<0)a.push(k); }); setPending(a);
    await cloudPush();
  }
  return changed;
}
async function cloudPushAll(deleteMissing){
  const keys=Object.keys(localStorage).filter(syncable);
  const a=pendingKeys(); keys.forEach(k=>{ if(a.indexOf(k)<0)a.push(k); }); setPending(a);
  await cloudPush();
  if(deleteMissing && keys.length){
    try{ await sbRest("space_data?key=not.in.("+keys.map(encodeURIComponent).join(",")+")",{method:"DELETE"}); }catch(e){}
  }
}

/* ---------------- the gate ---------------- */
function gateShow(mode,msg){
  document.body.classList.add("locked");
  const f=document.getElementById("gate-form"), b=document.getElementById("gate-busy"),
        m=document.getElementById("gate-msg");
  if(f) f.style.display = mode==="login" ? "block" : "none";
  if(b) b.style.display = mode==="busy" ? "block" : "none";
  if(b && mode==="busy") b.textContent = msg||"opening";
  if(m) m.textContent = mode==="busy" ? "" : (msg||"");
}
async function doLogin(){
  const em=(document.getElementById("gate-email").value||"").trim();
  const pw=document.getElementById("gate-pw").value||"";
  if(!em||!pw){ gateShow("login","Enter your email and password."); return; }
  gateShow("busy","signing in");
  try{
    storeAuth(await sbAuth("token?grant_type=password",{email:em,password:pw}));
    sessionStorage.setItem(SPLASH,"1");
    await afterAuth();
  }catch(e){ gateShow("login", (e&&e.message)||"Could not sign in."); }
}
async function afterAuth(){
  cloudOn=true;
  gateShow("busy","loading your things");
  let ok=true;
  try{
    if(localStorage.getItem(FORCE_KEY)==="1"){ localStorage.removeItem(FORCE_KEY); await cloudPushAll(true); }
    else { await cloudPush(); await cloudPull(); }
  }catch(e){ ok=false; }
  document.body.classList.remove("locked");
  startSite();
  syncBadge(ok?"ok":"bad", ok?"synced":"offline");
}
function offlineEnter(){
  cloudOn=false;
  document.body.classList.remove("locked");
  startSite();
  syncBadge("bad","offline");
}
function signOut(){
  if(!confirm("Sign out on this device?\n\nEverything stays in the cloud. It also stays in this browser until you clear it.")) return;
  setSession(null);
  location.reload();
}
async function cloudBoot(){
  if(!getSession()){ gateShow("login",""); return; }
  gateShow("busy","opening");
  try{ await sbToken(); }
  catch(e){ setSession(null); gateShow("login","That sign-in expired. Please enter your password again."); return; }
  await afterAuth();
}

/* the tab strip only gains a veil once the page has moved */
function onChromeScroll(){
  const y=(typeof window!=="undefined" && window.scrollY)||0;
  document.body.classList.toggle("scrolled", y>18);
}
function startSite(){
  hydrateFromLocal();
  window.addEventListener("scroll",onChromeScroll,{passive:true});
  onChromeScroll();
  document.getElementById("buildDate").textContent=todayStr();
  showPanel((location.hash||"").replace("#","")||"home");
  if(sessionStorage.getItem(SPLASH)==="1") document.getElementById("splash").classList.add("hidden");
}

/* Coming back to the tab picks up anything changed on another device. */
async function refreshFromCloud(){
  if(!cloudOn) return;
  try{
    await cloudPush();
    const changed=await cloudPull();
    if(changed){
      const a=document.activeElement;
      const typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");
      hydrateFromLocal();
      if(!typing) showPanel(currentTab);
    }
    syncBadge("ok","synced");
  }catch(e){ syncBadge("bad","offline"); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshFromCloud(); });

cloudBoot();
