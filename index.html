<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sam's space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Seed content lives in the DATA object in the <script> below.
   Everything on the live site is editable in the browser.
   ============================================================ */
:root{
  --espresso:#171110;
  --espresso-2:#221a18;
  --espresso-3:#2c2220;
  --cream:#f2ebdf;
  --cream-dim:#a89c8e;
  --burgundy:#7d2230;
  --burgundy-lt:#a13341;
  --skyblue:#a9c5de;
  --sage:#8d9d7d;
  --brass:#b08d57;
  --line: rgba(242,235,223,0.13);
  --serif:'Playfair Display', serif;
  --script:'Pinyon Script', cursive;
  --mono:'JetBrains Mono', monospace;
  --sans:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--espresso); color:var(--cream);
  font-family:var(--sans); font-weight:300; min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 800px 500px at 8% -8%, rgba(125,34,48,0.20), transparent 62%),
    radial-gradient(ellipse 700px 420px at 100% 4%, rgba(141,157,125,0.10), transparent 58%);
}
a{color:inherit;}
::selection{ background:var(--burgundy); color:var(--cream); }
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:var(--espresso);}
::-webkit-scrollbar-thumb{background:var(--espresso-3);}

/* ---------- splash ---------- */
#splash{
  position:fixed; inset:0; z-index:10000;
  background:#000 url('assets/splash.jpg') center center / cover no-repeat;
  cursor:pointer; display:flex; align-items:flex-end; justify-content:center;
  transition:opacity 0.7s ease, visibility 0.7s ease;
}
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .tap-hint{
  margin-bottom:7vh; font-family:var(--mono); font-size:10px; letter-spacing:0.3em;
  text-transform:uppercase; color:#f0e2c8; opacity:0.7; animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:0.8;} }

/* ---------- header ---------- */
header{
  position:relative; z-index:2;
  padding:38px 6vw 16px; max-width:1240px; margin:0 auto;
  display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.wordmark{ cursor:pointer; line-height:1; display:flex; align-items:baseline; gap:12px; }
.wordmark .wm-1{ font-family:var(--serif); font-weight:700; font-size:clamp(20px,2.3vw,27px); letter-spacing:0.06em; text-transform:uppercase; }
.wordmark .wm-2{ font-family:var(--script); font-size:clamp(28px,3.2vw,38px); color:var(--brass); }
.est{ font-family:var(--mono); font-size:10px; letter-spacing:0.26em; color:var(--cream-dim); text-transform:uppercase; }

nav.tabs{
  position:relative; z-index:2;
  display:flex; gap:24px; padding:0 6vw 22px; max-width:1240px; margin:0 auto;
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{ display:none; }
.tab{
  background:none; border:none; cursor:pointer; color:var(--cream-dim);
  font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 0 12px; position:relative; white-space:nowrap; flex:0 0 auto; transition:color .2s;
}
.tab::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--brass); transform:scaleX(0); transition:transform .28s ease; }
.tab:hover{ color:var(--cream); }
.tab.active{ color:var(--cream); }
.tab.active::after{ transform:scaleX(1); }
.tab.addtab{ color:var(--sage); }

main{ position:relative; z-index:2; padding:14px 6vw 110px; max-width:1240px; margin:0 auto; }
.panel{ animation:fadein .45s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--brass); margin-bottom:12px; }
h1.page-title{ font-family:var(--serif); font-weight:500; font-size:clamp(34px,5.4vw,58px); margin:0 0 10px; line-height:1.02; }
h1.page-title em{ font-family:var(--script); font-style:normal; font-size:1.25em; color:var(--brass); }
.page-sub{ color:var(--cream-dim); font-size:14px; margin-bottom:40px; max-width:580px; line-height:1.65; }
.rule{ height:1px; background:var(--line); margin:44px 0 32px; }

/* ---------- home ---------- */
.hero{ padding:18px 0 52px; border-bottom:1px solid var(--line); margin-bottom:46px; }
.hero h2{ font-family:var(--serif); font-weight:500; font-size:clamp(38px,7vw,74px); margin:0 0 20px; line-height:1.04; }
.hero h2 em{ font-family:var(--script); font-style:normal; color:var(--brass); font-size:1.15em; }
.hero p{ color:var(--cream-dim); font-size:15px; line-height:1.75; max-width:470px; }
.grid-3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(208px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.doorway{ padding:26px 24px; background:var(--espresso); cursor:pointer; transition:background .22s; }
.doorway:hover{ background:var(--espresso-2); }
.doorway .num{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.2em; }
.doorway h3{ font-family:var(--serif); font-weight:500; font-size:20px; margin:11px 0 8px; }
.doorway p{ font-size:12.5px; color:var(--cream-dim); margin:0; line-height:1.6; }

/* ---------- forms ---------- */
.add-form{ border:1px solid var(--line); padding:24px 26px; margin-bottom:32px; background:rgba(242,235,223,0.015); }
.add-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:16px; margin-bottom:16px;}
label{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:7px; }
input[type=text],input[type=url],textarea,select{
  background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--cream);
  font-family:var(--sans); font-weight:300; font-size:14px; padding:8px 2px; width:100%;
}
select{ background:var(--espresso-2); border:1px solid var(--line); padding:9px; }
input:focus,textarea:focus,select:focus{ outline:none; border-bottom-color:var(--brass); }
textarea{ min-height:62px; resize:vertical; }
input[type=file]{ font-family:var(--mono); font-size:11px; color:var(--cream-dim); width:100%; }
.thumb-preview{ width:64px; height:64px; object-fit:cover; margin-top:9px; border:1px solid var(--line); display:none; }
.btn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase;
  background:none; color:var(--cream); border:1px solid var(--brass); padding:12px 26px; cursor:pointer; transition:.22s;
}
.btn:hover{ background:var(--brass); color:var(--espresso); }
.btn-sm{ padding:8px 16px; font-size:9.5px; }
.btn-quiet{ border-color:var(--line); color:var(--cream-dim); }
.btn-quiet:hover{ background:none; border-color:var(--burgundy-lt); color:var(--burgundy-lt); }

/* ---------- pin boards ---------- */
.subnav{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:28px; }
.chip{
  font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
  border:1px solid var(--line); color:var(--cream-dim); background:none; padding:9px 15px; cursor:pointer; transition:.2s;
}
.chip:hover{ color:var(--cream); border-color:var(--cream-dim); }
.chip.active{ background:var(--burgundy); border-color:var(--burgundy); color:var(--cream); }
.chip.ghost{ border-style:dashed; color:var(--sage); border-color:rgba(141,157,125,0.45); }

.pingrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(218px,1fr)); gap:22px; }
.pin{ border:1px solid var(--line); background:var(--espresso-2); position:relative; transition:border-color .2s, opacity .2s; }
.pin.dragging{ opacity:0.35; }
.pin.dragover{ border-color:var(--brass); }
.pin .pin-img{ width:100%; aspect-ratio:4/5; background:var(--espresso-3); background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.12em; text-transform:uppercase; }
.pin .pin-body{ padding:15px 17px 18px; }
.pin .pin-title{ font-family:var(--serif); font-size:16.5px; font-weight:500; line-height:1.32; }
.pin .pin-meta{ font-family:var(--mono); font-size:10px; color:var(--skyblue); margin-top:7px; letter-spacing:0.05em; }
.pin .pin-desc{ font-size:12.5px; color:var(--cream-dim); margin-top:7px; line-height:1.55; }
.pin a.pin-link{ display:inline-block; margin-top:11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; text-decoration:none; color:var(--brass); border-bottom:1px solid transparent; }
.pin a.pin-link:hover{ border-bottom-color:var(--brass); }
.pin select.pin-move{ margin-top:12px; font-family:var(--mono); font-size:9.5px; padding:6px; }
.pin .pin-remove{ position:absolute; top:9px; right:9px; width:23px; height:23px; border-radius:50%;
  background:rgba(23,17,16,0.8); color:var(--cream); border:1px solid var(--line); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; }
.pin:hover .pin-remove{ opacity:1; }
.pin .pin-grip{ position:absolute; top:9px; left:9px; font-family:var(--mono); font-size:12px; color:var(--cream);
  background:rgba(23,17,16,0.8); border:1px solid var(--line); border-radius:3px; padding:1px 6px; cursor:grab; opacity:0; transition:opacity .2s; }
.pin:hover .pin-grip{ opacity:1; }
.hint{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.08em; margin-bottom:20px; }

/* ---------- doc sections (Charles / About Me) ---------- */
.doc-card{ border:1px solid var(--line); margin-bottom:22px; }
.doc-head{ padding:15px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:rgba(242,235,223,0.02); }
.doc-head input{ font-family:var(--serif); font-size:17px; border-bottom-color:transparent; padding:4px 2px; }
.doc-head input:focus{ border-bottom-color:var(--brass); }
.doc-body{ padding:4px 22px 16px; }
.doc-row{ display:grid; grid-template-columns:210px 1fr 26px; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
.doc-row:last-of-type{ border-bottom:none; }
.doc-row input.dl{ font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cream-dim); border-bottom-color:transparent; }
.doc-row input.dl:focus{ border-bottom-color:var(--brass); color:var(--cream); }
.doc-row input.dv{ font-size:13.5px; border-bottom-color:transparent; }
.doc-row input.dv:focus{ border-bottom-color:var(--brass); }
.doc-row input::placeholder{ color:rgba(168,156,142,0.55); font-style:italic; }
.x-btn{ background:none; border:none; color:rgba(168,156,142,0.5); font-size:15px; cursor:pointer; padding:0; }
.x-btn:hover{ color:var(--burgundy-lt); }
.doc-foot{ padding:14px 22px 18px; display:flex; gap:12px; flex-wrap:wrap; }
.note-line{ padding:0 0 18px; font-family:var(--serif); font-style:italic; font-size:14px; color:var(--cream-dim); border-bottom:1px solid var(--line); margin-bottom:22px; }

/* ---------- health ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:34px; }
.stat-card{ background:var(--espresso); padding:24px 22px; }
.stat-card .stat-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:12px; }
.stat-card input{ font-family:var(--serif); font-size:28px; font-weight:500; border-bottom-color:transparent; }
.stat-card input:focus{ border-bottom-color:var(--brass); }
.stat-card .stat-unit{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); margin-top:5px; letter-spacing:0.1em; }
.goals-box{ border:1px solid var(--line); padding:22px 24px; margin-bottom:36px; }
.goals-box textarea{ border-bottom:none; min-height:100px; font-size:14px; line-height:1.75; }
.list-row{ display:grid; grid-template-columns:1fr 1fr 130px 26px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.list-row .lr-dim{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); }

/* ---------- diary / journal ---------- */
.composer{ border:1px solid var(--line); padding:24px 26px; margin-bottom:34px; }
.composer textarea{ font-size:14px; line-height:1.75; min-height:84px; padding-bottom:14px; margin-bottom:16px; }
.composer .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
.composer-tools{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px;}
.tool-btn,.file-label{ font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--cream-dim); padding:9px 15px; cursor:pointer; }
.tool-btn:hover,.file-label:hover{ border-color:var(--brass); color:var(--cream); }
.tool-btn.recording{ border-color:var(--burgundy-lt); color:var(--burgundy-lt); }
.attach-preview{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.attach-thumb{ position:relative; width:54px; height:54px; }
.attach-thumb img{ width:100%; height:100%; object-fit:cover; border:1px solid var(--line); }
.attach-thumb .rm{ position:absolute; top:-6px; right:-6px; width:16px;height:16px; background:var(--espresso); border:1px solid var(--line); border-radius:50%; font-size:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--cream-dim);}
.storage-note{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); margin-top:14px; line-height:1.7; letter-spacing:0.03em; }
.entry{ border-top:1px solid var(--line); padding:22px 0; }
.entry .entry-date{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; color:var(--cream-dim); text-transform:uppercase; }
.entry .entry-place{ font-family:var(--serif); font-size:20px; margin-top:7px; }
.entry .entry-text{ margin-top:10px; font-size:14.5px; line-height:1.8; white-space:pre-line; }
.entry .entry-images{ display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; }
.entry .entry-images img{ width:88px; height:88px; object-fit:cover; border:1px solid var(--line); cursor:pointer; }
.entry audio{ margin-top:12px; width:100%; max-width:330px; }
.entry .entry-remove{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); cursor:pointer; margin-top:12px; display:inline-block; letter-spacing:0.12em; text-transform:uppercase;}
.entry .entry-remove:hover{ color:var(--burgundy-lt); }
.lock-screen{ border:1px solid var(--line); max-width:390px; margin:56px auto; padding:46px 34px; text-align:center; }
.lock-screen h2{ font-family:var(--serif); font-weight:500; font-size:25px; margin:0 0 10px;}
.lock-screen p{ font-size:12.5px; color:var(--cream-dim); margin-bottom:24px;}
.lock-screen input{ text-align:center; letter-spacing:0.3em; margin-bottom:20px; }
.lock-screen .err{ color:var(--burgundy-lt); font-family:var(--mono); font-size:10px; height:16px; margin-top:10px; }
.lock-btn{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; background:none; border:1px solid var(--line); color:var(--cream-dim); padding:9px 15px; cursor:pointer; float:right; }

.thought{ border-top:1px solid var(--line); padding:22px 0; display:grid; grid-template-columns:46px 1fr; gap:16px; }
.thought .t-num{ font-family:var(--mono); font-size:12px; color:var(--brass); padding-top:6px; }
.thought .t-text{ font-family:var(--serif); font-style:italic; font-size:21px; line-height:1.45; }
.thought .t-date{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); margin-top:9px; letter-spacing:0.14em; text-transform:uppercase;}

.dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:26px; }
.dash-card{ background:var(--espresso); padding:24px 22px; }
.dash-card .dash-num{ font-family:var(--serif); font-size:36px; color:var(--skyblue); }
.dash-card .dash-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--cream-dim); margin-top:7px;}
.country-row{ display:grid; grid-template-columns:1fr 140px 26px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }

/* ---------- vision board ---------- */
.vb-canvas{
  position:relative; width:100%; height:660px; overflow:hidden;
  border:1px solid var(--line); background:
    linear-gradient(rgba(242,235,223,0.02) 1px, transparent 1px) 0 0/100% 28px,
    var(--espresso-2);
  touch-action:none; margin-bottom:16px;
}
.vb-item{ position:absolute; cursor:grab; }
.vb-item img{ width:100%; height:100%; display:block; object-fit:cover; box-shadow:0 10px 30px rgba(0,0,0,0.5); pointer-events:none; }
.vb-item.selected{ outline:1px solid var(--brass); outline-offset:3px; }
.vb-handle{ position:absolute; width:16px; height:16px; background:var(--brass); border:2px solid var(--espresso); border-radius:50%; display:none; }
.vb-item.selected .vb-handle{ display:block; }
.vb-handle.hr{ right:-8px; bottom:-8px; cursor:nwse-resize; }
.vb-handle.hrot{ left:50%; top:-26px; margin-left:-8px; cursor:grab; background:var(--skyblue); }
.vb-handle.hdel{ left:-8px; top:-8px; cursor:pointer; background:var(--burgundy-lt); }
.vb-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream-dim); }

.notes-page textarea{ min-height:420px; border:1px solid var(--line); padding:22px; font-size:14.5px; line-height:1.85; }
.notes-page textarea:focus{ border-color:var(--brass); }
.danger-link{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); cursor:pointer; margin-top:34px; display:inline-block; letter-spacing:0.14em; text-transform:uppercase; }
.danger-link:hover{ color:var(--burgundy-lt); }
.empty-msg{ font-family:var(--mono); font-size:10.5px; color:var(--cream-dim); letter-spacing:0.1em; }

footer{ position:relative; z-index:2; text-align:center; font-family:var(--mono); font-size:9.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream-dim); padding:38px 20px 56px; border-top:1px solid var(--line); }

@media(max-width:680px){
  .doc-row{ grid-template-columns:1fr 26px; }
  .doc-row input.dl{ grid-column:1; }
  .list-row{ grid-template-columns:1fr 1fr; }
  .country-row{ grid-template-columns:1fr 88px 22px; }
  .vb-canvas{ height:480px; }
}
</style>
</head>
<body>

<div id="splash" onclick="hideSplash()"><div class="tap-hint">tap anywhere to enter</div></div>

<header>
  <div class="wordmark" onclick="showSplash()"><span class="wm-1">Sam&rsquo;s</span><span class="wm-2">space</span></div>
  <div class="est">est. 1996</div>
</header>

<nav class="tabs" id="tabNav"></nav>
<main id="mainStage"></main>
<footer>a living record &middot; <span id="buildDate"></span></footer>

<script>
/* ============================================================
   SEED DATA — only used the very first time. After that,
   everything is edited and stored in the browser.
   ============================================================ */
const DATA = {
  journalPassword: "charles2021",

  docs: {
    charles: [
      { id:"cs1", title:"Daily care", fields:[
        { id:"f-nails", label:"Nail trims", value:"Exclusively with Victoria at Barking Babies." },
        { id:"f-teeth", label:"Teeth / incisors", value:"Do not brush the incisors. Ask the vet for the safe method for the rest." },
        { id:"f-feed", label:"Feeding schedule", value:"" },
        { id:"f-walks", label:"Walks", value:"" },
        { id:"f-meds", label:"Medications", value:"" }
      ]},
      { id:"cs2", title:"Vet on file", fields:[
        { id:"f-vc", label:"Clinic", value:"Yaletown Pet Hospital" },
        { id:"f-vp", label:"Phone", value:"(604) 682-7389" },
        { id:"f-ec", label:"Emergency clinic", value:"" },
        { id:"f-ep", label:"Emergency phone", value:"" }
      ]},
      { id:"cs3", title:"Insurance", fields:[
        { id:"f-ip", label:"Provider", value:"Fetch Pet Insurance" },
        { id:"f-ipn", label:"Policy number", value:"DOG0860430-01" },
        { id:"f-iprem", label:"Annual premium", value:"$525.24" },

function load(key, fb){ try{ const r = localStorage.getItem(key); if(r!==null) return JSON.parse(r); }catch(e){} return fb; }
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ alert("Could not save — this browser's storage is full. Removing a few photos will free space, or we can move this to a proper backend."); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function todayStr(){ return new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); }

let dragId=null;
function pinDragStart(e,id){ dragId=id; e.dataTransfer.effectAllowed="move"; const p=e.target.closest(".pin"); if(p)p.classList.add("dragging"); }
function pinDragEnd(e){ const p=e.target.closest(".pin"); if(p)p.classList.remove("dragging"); dragId=null; }
function pinDragOver(e){ e.preventDefault(); const p=e.currentTarget; if(p&&p.dataset.id!==dragId)p.classList.add("dragover"); }
function pinDragLeave(e){ e.currentTarget.classList.remove("dragover"); }
function pinDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove("dragover");
  const targetId=e.currentTarget.dataset.id;
  if(!dragId||dragId===targetId)return;
  const from=wishlist.findIndex(w=>w.id===dragId), to=wishlist.findIndex(w=>w.id===targetId);
  if(from<0||to<0)return;
  const [moved]=wishlist.splice(from,1);
  wishlist.splice(to,0,moved);
  save(K.wishlist,wishlist); showPanel("wishlist");
}

async function vbAddImages(input){
  const b=visionBoards.find(x=>x.id===currentBoardId); if(!b)return;
  for(const f of input.files){
    const src=await fileToDataURL(f);
    const dims=await new Promise(res=>{ const im=new Image(); im.onload=()=>res({w:im.width,h:im.height}); im.onerror=()=>res({w:300,h:300}); im.src=src; });
    const w=300, h=Math.round(300*dims.h/dims.w);
    const maxZ=b.items.length?Math.max.apply(null,b.items.map(i=>i.z||1)):0;
    b.items.push({ id:uid(), src, x:40+Math.round(Math.random()*70), y:40+Math.round(Math.random()*70), w, h, rot:0, z:maxZ+1 });
  }
  input.value=""; save(K.vision,visionBoards); showPanel("vision");
}
function vbDelete(id){
  const b=visionBoards.find(x=>x.id===currentBoardId); if(!b)return;
  b.items=b.items.filter(i=>i.id!==id); save(K.vision,visionBoards); showPanel("vision");
}
function vbDeselect(e){ if(e.target.id==="vb-canvas") document.querySelectorAll(".vb-item").forEach(el=>el.classList.remove("selected")); }

let vb=null;
function vbDown(e,id,mode){
  e.preventDefault(); e.stopPropagation();
  const b=visionBoards.find(x=>x.id===currentBoardId); if(!b)return;
  const it=b.items.find(i=>i.id===id); if(!it)return;
  const el=document.getElementById("vbi-"+id);
  document.querySelectorAll(".vb-item").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  const maxZ=Math.max.apply(null,b.items.map(i=>i.z||1));
  it.z=maxZ+1; el.style.zIndex=it.z;
  const r=el.getBoundingClientRect();
  vb={ id, mode, el, it, sx:e.clientX, sy:e.clientY, ox:it.x, oy:it.y, ow:it.w, oh:it.h, orot:it.rot,
       cx:r.left+r.width/2, cy:r.top+r.height/2 };
  window.addEventListener("pointermove", vbMove);
  window.addEventListener("pointerup", vbUp);
}
function vbMove(e){
  if(!vb)return;
  const dx=e.clientX-vb.sx, dy=e.clientY-vb.sy;
  if(vb.mode==="move"){
    vb.it.x=Math.round(vb.ox+dx); vb.it.y=Math.round(vb.oy+dy);
    vb.el.style.left=vb.it.x+"px"; vb.el.style.top=vb.it.y+"px";
  } else if(vb.mode==="resize"){
    const nw=Math.max(60, Math.round(vb.ow+dx));
    vb.it.w=nw; vb.it.h=Math.round(nw*vb.oh/vb.ow);
    vb.el.style.width=vb.it.w+"px"; vb.el.style.height=vb.it.h+"px";
  } else if(vb.mode==="rotate"){
    const a=Math.atan2(e.clientY-vb.cy, e.clientX-vb.cx)*180/Math.PI;
    vb.it.rot=Math.round(a+90);
    vb.el.style.transform="rotate("+vb.it.rot+"deg)";
  }
}
function vbUp(){
  window.removeEventListener("pointermove", vbMove);
  window.removeEventListener("pointerup", vbUp);
  if(vb){ save(K.vision, visionBoards); vb=null; }
}

async function toggleRec(){
  const btn=document.getElementById("rec-btn");
  if(mediaRecorder&&mediaRecorder.state==="recording"){ mediaRecorder.stop(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Voice notes need microphone access, which is not available here."); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream); chunks=[];
    mediaRecorder.ondataavailable=ev=>chunks.push(ev.data);
    mediaRecorder.onstop=async()=>{
      pendingAudio=await fileToDataURL(new Blob(chunks,{type:"audio/webm"}));
      renderJPrev(); stream.getTracks().forEach(t=>t.stop());
      btn.innerHTML="&#9679; record voice note"; btn.classList.remove("recording");
    };
    mediaRecorder.start(); btn.innerHTML="&#9632; stop recording"; btn.classList.add("recording");
  }catch(err){ alert("Microphone access was blocked. Check this site's permissions in your browser settings."); }
}

  const grid=list.length?'<div class="pingrid">'+list.slice().reverse().map(it=>
    '<div class="pin"><div class="pin-remove" onclick="removeCBoard(\''+ct.id+'\',\''+it.id+'\')">&times;</div>'+
    '<div class="pin-img" style="'+(it.img?"background-image:url('"+it.img+"')":"")+'">'+(it.img?"":"no photo")+'</div>'+
    '<div class="pin-body"><div class="pin-title">'+esc(it.title)+'</div>'+(it.date?'<div class="pin-meta">'+esc(it.date)+'</div>':"")+
    (it.note?'<div class="pin-desc">'+esc(it.note)+'</div>':"")+
    (it.link?'<a class="pin-link" href="'+esc(it.link)+'" target="_blank" rel="noopener">view &rarr;</a>':"")+'</div></div>').join("")+'</div>':'<p class="empty-msg">Nothing pinned yet.</p>';
  return head+'<div class="add-form"><div class="eyebrow">pin something new</div>'+
    '<div class="row"><div><label>Title</label><input type="text" id="cb-title"></div>'+
    '<div><label>Photo</label><input type="file" accept="image/*" id="cb-file" onchange="previewPin(\'cb\')"><img class="thumb-preview" id="cb-thumb"></div></div>'+
    '<div class="row"><div><label>Date</label><input type="text" id="cb-date"></div><div><label>Note</label><textarea id="cb-note"></textarea></div>'+
    '<div><label>Link</label><input type="url" id="cb-link"></div></div>'+
    '<button class="btn" onclick="addCBoard(\''+ct.id+'\')">Pin it</button></div>'+grid;
}
function saveNotes(id){ localStorage.setItem("sam_cnotes_"+id, document.getElementById("cn-"+id).value); }
function addCBoard(cid){
  const t=document.getElementById("cb-title").value.trim(); if(!t)return;
  const sk="sam_cboard_"+cid; const list=load(sk,[]);
  list.push({id:uid(),title:t,date:document.getElementById("cb-date").value.trim(),
    note:document.getElementById("cb-note").value.trim(),link:document.getElementById("cb-link").value.trim(),
    img:pendingPinImg["cb"]||""});
  save(sk,list); pendingPinImg["cb"]=null; showPanel("c-"+cid);
}
function removeCBoard(cid,id){ const sk="sam_cboard_"+cid; save(sk, load(sk,[]).filter(x=>x.id!==id)); showPanel("c-"+cid); }

   HOME + ROUTER
   ============================================================ */
function panelHome(){
  const doors=[
    ["charles","Charles","Care notes, vet and insurance."],
    ["me","About Me","Sizes, staples, the handoff doc."],
    ["health","Health","Goals, numbers, records."],
    ["wishlist","Wishlist","Everything I have my eye on."],
    ["vision","Vision Boards","The life, arranged visually."],
    ["photos","Photo Wall","Moments worth keeping."],
    ["concerts","Concerts","Every show."],
    ["travel","Travel","Where I have been."],
    ["recipes","Recipes","Worth cooking again."],
    ["journal","Journal","Private. Locked."],
    ["thoughts","Thoughts","A running collection."]
  ];
  return '<div class="hero"><div class="eyebrow">a living record</div>'+
    '<h2>welcome <em>in</em>.</h2>'+
    '<p>Care notes, the essentials, what I want, what I am working toward, and the moments worth keeping — all somewhere quieter than a phone full of screenshots.</p></div>'+
    '<div class="grid-3">'+doors.map((d,i)=>
      '<div class="doorway" onclick="showPanel(\''+d[0]+'\')"><div class="num">'+String(i+1).padStart(2,"0")+'</div><h3>'+d[1]+'</h3><p>'+d[2]+'</p></div>').join("")+'</div>';
}

const ROUTES={
  home:panelHome, charles:panelCharles, me:panelMe, health:panelHealth,
  wishlist:panelWishlist, vision:panelVision,
  photos:()=>panelSimple("photos"), concerts:()=>panelSimple("concerts"),
  travel:panelTravel, recipes:panelRecipes, journal:panelJournal, thoughts:panelThoughts, newtab:panelNewTab
};
function showPanel(id){
  let html;
  if(id.indexOf("c-")===0){
    const ct=customTabs.find(c=>c.id===id.slice(2));
    if(ct){ html=panelCustom(ct); } else { id="home"; html=panelHome(); }
  } else if(ROUTES[id]){ html=ROUTES[id](); }
  else { id="home"; html=panelHome(); }
  currentTab=id;
  renderNav(id);
  document.getElementById("mainStage").innerHTML='<div class="panel">'+html+'</div>';
  window.scrollTo({top:0,behavior:"smooth"});
  history.replaceState(null,"","#"+id);
}

document.getElementById("buildDate").textContent=todayStr();
showPanel((location.hash||"").replace("#","")||"home");

const SPLASH="sam_entered";
function hideSplash(){ sessionStorage.setItem(SPLASH,"1"); document.getElementById("splash").classList.add("hidden"); }
function showSplash(){ document.getElementById("splash").classList.remove("hidden"); }
if(sessionStorage.getItem(SPLASH)==="1") document.getElementById("splash").classList.add("hidden");
</script>
