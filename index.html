<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sam's space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Pinyon+Script&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#171110; --espresso-2:#221a18; --espresso-3:#2c2220;
  --cream:#f2ebdf; --cream-dim:#a89c8e;
  --burgundy:#7d2230; --burgundy-lt:#a13341;
  --skyblue:#a9c5de; --sage:#8d9d7d; --brass:#b08d57;
  --line: rgba(242,235,223,0.13);
  --serif:'Playfair Display', serif; --script:'Pinyon Script', cursive;
  --mono:'JetBrains Mono', monospace; --typewriter:'Courier Prime', 'Courier New', monospace; --sans:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--espresso); color:var(--cream); font-family:var(--sans); font-weight:300; min-height:100vh; }
body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 800px 500px at 8% -8%, rgba(125,34,48,0.20), transparent 62%),
              radial-gradient(ellipse 700px 420px at 100% 4%, rgba(141,157,125,0.10), transparent 58%); }
a{color:inherit;}
::selection{ background:var(--burgundy); color:var(--cream); }
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:var(--espresso);}
::-webkit-scrollbar-thumb{background:var(--espresso-3);}

#splash{ position:fixed; inset:0; z-index:10000; background:#000 url('assets/splash.jpg') center center / cover no-repeat;
  cursor:pointer; display:flex; align-items:flex-end; justify-content:center; transition:opacity .7s ease, visibility .7s ease; }
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .tap-hint{ margin-bottom:7vh; font-family:var(--mono); font-size:10px; letter-spacing:0.3em;
  text-transform:uppercase; color:#f0e2c8; opacity:0.7; animation:pulse 2.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:0.8;} }

header{ position:relative; z-index:2; padding:34px 6vw 14px; max-width:1240px; margin:0 auto;
  display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; }
.wordmark{ cursor:pointer; line-height:1; display:flex; align-items:baseline; gap:12px; }
.wordmark .wm-1{ font-family:var(--serif); font-weight:700; font-size:clamp(20px,2.3vw,27px); letter-spacing:0.06em; text-transform:uppercase; }
.wordmark .wm-2{ font-family:var(--script); font-size:clamp(28px,3.2vw,38px); color:var(--brass); }
.head-right{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.search-wrap{ position:relative; }
.search-wrap input{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; width:210px;
  background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--cream); padding:8px 2px 8px 20px; }
.search-wrap input:focus{ outline:none; border-bottom-color:var(--brass); }
.search-wrap input::placeholder{ color:var(--cream-dim); text-transform:uppercase; }
.search-wrap .mag{ position:absolute; left:0; top:7px; font-size:11px; color:var(--cream-dim); pointer-events:none; }
.est{ font-family:var(--mono); font-size:10px; letter-spacing:0.26em; color:var(--cream-dim); text-transform:uppercase; }

nav.tabs{ position:relative; z-index:2; display:flex; gap:22px; padding:0 6vw 20px; max-width:1240px; margin:0 auto;
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar{ display:none; }
.tab{ background:none; border:none; cursor:pointer; color:var(--cream-dim); font-family:var(--typewriter); font-size:12.5px;
  font-weight:700; letter-spacing:0.09em; text-transform:uppercase; padding:0 0 12px; position:relative; white-space:nowrap; flex:0 0 auto; transition:color .2s; }
.tab::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--brass); transform:scaleX(0); transition:transform .28s ease; }
.tab:hover{ color:var(--cream); }
.tab.active{ color:var(--cream); }
.tab.active::after{ transform:scaleX(1); }
.tab.addtab{ color:var(--sage); }
.tab .badge{ display:inline-block; margin-left:6px; font-size:9px; color:var(--burgundy-lt); }

main{ position:relative; z-index:2; padding:14px 6vw 110px; max-width:1240px; margin:0 auto; }
.panel{ animation:fadein .45s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--brass); margin-bottom:12px; }
h1.page-title{ font-family:var(--serif); font-weight:500; font-size:clamp(34px,5.4vw,58px); margin:0 0 10px; line-height:1.02; }
.page-sub{ color:var(--cream-dim); font-size:14px; margin-bottom:38px; max-width:580px; line-height:1.65; }
.rule{ height:1px; background:var(--line); margin:44px 0 32px; }
.empty-msg{ font-family:var(--mono); font-size:10.5px; color:var(--cream-dim); letter-spacing:0.1em; }

.hero{ padding:18px 0 48px; border-bottom:1px solid var(--line); margin-bottom:42px; }
.hero h2{ font-family:var(--serif); font-weight:500; font-size:clamp(38px,7vw,74px); margin:0 0 20px; line-height:1.04; }
.hero h2 em{ font-family:var(--script); font-style:normal; color:var(--brass); font-size:1.15em; }
.hero p{ color:var(--cream-dim); font-size:15px; line-height:1.75; max-width:470px; }
.grid-3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(208px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.doorway{ padding:26px 24px; background:var(--espresso); cursor:pointer; transition:background .22s; }
.doorway:hover{ background:var(--espresso-2); }
.doorway .num{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.2em; }
.doorway h3{ font-family:var(--serif); font-weight:500; font-size:20px; margin:11px 0 8px; }
.doorway p{ font-size:12.5px; color:var(--cream-dim); margin:0; line-height:1.6; }

.focus-strip{ border:1px solid var(--line); padding:22px 24px; margin-bottom:42px; background:rgba(176,141,87,0.05); }
.focus-strip .fs-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
.focus-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.focus-item{ border-left:2px solid var(--brass); padding:8px 0 8px 14px; cursor:pointer; }
.focus-item:hover .fi-title{ color:var(--brass); }
.focus-item .fi-src{ font-family:var(--mono); font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-dim); }
.focus-item .fi-title{ font-size:13.5px; margin-top:5px; line-height:1.45; transition:color .2s; }

.add-form{ border:1px solid var(--line); padding:24px 26px; margin-bottom:32px; background:rgba(242,235,223,0.015); }
.add-toggle{ font-family:var(--typewriter); font-weight:700; font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--sage); background:none; border:1px dashed rgba(141,157,125,0.4); padding:12px 22px; cursor:pointer;
  margin-bottom:26px; transition:.2s; }
.add-toggle:hover{ border-color:var(--sage); color:var(--cream); }
.add-toggle.open{ color:var(--cream-dim); border-color:var(--line); border-style:solid; }
.edit-form{ border:1px solid var(--brass); padding:20px 22px; background:rgba(176,141,87,0.05); }
.edit-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:14px; }
.edit-actions{ display:flex; gap:10px; margin-top:6px; }
.pin .pin-tools .ed{ font-size:11px; }
.entry-acts{ display:flex; gap:14px; align-items:center; margin-top:12px; }
.entry-acts span{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); cursor:pointer; letter-spacing:0.12em; text-transform:uppercase; }
.entry-acts span:hover{ color:var(--brass); }
.entry-acts span.danger:hover{ color:var(--burgundy-lt); }
.more-wrap{ position:relative; flex:0 0 auto; }
.more-panel{ position:absolute; top:100%; right:0; background:var(--espresso-2); border:1px solid var(--line);
  padding:10px 0; min-width:210px; z-index:500; display:none; box-shadow:0 14px 40px rgba(0,0,0,0.6); }
.more-panel.open{ display:block; }
.more-panel button{ display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  font-family:var(--typewriter); font-weight:700; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--cream-dim); padding:10px 20px; }
.more-panel button:hover{ background:var(--espresso-3); color:var(--cream); }
.more-panel button.active{ color:var(--brass); }
.more-panel .sep{ height:1px; background:var(--line); margin:8px 0; }
.ing-reset{ font-family:var(--mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cream-dim);
  background:none; border:none; cursor:pointer; padding:0; margin-top:12px; }
.ing-reset:hover{ color:var(--brass); }
.mood-grid{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px; }
.mood-chip{ font-family:var(--mono); font-size:10px; letter-spacing:0.04em; border:1px solid var(--line);
  background:none; color:var(--cream-dim); padding:7px 11px; cursor:pointer; transition:.16s; }
.mood-chip:hover{ color:var(--cream); border-color:var(--cream-dim); }
.mood-chip.on{ background:var(--skyblue); border-color:var(--skyblue); color:var(--espresso); }
.mood-group-label{ font-family:var(--mono); font-size:9px; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--brass); margin:14px 0 8px; }
.prompt-block{ border-left:2px solid var(--line); padding-left:16px; margin-bottom:18px; }
.prompt-block .pb-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:4px; }
.prompt-block .pb-hint{ font-size:11.5px; color:var(--cream-dim); font-style:italic; margin-bottom:10px; }
.entry-meta-row{ display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; }
.entry-mood{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--skyblue); }
.mini-list{ margin-top:12px; }
.mini-list .ml-label{ font-family:var(--mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--brass); margin-bottom:5px; }
.mini-list ul{ margin:0; padding-left:18px; }
.mini-list li{ font-size:13.5px; line-height:1.65; color:var(--cream); }
.wearable-row{ display:grid; grid-template-columns:110px repeat(5,1fr) 26px; gap:10px; align-items:center;
  padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; }
.wearable-row.head{ font-family:var(--mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-dim); border-bottom-color:var(--cream-dim); }
.wearable-row .wv{ font-family:var(--serif); font-size:16px; }
.place-row{ border-bottom:1px solid var(--line); padding:15px 0; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; }
.place-row .pl-name{ font-family:var(--serif); font-size:17px; }
.place-row .pl-cat{ font-family:var(--mono); font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--sage); margin-top:4px; }
.place-row .pl-note{ font-size:13px; color:var(--cream-dim); margin-top:7px; line-height:1.6; }
.place-row .pl-acts{ display:flex; gap:12px; align-items:center; }
.import-note{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); line-height:1.8; letter-spacing:0.02em; margin-top:12px; }
.info-card{ border:1px solid var(--line); border-left:2px solid var(--brass); padding:20px 24px; margin-bottom:26px; }
.info-card h4{ font-family:var(--serif); font-size:16px; font-weight:500; margin:0 0 10px; }
.info-card p{ font-size:13px; color:var(--cream-dim); line-height:1.75; margin:0 0 10px; }
.info-card p:last-child{ margin-bottom:0; }
.info-card ol{ font-size:13px; color:var(--cream-dim); line-height:1.85; margin:0; padding-left:20px; }
@media(max-width:760px){
  .wearable-row{ grid-template-columns:1fr 1fr 1fr; }
  .wearable-row.head{ display:none; }
}
.add-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:16px; margin-bottom:16px;}
label{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:7px; }
input,textarea,select{
  background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--cream);
  font-family:var(--sans); font-weight:300; font-size:14px; padding:8px 2px; width:100%; }
select{ background:var(--espresso-2); border:1px solid var(--line); padding:9px; }
input:focus,textarea:focus,select:focus{ outline:none; border-bottom-color:var(--brass); }
textarea{ min-height:62px; resize:vertical; }
input[type=file]{ font-family:var(--mono); font-size:11px; color:var(--cream-dim); width:100%; }
.thumb-preview{ width:64px; height:64px; object-fit:cover; margin-top:9px; border:1px solid var(--line); display:none; }
.btn{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; background:none;
  color:var(--cream); border:1px solid var(--brass); padding:12px 26px; cursor:pointer; transition:.22s; }
.btn:hover{ background:var(--brass); color:var(--espresso); }
.btn-sm{ padding:8px 16px; font-size:9.5px; }
.btn-quiet{ border-color:var(--line); color:var(--cream-dim); }
.btn-quiet:hover{ background:none; border-color:var(--burgundy-lt); color:var(--burgundy-lt); }

.subnav{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:26px; }
.chip{ font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; border:1px solid var(--line);
  color:var(--cream-dim); background:none; padding:9px 15px; cursor:pointer; transition:.2s; }
.chip:hover{ color:var(--cream); border-color:var(--cream-dim); }
.chip.active{ background:var(--burgundy); border-color:var(--burgundy); color:var(--cream); }
.chip.ghost{ border-style:dashed; color:var(--sage); border-color:rgba(141,157,125,0.45); }

.tag{ display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--sage);
  border:1px solid rgba(141,157,125,0.35); padding:3px 7px; margin:5px 5px 0 0; cursor:pointer; transition:.18s; }
.tag:hover{ background:var(--sage); color:var(--espresso); border-color:var(--sage); }
.tags-row{ margin-top:9px; }
.star{ background:none; border:none; cursor:pointer; font-size:14px; color:rgba(168,156,142,0.4); padding:0; transition:color .2s; }
.star:hover{ color:var(--brass); }
.star.on{ color:var(--brass); }

.pingrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(218px,1fr)); gap:22px; }
.pin{ border:1px solid var(--line); background:var(--espresso-2); position:relative; transition:border-color .2s, opacity .2s; }
.pin.dragging{ opacity:0.35; }
.pin.dragover{ border-color:var(--brass); }
.pin .pin-img{ width:100%; aspect-ratio:4/5; background:var(--espresso-3); background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.12em; text-transform:uppercase; }
.pin .pin-body{ padding:15px 17px 18px; }
.pin .pin-title{ font-family:var(--serif); font-size:16.5px; font-weight:500; line-height:1.32; }
.pin .pin-meta{ font-family:var(--mono); font-size:10px; color:var(--skyblue); margin-top:7px; letter-spacing:0.05em; }
.pin .pin-desc{ font-size:12.5px; color:var(--cream-dim); margin-top:7px; line-height:1.55; }
.pin a.pin-link{ display:inline-block; margin-top:11px; font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em;
  text-transform:uppercase; text-decoration:none; color:var(--brass); border-bottom:1px solid transparent; }
.pin a.pin-link:hover{ border-bottom-color:var(--brass); }
.pin select.pin-move{ margin-top:12px; font-family:var(--mono); font-size:9.5px; padding:6px; }
.pin .pin-tools{ position:absolute; top:9px; right:9px; display:flex; gap:6px; opacity:0; transition:opacity .2s; }
.pin:hover .pin-tools{ opacity:1; }
.pin .pin-tools > *{ width:23px; height:23px; border-radius:50%; background:rgba(23,17,16,0.85); color:var(--cream);
  border:1px solid var(--line); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pin .pin-tools .star.on{ color:var(--brass); }
.pin .pin-grip{ position:absolute; top:9px; left:9px; font-family:var(--mono); font-size:12px; color:var(--cream);
  background:rgba(23,17,16,0.8); border:1px solid var(--line); border-radius:3px; padding:1px 6px; cursor:grab; opacity:0; transition:opacity .2s; }
.pin:hover .pin-grip{ opacity:1; }
.hint{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); letter-spacing:0.08em; margin-bottom:20px; line-height:1.7; }

.doc-card{ border:1px solid var(--line); margin-bottom:22px; }
.doc-head{ padding:16px 24px; border-bottom:1px solid var(--line); }
.doc-head input{ font-family:var(--serif); font-size:17px; background:transparent; border:none;
  border-bottom:1px solid transparent; padding:3px 0; color:var(--cream); width:100%; }
.doc-head input:hover{ border-bottom-color:var(--line); }
.doc-head input:focus{ border-bottom-color:var(--brass); }
.doc-body{ padding:4px 24px 8px; }
.doc-row{ display:grid; grid-template-columns:210px 1fr 22px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
.doc-row:last-of-type{ border-bottom:none; }
.doc-row input{ border:none; border-bottom:1px solid transparent; background:transparent; }
.doc-row input.dl{ font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-dim); }
.doc-row input.dl:hover{ border-bottom-color:var(--line); }
.doc-row input.dl:focus{ border-bottom-color:var(--brass); color:var(--cream); }
.doc-row input.dv{ font-size:13.5px; color:var(--cream); }
.doc-row input.dv:hover{ border-bottom-color:var(--line); }
.doc-row input.dv:focus{ border-bottom-color:var(--brass); }
.doc-row input.dv::placeholder{ color:rgba(168,156,142,0.4); font-style:italic; }
.doc-row input.dl::placeholder{ color:rgba(168,156,142,0.4); }
.x-btn{ background:none; border:none; color:transparent; font-size:14px; cursor:pointer; padding:0; transition:color .18s; }
.doc-row:hover .x-btn{ color:rgba(168,156,142,0.45); }
.x-btn:hover{ color:var(--burgundy-lt) !important; }
.doc-foot{ padding:0 24px 16px; display:flex; gap:16px; flex-wrap:wrap; opacity:0; transition:opacity .22s; }
.doc-card:hover .doc-foot{ opacity:1; }
.txt-act{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-dim);
  background:none; border:none; cursor:pointer; padding:0; }
.txt-act:hover{ color:var(--brass); }
.txt-act.danger:hover{ color:var(--burgundy-lt); }
.doc-add{ font-family:var(--mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--sage);
  background:none; border:1px dashed rgba(141,157,125,0.4); padding:13px 24px; cursor:pointer; width:100%; transition:.2s; }
.doc-add:hover{ border-color:var(--sage); color:var(--cream); }
.note-line{ padding:0 0 18px; font-family:var(--serif); font-style:italic; font-size:14px; color:var(--cream-dim); border-bottom:1px solid var(--line); margin-bottom:22px; }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:34px; }
.stat-card{ background:var(--espresso); padding:24px 22px; }
.stat-card .stat-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--cream-dim); margin-bottom:12px; }
.stat-card input{ font-family:var(--serif); font-size:28px; font-weight:500; border-bottom-color:transparent; }
.stat-card input:focus{ border-bottom-color:var(--brass); }
.stat-card .stat-unit{ font-family:var(--mono); font-size:9.5px; color:var(--cream-dim); margin-top:5px; letter-spacing:0.1em; }
.goals-box{ border:1px solid var(--line); padding:22px 24px; margin-bottom:36px; }
.goals-box textarea{ border-bottom:none; min-height:100px; font-size:14px; line-height:1.75; }
.list-row{ display:grid; grid-template-columns:1fr 1fr 130px 26px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }

/* Minimal CSV parser — handles quoted fields, embedded commas and newlines. */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); cell=""; if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
      else cell+=ch;
    }
  }
  row.push(cell);
  if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}
function findCol(headers,names){
  const h=headers.map(x=>(x||"").toLowerCase().trim());
  for(const n of names){
    const i=h.findIndex(x=>x===n);
    if(i>=0) return i;
  }
  for(const n of names){
    const i=h.findIndex(x=>x.indexOf(n)>=0);
    if(i>=0) return i;
  }
  return -1;
}

  if(kind.indexOf("place:")===0) return [["name","Place","text"],["category","Category","placecat"],["note","Note","textarea"],["link","Link","text"]];
  return EDIT_FIELDS[kind]||[];

function saveEdit(){
  if(!editing)return;

  const it=st.list.find(x=>x.id===editing.id); if(!it){ editing=null; return; }
  fieldsFor(editing.kind).forEach(f=>{
    const el=document.getElementById("ed-"+f[0]); if(!el)return;
    if(f[2]==="tags") it[f[0]]=parseTags(el.value);
    else if(f[2]==="lines") it[f[0]]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);
    else if(f[2]==="number") it[f[0]]=parseInt(el.value)||1;
    else it[f[0]]=el.value.trim();
  });
  if(hasPhoto(editing.kind) && pendingPinImg["ed"]) it.img=pendingPinImg["ed"];
  pendingPinImg["ed"]=null;
  if(st.whole){ save(st.key,st.whole); }
  else { st.set(st.list); save(st.key,st.list); }

/* ============================================================
   Unified index — powers search and the tag cloud
   ============================================================ */
function buildIndex(){
  const idx=[];
  const push=(o)=>idx.push(o);
  Object.keys(docs).forEach(dk=>{
    const tabId = dk==="charles"?"charles" : dk==="me"?"me" : dk;
    const tabLabel = dk==="charles"?"Charles" : dk==="me"?"About Me" : (customTabs.find(c=>"c-"+c.id===dk)||{}).name||"Records";
    (docs[dk]||[]).forEach(sec=>sec.fields.forEach(f=>{
      if(f.label||f.value) push({group:tabLabel,tab:tabId,title:f.label,text:f.value,tags:[]});
    }));
  });
  wishlist.forEach(w=>push({group:"Wishlist",tab:"wishlist",title:w.title,text:w.description,tags:w.tags||[]}));
  visionBoards.forEach(b=>push({group:"Vision Boards",tab:"vision",title:b.name,text:b.items.length+" image(s)",tags:[]}));
  photos.forEach(p=>push({group:"Photo Wall",tab:"photos",title:p.title,text:[p.date,p.note].filter(Boolean).join(" · "),tags:p.tags||[]}));
  concerts.forEach(c=>push({group:"Concerts",tab:"concerts",title:c.title,text:[c.venue,c.date,c.note].filter(Boolean).join(" · "),tags:c.tags||[]}));
  recipes.forEach(r=>push({group:"Recipes",tab:"recipes",title:r.title,text:[(r.ingredients||[]).join(", "),r.body].filter(Boolean).join(" — "),tags:r.tags||[]}));
  thoughts.forEach(t=>push({group:"Thoughts",tab:"thoughts",title:t.text,text:t.date,tags:t.tags||[]}));
  journalEntries.forEach(e=>push({group:"Journal",tab:"journal",title:e.date+(e.mood?" · "+e.mood:""),
    text:[e.text,(e.glimmers||[]).join("; "),(e.gratitudes||[]).join("; ")].filter(Boolean).join(" — "),tags:e.tags||[],locked:true}));
  countries.forEach(c=>push({group:"Travel",tab:"travel",title:c.country,text:c.date,tags:[]}));
  travelEntries.forEach(e=>push({group:"Travel",tab:"travel",title:e.place||e.date,text:e.text,tags:e.tags||[]}));
  guides.forEach(g=>g.places.forEach(p=>push({group:"City guide: "+g.city,tab:"travel",title:p.name,text:[p.category,p.note].filter(Boolean).join(" · "),tags:[]})));
  prs.forEach(p=>push({group:"Health",tab:"health",title:p.exercise,text:p.result+" · "+p.date,tags:[]}));
  if(health.goalsNote) push({group:"Health",tab:"health",title:"General goals",text:health.goalsNote,tags:[]});
  wearable.forEach(w=>push({group:"Health",tab:"health",title:"Metrics "+w.date,
    text:W_COLS.map(cc=>w[cc[0]]?cc[1]+" "+w[cc[0]]:"").filter(Boolean).join(" · "),tags:[]}));
  inbox.forEach(i=>push({group:"Inbox",tab:"inbox",title:i.text,text:i.date,tags:i.tags||[]}));
  customTabs.forEach(ct=>{
    if(ct.type==="notes"){
      const v=localStorage.getItem("sam_cnotes_"+ct.id)||"";
      if(v) push({group:ct.name,tab:"c-"+ct.id,title:ct.name,text:v,tags:[]});
    }
    if(ct.type==="board"){
      load("sam_cboard_"+ct.id,[]).forEach(it=>push({group:ct.name,tab:"c-"+ct.id,title:it.title,text:[it.date,it.note].filter(Boolean).join(" · "),tags:it.tags||[]}));
    }
    if(ct.type==="diary"){
      load("sam_cdiary_"+ct.id,[]).forEach(it=>push({group:ct.name,tab:"c-"+ct.id,title:it.place||it.date,text:it.text,tags:it.tags||[]}));
    }
  });
  return idx;
}
function allTags(){
  const counts={};
  buildIndex().forEach(i=>(i.tags||[]).forEach(t=>{ counts[t]=(counts[t]||0)+1; }));
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b)).map(t=>({tag:t,count:counts[t]}));
}

function hi(text,q){
  if(!text)return "";
  const safe=esc(text);
  if(!q)return safe;
  try{
    const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    return safe.replace(re,'<span class="sr-hit">$1</span>');
  }catch(e){ return safe; }
}
function panelSearch(){
  const q=searchQuery.toLowerCase();
  const unlocked=sessionStorage.getItem(K.unlocked)==="1";
  const hits=buildIndex().filter(i=>{
    if(i.locked && !unlocked) return false;
    return ((i.title||"")+" "+(i.text||"")+" "+(i.tags||[]).join(" ")).toLowerCase().includes(q);
  });
  const groups={};
  hits.forEach(h=>{ (groups[h.group]=groups[h.group]||[]).push(h); });
  const body=Object.keys(groups).length ? Object.keys(groups).map(g=>
    '<div class="sr-group"><h3>'+esc(g)+' &middot; '+groups[g].length+'</h3>'+
    groups[g].map(h=>'<div class="sr-item" onclick="showPanel(\''+h.tab+'\')"><div class="sr-title">'+hi(h.title,searchQuery)+'</div>'+
      (h.text?'<div class="sr-snip">'+hi((h.text||"").slice(0,220),searchQuery)+'</div>':"")+
      tagsHTML(h.tags)+'</div>').join("")+'</div>').join("")
    : '<p class="empty-msg">Nothing found for &ldquo;'+esc(searchQuery)+'&rdquo;.</p>';
  const lockNote = unlocked ? "" : '<div class="hint">Journal entries are excluded while the journal is locked. Unlock it to include them.</div>';
  return '<div class="eyebrow">search</div><h1 class="page-title">results</h1>'+
    '<p class="page-sub">'+hits.length+' match'+(hits.length===1?"":"es")+' for &ldquo;'+esc(searchQuery)+'&rdquo; across the whole site.</p>'+lockNote+body;
}

async function vbAddImages(input){
  const b=visionBoards.find(x=>x.id===currentBoardId); if(!b)return;
  for(const f of input.files){
    const src=await fileToDataURL(f);
    const dims=await new Promise(res=>{ const im=new Image(); im.onload=()=>res({w:im.width,h:im.height}); im.onerror=()=>res({w:300,h:300}); im.src=src; });
    const maxZ=b.items.length?Math.max.apply(null,b.items.map(i=>i.z||1)):0;
    b.items.push({ id:uid(), src, xp:0.05+Math.random()*0.12, yp:0.05+Math.random()*0.12,
      wp:0.28, ar:(dims.w/dims.h)||1.5, rot:0, z:maxZ+1 });
  }
  input.value=""; save(K.vision,visionBoards); showPanel("vision");
}

function vbDeselect(e){ if(e.target.id==="vb-canvas") document.querySelectorAll(".vb-item").forEach(el=>el.classList.remove("selected")); }
function migrateVbItem(it){
  if(it.xp!==undefined) return;
  const RW=1100, RH=687;
  it.ar = (it.w&&it.h) ? (it.w/it.h) : 1.5;
  it.xp = Math.max(0,Math.min(0.95,(it.x||0)/RW));
  it.yp = Math.max(0,Math.min(0.95,(it.y||0)/RH));
  it.wp = Math.max(0.05,Math.min(1,(it.w||300)/RW));
}
let vb=null;
function vbDown(e,id,mode){
  e.preventDefault(); e.stopPropagation();
  const b=visionBoards.find(x=>x.id===currentBoardId); if(!b)return;
  const it=b.items.find(i=>i.id===id); if(!it)return;
  const el=document.getElementById("vbi-"+id);
  document.querySelectorAll(".vb-item").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  const maxZ=Math.max.apply(null,b.items.map(i=>i.z||1)); it.z=maxZ+1; el.style.zIndex=it.z;
  const r=el.getBoundingClientRect();
  const cv=document.getElementById("vb-canvas").getBoundingClientRect();
  vb={ id,mode,el,it,sx:e.clientX,sy:e.clientY,oxp:it.xp,oyp:it.yp,owp:it.wp,orot:it.rot,
       cw:cv.width,ch:cv.height,cx:r.left+r.width/2,cy:r.top+r.height/2 };
  window.addEventListener("pointermove",vbMove); window.addEventListener("pointerup",vbUp);
}
function vbMove(e){
  if(!vb)return;
  const dx=e.clientX-vb.sx, dy=e.clientY-vb.sy;
  if(vb.mode==="move"){
    vb.it.xp=Math.max(-0.05,Math.min(0.98,vb.oxp+dx/vb.cw));
    vb.it.yp=Math.max(-0.05,Math.min(0.98,vb.oyp+dy/vb.ch));
    vb.el.style.left=(vb.it.xp*100)+"%"; vb.el.style.top=(vb.it.yp*100)+"%";
  } else if(vb.mode==="resize"){
    vb.it.wp=Math.max(0.05,Math.min(1.6,vb.owp+dx/vb.cw));
    vb.el.style.width=(vb.it.wp*100)+"%";
  } else if(vb.mode==="rotate"){
    const a=Math.atan2(e.clientY-vb.cy,e.clientX-vb.cx)*180/Math.PI;
    vb.it.rot=Math.round(a+90); vb.el.style.transform="rotate("+vb.it.rot+"deg)";
  }
}
function vbUp(){ window.removeEventListener("pointermove",vbMove); window.removeEventListener("pointerup",vbUp); if(vb){ save(K.vision,visionBoards); vb=null; } }

/* ---------- Oura / wearable log ---------- */
const W_COLS=[["sleep","Sleep"],["readiness","Readiness"],["activity","Activity"],["steps","Steps"],["rhr","Rest HR"]];
function addWearable(){
  const d=document.getElementById("wd-date").value.trim()||todayStr();
  const row={id:uid(),date:d};
  let any=false;
  W_COLS.forEach(cc=>{ const el=document.getElementById("wd-"+cc[0]); const v=el?el.value.trim():""; row[cc[0]]=v; if(v)any=true; });
  if(!any)return;
  wearable.push(row); save(K.wearable,wearable); showPanel("health");
}
function removeWearable(id){ wearable=wearable.filter(w=>w.id!==id); save(K.wearable,wearable); showPanel("health"); }
function importOura(){
  const inp=document.getElementById("imp-oura");
  if(!inp.files||!inp.files[0]){ alert("Choose your Oura CSV first."); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(r.result);
      if(rows.length<2){ alert("That file looks empty."); return; }
      const head=rows[0];
      const iDate=findCol(head,["date","day","summary_date"]);
      const map={
        sleep:findCol(head,["sleep score","sleep_score","score_sleep","sleep"]),
        readiness:findCol(head,["readiness score","readiness_score","readiness"]),
        activity:findCol(head,["activity score","activity_score","activity"]),
        steps:findCol(head,["steps","step count"]),
        rhr:findCol(head,["lowest resting heart rate","resting heart rate","average resting heart rate","resting_heart_rate"])
      };
      if(iDate<0){ alert('Could not find a date column in that file.'); return; }
      const existing={}; wearable.forEach(w=>existing[w.date]=w);
      let added=0, updated=0;
      for(let i=1;i<rows.length;i++){
        const dv=(rows[i][iDate]||"").trim(); if(!dv) continue;
        const row=existing[dv]||{id:uid(),date:dv};
        Object.keys(map).forEach(k=>{ if(map[k]>=0){ const v=(rows[i][map[k]]||"").trim(); if(v) row[k]=v; } });
        if(existing[dv]){ updated++; } else { wearable.push(row); existing[dv]=row; added++; }
      }
      save(K.wearable,wearable);
      alert("Imported "+added+" new day"+(added===1?"":"s")+(updated?" and updated "+updated:"")+".");
      inp.value=""; showPanel("health");
    }catch(err){ alert("Could not read that file as a CSV."); }
  };
  r.readAsText(inp.files[0]);
}

  const recent=wearable.slice().sort((a,b)=>(b.date>a.date?1:-1)).slice(0,30);
  const avg=(k)=>{
    const vals=recent.map(r=>parseFloat(r[k])).filter(v=>!isNaN(v));

  const manual='<div class="add-form"><div class="row">'+
    '<div><label>Date</label><input type="text" id="wd-date" placeholder="'+todayStr()+'"></div>'+
    W_COLS.map(cc=>'<div><label>'+cc[1]+'</label><input type="text" id="wd-'+cc[0]+'"></div>').join("")+'</div>'+

    '<button class="btn" onclick="importOura()">Import</button>'+
    '<div class="import-note">Columns are matched by name, so the standard Oura export works as-is. Days you already have are updated rather than duplicated.</div></div>';

    '<h1 class="page-title" style="font-size:30px;">the numbers</h1>'+
    '<p class="page-sub">Rolling averages across your last 30 logged days.</p>'+
    dash+
    '<div class="info-card"><h4>About syncing Oura</h4>'+
    '<p>There is no live sync, and I want to be straight about why rather than leave you wondering. Oura retired personal access tokens in December 2025, so the only remaining route is a registered OAuth app &mdash; and that needs a server to hold the client secret and to relay the request, because Oura does not permit a page like this one to call its API directly from the browser. A static site on GitHub Pages has no server, so there is nowhere safe to put any of that.</p>'+
    '<p>What works instead: Oura lets you download your own data from the Membership Hub, and the importer below reads that file. Export every so often and your numbers land here with the rest of your record. If live sync matters enough later, it needs a small backend &mdash; the same piece of work as moving everything to Supabase &mdash; and then it becomes straightforward.</p></div>'+

function importPlacesCSV(){
  const g=guides.find(x=>x.id===currentCityId);
  if(!g){ alert("Add a city first, then import into it."); return; }
  const inp=document.getElementById("imp-places");
  if(!inp.files||!inp.files[0]){ alert("Choose a CSV file first."); return; }
  const cat=document.getElementById("imp-cat").value;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(r.result);
      if(rows.length<2){ alert("That file looks empty."); return; }
      const head=rows[0];
      const iName=findCol(head,["title","name","place"]);
      const iNote=findCol(head,["note","notes","comment","description"]);
      const iUrl=findCol(head,["url","link","google maps url"]);
      if(iName<0){ alert('Could not find a "Title" or "Name" column in that CSV.'); return; }
      let added=0;
      for(let i=1;i<rows.length;i++){
        const nm=(rows[i][iName]||"").trim(); if(!nm) continue;
        g.places.push({ id:uid(), name:nm, category:cat,
          note:iNote>=0?(rows[i][iNote]||"").trim():"", link:iUrl>=0?(rows[i][iUrl]||"").trim():"" });
        added++;
      }
      save(K.guides,guides);
      alert("Imported "+added+" place"+(added===1?"":"s")+' into '+g.city+".");
      inp.value=""; showPanel("travel");
    }catch(err){ alert("Could not read that file as a CSV."); }
  };
  r.readAsText(inp.files[0]);
}

let servAdjust={};
let checkedIng=load("sam_ingchecks_v1",{});
function saveIngChecks(){ save("sam_ingchecks_v1",checkedIng); }
function scaleAmount(line,factor){
  if(factor===1) return line;
  const m=line.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m) return line;
  let val;
  if(m[1].indexOf(" ")>0 && m[1].indexOf("/")>0){ const p=m[1].split(/\s+/); const fr=p[1].split("/"); val=parseFloat(p[0])+parseFloat(fr[0])/parseFloat(fr[1]); }
  else if(m[1].indexOf("/")>0){ const fr=m[1].split("/"); val=parseFloat(fr[0])/parseFloat(fr[1]); }
  else val=parseFloat(m[1]);
  if(isNaN(val)) return line;
  return fmtNum(val*factor)+" "+m[2];
}
function fmtNum(n){
  const whole=Math.floor(n+1e-9), frac=n-whole;
  const table=[[0.125,"1/8"],[0.25,"1/4"],[0.333,"1/3"],[0.375,"3/8"],[0.5,"1/2"],[0.625,"5/8"],[0.666,"2/3"],[0.75,"3/4"],[0.875,"7/8"]];
  for(const t of table){ if(Math.abs(frac-t[0])<0.04) return (whole?whole+" ":"")+t[1]; }
  if(frac<0.04) return String(whole);
  return (Math.round(n*100)/100).toString();
}

function entryDate(e){
  if(e.iso){ const d=new Date(e.iso); if(!isNaN(d)) return d; }
  const d2=new Date(e.date); return isNaN(d2)?null:d2;
}
function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(k){
  const p=k.split("-"); const d=new Date(parseInt(p[0]),parseInt(p[1])-1,1);
  return d.toLocaleDateString("en-US",{month:"short",year:"numeric"});
}

function moodStats(){
  const counts={}; let total=0;
  journalEntries.forEach(e=>{ if(e.mood){ counts[e.mood]=(counts[e.mood]||0)+1; total++; } });
  if(!total) return "";
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,4);
  const gl=journalEntries.reduce((a,e)=>a+((e.glimmers||[]).length),0);
  const gr=journalEntries.reduce((a,e)=>a+((e.gratitudes||[]).length),0);
  return '<div class="dash-grid"><div class="dash-card"><div class="dash-num">'+journalEntries.length+'</div><div class="dash-label">Entries</div></div>'+
    '<div class="dash-card"><div class="dash-num">'+gl+'</div><div class="dash-label">Glimmers noticed</div></div>'+
    '<div class="dash-card"><div class="dash-num">'+gr+'</div><div class="dash-label">Gratitudes</div></div>'+
    '<div class="dash-card"><div class="dash-label" style="margin:0 0 8px">Most felt</div>'+
    top.map(m=>'<div style="font-size:13px;">'+esc(m)+' <span style="color:var(--cream-dim);font-family:var(--mono);font-size:10px;">'+counts[m]+'</span></div>').join("")+'</div></div>';
}

async function addJImgs(input){ for(const f of input.files){ pendingJImgs.push(await fileToDataURL(f)); } input.value=""; renderJPrev(); }

  const box=document.getElementById("j-prev"); if(!box)return;

async function toggleRec(){
  const btn=document.getElementById("rec-btn");
  if(mediaRecorder&&mediaRecorder.state==="recording"){ mediaRecorder.stop(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Voice notes need microphone access, which is not available here."); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream); chunks=[];
    mediaRecorder.ondataavailable=ev=>chunks.push(ev.data);
    mediaRecorder.onstop=async()=>{
      pendingAudio=await fileToDataURL(new Blob(chunks,{type:"audio/webm"}));
      renderJPrev(); stream.getTracks().forEach(t=>t.stop());
      btn.innerHTML="&#9679; record voice note"; btn.classList.remove("recording");
    };
    mediaRecorder.start(); btn.innerHTML="&#9632; stop recording"; btn.classList.add("recording");
  }catch(err){ alert("Microphone access was blocked. Check this site's permissions in your browser settings."); }
}
function addJournal(){

  journalEntries.push({id:uid(),text:t,date:todayStr(),iso:nowISO(),tags:parseTags(document.getElementById("j-tags").value),
    mood:pendingMood,glimmers:gl,gratitudes:gr,images:pendingJImgs.slice(),audio:pendingAudio,fav:false});

}
function removeJournal(id){ if(!confirm("Delete this entry?"))return; journalEntries=journalEntries.filter(e=>e.id!==id); save(K.journal,journalEntries); showPanel("journal"); }
function hashPw(s){
  let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; }
  let h2=52711;
  for(let i=s.length-1;i>=0;i--){ h2=((h2<<5)+h2^s.charCodeAt(i))|0; }
  return (h>>>0).toString(36)+"-"+(h2>>>0).toString(36);
}
function currentPwHash(){
  const stored=localStorage.getItem("sam_pwhash");
  return stored || DATA.journalPasswordHash;
}
function tryUnlock(){
  if(hashPw(document.getElementById("j-pw").value)===currentPwHash()){ sessionStorage.setItem(K.unlocked,"1"); showPanel("journal"); }
  else document.getElementById("j-err").textContent="wrong password";
}
function changePassword(){
  const cur=document.getElementById("pw-cur").value;
  const nw=document.getElementById("pw-new").value;
  if(hashPw(cur)!==currentPwHash()){ alert("Current password is not right."); return; }
  if(nw.length<4){ alert("Pick something at least 4 characters."); return; }
  localStorage.setItem("sam_pwhash",hashPw(nw));
  sessionStorage.removeItem(K.unlocked);
  alert("Password changed. The journal is locked again.");
  showPanel("backup");
}
function lockJournal(){ sessionStorage.removeItem(K.unlocked); showPanel("journal"); }

function storageUsage(){
  let bytes=0;
  Object.keys(localStorage).forEach(k=>{ if(k.indexOf("sam_")===0) bytes+=(localStorage.getItem(k)||"").length*2; });
  return bytes;
}
function fmtBytes(b){
  if(b<1024)return b+" B";
  if(b<1048576)return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(2)+" MB";
}
function panelBackup(){
  const used=storageUsage(), cap=5*1024*1024;
  const pct=Math.min(100,Math.round(used/cap*100));
  const counts=[["Wishlist pins",wishlist.length],["Vision board images",visionBoards.reduce((a,b)=>a+b.items.length,0)],
    ["Photo wall",photos.length],["Concerts",concerts.length],["Recipes",recipes.length],["Journal entries",journalEntries.length],
    ["Thoughts",thoughts.length],["Travel entries",travelEntries.length],["Countries",countries.length],["Inbox",inbox.length],["City guide places",guides.reduce((a,g)=>a+g.places.length,0)],["Metric days",wearable.length]];
  return '<div class="eyebrow">15</div><h1 class="page-title">backup</h1>'+
    '<p class="page-sub">Everything on this site lives in this browser only. Exporting is the one thing that protects it &mdash; do it regularly, and definitely before clearing your browser or switching computers.</p>'+
    '<div class="backup-card"><h3>Export everything</h3>'+
    '<p>Downloads one file containing every tab, entry, photo, and setting. Keep it somewhere safe &mdash; a cloud drive is ideal.</p>'+
    '<button class="btn" onclick="exportAll()">Download backup</button></div>'+
    '<div class="backup-card"><h3>Restore from a backup</h3>'+
    '<p>Loads a previously exported file. This replaces everything currently on the site, so export first if you are unsure.</p>'+
    '<input type="file" accept="application/json" id="imp-file"><div style="height:14px"></div>'+
    '<button class="btn btn-quiet" onclick="importAll()">Restore</button></div>'+
    '<div class="backup-card"><h3>Journal password</h3>'+
    '<p>Change the password for the journal. It is stored as a scrambled value rather than plain text, so it is no longer sitting in the page source &mdash; but this is still a soft lock, not encryption. Someone determined with developer tools could get past it. Do not treat the journal as a vault.</p>'+
    '<div class="row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:18px;">'+
    '<div><label>Current password</label><input type="password" id="pw-cur"></div>'+
    '<div><label>New password</label><input type="password" id="pw-new"></div></div>'+
    '<button class="btn btn-quiet" onclick="changePassword()">Change password</button></div>'+
    '<div class="backup-card"><h3>Storage</h3>'+
    '<p>Browsers cap local storage at roughly 5&ndash;10 MB. Photos and voice notes are what fill it.</p>'+
    '<div class="usage-bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="storage-note" style="margin-top:6px;">'+fmtBytes(used)+' used &middot; about '+pct+'% of a typical 5 MB budget</div>'+
    '<div style="margin-top:20px;">'+counts.map(c=>'<div class="list-row" style="grid-template-columns:1fr 60px;"><div>'+c[0]+'</div><div class="lr-dim">'+c[1]+'</div></div>').join("")+'</div></div>';
}
function exportAll(){
  const dump={};
  Object.keys(localStorage).forEach(k=>{ if(k.indexOf("sam_")===0) dump[k]=localStorage.getItem(k); });
  const payload={ _app:"sams-space", _version:1, _exported:nowISO(), data:dump };
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="sams-space-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function importAll(){
  const inp=document.getElementById("imp-file");
  if(!inp.files||!inp.files[0]){ alert("Choose a backup file first."); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||p._app!=="sams-space"||!p.data) throw new Error("not a valid backup");
      const n=Object.keys(p.data).length;
      if(!confirm("Restore this backup?\n\nExported: "+(p._exported||"unknown").slice(0,10)+"\nContains "+n+" record groups.\n\nEverything currently on the site will be replaced."))return;
      Object.keys(localStorage).forEach(k=>{ if(k.indexOf("sam_")===0) localStorage.removeItem(k); });
      Object.keys(p.data).forEach(k=>localStorage.setItem(k,p.data[k]));
      alert("Restored. Reloading.");
      location.reload();
    }catch(err){ alert("Could not read that file — it does not look like a Sam's space backup."); }
  };
  r.readAsText(inp.files[0]);
}

    '<p>Care notes, the essentials, what I want, what I am working toward, and the moments worth keeping — all somewhere quieter than a phone full of screenshots.</p></div>'+
    focus+'<div class="grid-3">'+doors.map((d,i)=>
      '<div class="doorway" onclick="showPanel(\''+d[0]+'\')"><div class="num">'+String(i+1).padStart(2,"0")+'</div><h3>'+d[1]+'</h3><p>'+d[2]+'</p></div>').join("")+'</div>';
}

const BUILTIN_TABS=[
  {id:"home",label:"Home"},{id:"inbox",label:"Inbox"},{id:"charles",label:"Charles"},{id:"me",label:"About Me"},
  {id:"health",label:"Health"},{id:"wishlist",label:"Wishlist"},{id:"vision",label:"Vision Boards"},
  {id:"photos",label:"Photo Wall"},{id:"concerts",label:"Concerts"},{id:"travel",label:"Travel"},
  {id:"recipes",label:"Recipes"},{id:"journal",label:"Journal"},{id:"thoughts",label:"Thoughts"},
  {id:"tags",label:"Tags"},{id:"backup",label:"Backup"}
];
const PRIMARY_IDS=["home","inbox","journal","wishlist","vision","travel"];
function allTabs(){
  return BUILTIN_TABS.concat(customTabs.map(c=>({id:"c-"+c.id,label:c.name}))).concat([{id:"newtab",label:"+ new tab",add:true}]);
}
let currentTab="home", moreOpen=false;
function toggleMore(e){ if(e)e.stopPropagation(); moreOpen=!moreOpen; renderNav(currentTab); }
function tabBtn(t,active){
  const badge=(t.id==="inbox"&&inbox.length)?'<span class="badge">'+inbox.length+'</span>':"";
  return '<button class="tab '+(t.id===active?"active":"")+' '+(t.add?"addtab":"")+'" onclick="showPanel(\''+t.id+'\')">'+esc(t.label)+badge+'</button>';
}
function renderNav(active){
  const all=allTabs();
  const primary=all.filter(t=>PRIMARY_IDS.indexOf(t.id)>=0);
  const rest=all.filter(t=>PRIMARY_IDS.indexOf(t.id)<0);
  let html=primary.map(t=>tabBtn(t,active)).join("");
  // if we are on a tab that lives under More, surface it in the main row too
  const activeInRest=rest.find(t=>t.id===active);
  if(activeInRest) html+=tabBtn(activeInRest,active);
  html+='<div class="more-wrap"><button class="tab" onclick="toggleMore(event)">more '+(moreOpen?"&#9652;":"&#9662;")+'</button>'+
    '<div class="more-panel '+(moreOpen?"open":"")+'">'+
    rest.map(t=>{
      const sep=(t.add)?'<div class="sep"></div>':"";
      return sep+'<button class="'+(t.id===active?"active":"")+'" onclick="showPanel(\''+t.id+'\')">'+esc(t.label)+'</button>';
    }).join("")+'</div></div>';
  document.getElementById("tabNav").innerHTML=html;
}
document.addEventListener("click",function(e){
  if(moreOpen && !e.target.closest(".more-wrap")){ moreOpen=false; renderNav(currentTab); }
});

const ROUTES={
  home:panelHome, inbox:panelInbox, charles:panelCharles, me:panelMe, health:panelHealth,
  wishlist:panelWishlist, vision:panelVision, photos:()=>panelSimple("photos"), concerts:()=>panelSimple("concerts"),
  travel:panelTravel, recipes:panelRecipes, journal:panelJournal, thoughts:panelThoughts,
  tags:panelTags, tagview:panelTagView, search:panelSearch, backup:panelBackup, newtab:panelNewTab
};
function showPanel(id){
  moreOpen=false;
  let html;
  if(id.indexOf("c-")===0){
    const ct=customTabs.find(c=>c.id===id.slice(2));
    if(ct){ html=panelCustom(ct); } else { id="home"; html=panelHome(); }
  } else if(ROUTES[id]){ html=ROUTES[id](); }
  else { id="home"; html=panelHome(); }
  const sameTab=(id===currentTab);
  const keepY=sameTab?window.scrollY:0;
  currentTab=id;
  renderNav(id);
  document.getElementById("mainStage").innerHTML='<div class="panel">'+html+'</div>';
  if(sameTab) window.scrollTo({top:keepY});
  else window.scrollTo({top:0,behavior:"smooth"});
  if(document.getElementById("mood-grid")) renderMoodGrid();
  history.replaceState(null,"","#"+id);
}

document.getElementById("buildDate").textContent=todayStr();
showPanel((location.hash||"").replace("#","")||"home");

const SPLASH="sam_entered";
function hideSplash(){ sessionStorage.setItem(SPLASH,"1"); document.getElementById("splash").classList.add("hidden"); }
function showSplash(){ document.getElementById("splash").classList.remove("hidden"); }
if(sessionStorage.getItem(SPLASH)==="1") document.getElementById("splash").classList.add("hidden");
</script>
