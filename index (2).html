<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   EDITABLE CONTENT lives in the DATA object near the top of the
   <script> at the bottom of this file. Design/markup below never
   needs to change to update text, sizes, dog info, etc.
   ============================================================ */

:root{
  --ink:#0b0b0c;
  --ink-2:#131315;
  --text:#ece6da;
  --text-dim:#9c948a;
  --wine:#7a1f2b;
  --wine-soft: rgba(122,31,43,0.14);
  --gold:#ab8b5c;
  --line: rgba(236,230,218,0.12);
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'Inter', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-sans);
  font-weight:300;
  min-height:100vh;
}
a{color:inherit;}
::selection{ background:var(--wine); color:var(--text); }
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:#2a2a2c;}

/* ---------------- Splash / entry screen ---------------- */
#splash{
  position:fixed; inset:0; z-index:10000;
  background:#000 url('assets/splash.jpg') center center / cover no-repeat;
  cursor:pointer;
  display:flex; align-items:flex-end; justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
}
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .tap-hint{
  margin-bottom:7vh;
  font-family:var(--font-sans);
  font-size:10px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:#e8ddc8;
  opacity:0.75;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }

/* ---------------- Header / nav ---------------- */
header{
  padding:36px 6vw 18px;
  display:flex; align-items:baseline; justify-content:space-between;
  flex-wrap:wrap; gap:14px;
  max-width:1180px; margin:0 auto;
}
.wordmark{
  font-family:var(--font-serif);
  font-style:italic;
  font-weight:500;
  font-size:clamp(20px,2.4vw,26px);
  letter-spacing:0.01em;
  cursor:pointer;
}
.wordmark span{ color:var(--text-dim); font-style:normal; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-left:12px; }

nav.tabs{
  display:flex; gap:28px; flex-wrap:wrap;
  padding:0 6vw 30px;
  max-width:1180px; margin:0 auto;
  border-bottom:1px solid var(--line);
}
.tab{
  background:none; border:none; cursor:pointer;
  color:var(--text-dim);
  font-family:var(--font-sans);
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  padding:0 0 14px;
  position:relative;
  transition:color 0.2s ease;
}
.tab::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:var(--gold); transform:scaleX(0); transition:transform 0.25s ease;
}
.tab:hover{ color:var(--text); }
.tab.active{ color:var(--text); }
.tab.active::after{ transform:scaleX(1); }

/* ---------------- Main stage ---------------- */
main{
  padding:8px 6vw 100px;
  max-width:1180px;
  margin:0 auto;
}
.panel{ display:none; animation:fadein 0.4s ease; }
.panel.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{
  font-family:var(--font-sans);
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:10px;
}
h1.page-title{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(32px,5vw,52px);
  margin:0 0 8px;
  line-height:1.05;
}
.page-sub{
  color:var(--text-dim);
  font-size:14px;
  font-weight:300;
  margin-bottom:44px;
  max-width:560px;
  line-height:1.6;
}

/* ---------------- HOME ---------------- */
.hero{
  padding:20px 0 56px;
  border-bottom:1px solid var(--line);
  margin-bottom:48px;
}
.hero h2{
  font-family:var(--font-serif);
  font-weight:500;
  font-style:italic;
  font-size:clamp(38px,7vw,72px);
  margin:0 0 18px;
  line-height:1.05;
}
.hero p{
  color:var(--text-dim);
  font-size:15px;
  line-height:1.7;
  max-width:480px;
  font-weight:300;
}

.grid-3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.doorway{
  padding:28px 26px;
  background:var(--ink);
  cursor:pointer;
  transition:background 0.2s ease;
}
.doorway:hover{ background:var(--ink-2); }
.doorway .num{
  font-family:var(--font-sans);
  font-size:10px; color:var(--text-dim); letter-spacing:0.18em; text-transform:uppercase;
}
.doorway h3{
  font-family:var(--font-serif); font-weight:500;
  font-size:21px; margin:10px 0 8px;
}
.doorway p{ font-size:12.5px; color:var(--text-dim); margin:0; line-height:1.6; font-weight:300;}

/* ---------------- Pin boards (wishlist / interiors) ---------------- */
.pingrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:24px; }
.pin{
  border:1px solid var(--line);
  background:var(--ink-2);
  overflow:hidden;
  position:relative;
}
.pin .pin-img{
  width:100%; aspect-ratio:4/5;
  background:#1a1a1c;
  background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
}
.pin .pin-body{ padding:16px 18px 20px; }
.pin .pin-title{ font-family:var(--font-serif); font-size:17px; font-weight:500; line-height:1.3; }
.pin .pin-desc{ font-size:12.5px; color:var(--text-dim); margin-top:6px; line-height:1.55; font-weight:300; }
.pin a.pin-link{
  display:inline-block; margin-top:12px; font-size:11px; letter-spacing:0.1em;
  text-transform:uppercase; text-decoration:none; color:var(--gold);
  border-bottom:1px solid transparent;
}
.pin a.pin-link:hover{ border-bottom-color:var(--gold); }
.pin .pin-remove{
  position:absolute; top:10px; right:10px;
  width:24px; height:24px; border-radius:50%;
  background:rgba(11,11,12,0.7); color:var(--text);
  border:1px solid var(--line);
  font-size:13px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.2s ease;
}
.pin:hover .pin-remove{ opacity:1; }

.add-form{
  border:1px solid var(--line);
  padding:26px 28px;
  margin-bottom:36px;
}
.add-form .eyebrow{ margin-bottom:16px; }
.add-form .row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:14px;}
.add-form label{
  display:block; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--text-dim); margin-bottom:6px;
}
.add-form input[type=text], .add-form input[type=url], .add-form textarea, .add-form input[type=number]{
  background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text);
  font-family:var(--font-sans); font-weight:300; font-size:14px; padding:8px 2px; width:100%;
}
.add-form input:focus, .add-form textarea:focus{ outline:none; border-bottom-color:var(--gold); }
.add-form textarea{ min-height:60px; resize:vertical; }
.add-form input[type=file]{
  font-size:12px; color:var(--text-dim); width:100%;
}
.thumb-preview{
  width:70px; height:70px; object-fit:cover; margin-top:8px; border:1px solid var(--line); display:none;
}
.btn{
  font-family:var(--font-sans); font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  background:none; color:var(--text); border:1px solid var(--gold); padding:12px 26px; cursor:pointer;
  transition:background 0.2s ease, color 0.2s ease;
}
.btn:hover{ background:var(--gold); color:var(--ink); }

/* ---------------- ID card (Charles / handoff) ---------------- */
.id-card{
  border:1px solid var(--line);
  margin-bottom:22px;
}
.id-card .id-head{
  padding:16px 24px;
  border-bottom:1px solid var(--line);
  font-family:var(--font-serif);
  font-size:16px;
  display:flex; justify-content:space-between; align-items:baseline;
  color:var(--text);
}
.id-card .id-head span:last-child{ font-family:var(--font-sans); font-size:11px; color:var(--text-dim); letter-spacing:0.05em; }
.id-card .id-body{ padding:6px 24px; }
.field-row{
  display:grid; grid-template-columns:200px 1fr;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.field-row:last-child{ border-bottom:none; }
.field-label{
  font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--text-dim);
}
.field-value{ color:var(--text); font-weight:300; }
.field-value.placeholder{ color:var(--text-dim); font-style:italic; }

.note-line{
  padding:16px 0;
  font-size:13px;
  color:var(--text-dim);
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
  font-style:italic;
}

/* ---------------- Health dashboard ---------------- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:40px; }
.stat-card{ background:var(--ink); padding:26px 24px; }
.stat-card .stat-label{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; }
.stat-card input{
  background:transparent; border:none; color:var(--text);
  font-family:var(--font-serif); font-size:30px; font-weight:500; width:100%;
  border-bottom:1px solid transparent; padding-bottom:6px;
}
.stat-card input:focus{ outline:none; border-bottom-color:var(--gold); }
.stat-card .stat-unit{ font-size:11px; color:var(--text-dim); margin-top:4px; }

.goals-box{
  border:1px solid var(--line); padding:24px 26px; margin-bottom:40px;
}
.goals-box textarea{
  width:100%; background:transparent; border:none; color:var(--text);
  font-family:var(--font-sans); font-weight:300; font-size:14px; line-height:1.7;
  min-height:100px; resize:vertical;
}
.goals-box textarea:focus{ outline:none; }

.pr-row{
  display:grid; grid-template-columns:1fr 1fr 120px 30px;
  gap:14px; align-items:center;
  padding:13px 0; border-bottom:1px solid var(--line); font-size:13.5px;
}
.pr-row .pr-date{ color:var(--text-dim); font-size:11px; }
.pr-row .pr-remove{ cursor:pointer; color:var(--text-dim); text-align:right; font-size:12px; }
.pr-row .pr-remove:hover{ color:var(--wine); }

/* ---------------- Recipes ---------------- */
.recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.recipe-card{ background:var(--ink); }
.recipe-card .rc-head{ padding:20px 22px 0; }
.recipe-card .rc-head .num{ font-size:10px; color:var(--text-dim); letter-spacing:0.14em; text-transform:uppercase;}
.recipe-card h3{ font-family:var(--font-serif); font-weight:500; margin:8px 0 0; font-size:21px;}
.recipe-card .rc-body{ padding:14px 22px 22px; font-size:13px; color:var(--text-dim); line-height:1.7; white-space:pre-line; font-weight:300;}
.recipe-card .rc-tag{
  display:inline-block; font-size:10px; letter-spacing:0.1em;
  color:var(--gold); margin-top:12px; text-transform:uppercase;
}

/* ---------------- Journal ---------------- */
.lock-screen{
  border:1px solid var(--line); max-width:400px; margin:60px auto; padding:48px 36px; text-align:center;
}
.lock-screen h2{ font-family:var(--font-serif); font-weight:500; font-style:italic; font-size:26px; margin:0 0 10px;}
.lock-screen p{ font-size:12.5px; color:var(--text-dim); margin-bottom:24px; font-weight:300;}
.lock-screen input{
  width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text);
  padding:10px 0; font-family:var(--font-sans); text-align:center; letter-spacing:0.3em; margin-bottom:20px;
}
.lock-screen input:focus{ outline:none; border-bottom-color:var(--gold); }
.lock-screen .err{ color:var(--wine); font-size:12px; height:16px; margin-top:10px; }

.journal-composer{ border:1px solid var(--line); padding:26px 28px; margin-bottom:40px; }
.journal-composer textarea{
  width:100%; background:transparent; border:none; color:var(--text);
  font-family:var(--font-sans); font-weight:300; font-size:14px; line-height:1.7;
  min-height:90px; resize:vertical; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px;
}
.journal-composer textarea:focus{ outline:none; }
.composer-tools{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.tool-btn{
  font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--text-dim); padding:9px 16px; cursor:pointer;
}
.tool-btn:hover{ border-color:var(--gold); color:var(--text); }
.tool-btn.recording{ border-color:var(--wine); color:var(--wine); }
.file-label{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); cursor:pointer; border:1px solid var(--line); padding:9px 16px; }
.file-label:hover{ border-color:var(--gold); color:var(--text); }
.attach-preview{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.attach-thumb{ position:relative; width:56px; height:56px; }
.attach-thumb img{ width:100%; height:100%; object-fit:cover; border:1px solid var(--line); }
.attach-thumb .rm{ position:absolute; top:-6px; right:-6px; width:16px;height:16px; background:var(--ink); border:1px solid var(--line); border-radius:50%; font-size:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);}
.storage-note{ font-size:11px; color:var(--text-dim); font-style:italic; margin-top:14px; line-height:1.6; }

.entry{
  border-top:1px solid var(--line);
  padding:22px 0;
}
.entry .entry-date{ font-size:10.5px; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; }
.entry .entry-text{ margin-top:10px; font-size:14.5px; line-height:1.75; white-space:pre-line; font-weight:300;}
.entry .entry-images{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.entry .entry-images img{ width:90px; height:90px; object-fit:cover; border:1px solid var(--line); cursor:pointer; }
.entry audio{ margin-top:12px; width:100%; max-width:340px; }
.entry .entry-remove{ font-size:11px; color:var(--text-dim); cursor:pointer; margin-top:10px; display:inline-block; }
.entry .entry-remove:hover{ color:var(--wine); }
.lock-btn{
  font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--text-dim); padding:9px 16px; cursor:pointer;
  float:right;
}
.lock-btn:hover{ border-color:var(--gold); color:var(--text); }

/* ---------------- Thoughts ---------------- */
.thought{
  border-top:1px solid var(--line);
  padding:22px 0;
  display:grid; grid-template-columns:50px 1fr; gap:16px;
}
.thought .t-num{ font-family:var(--font-serif); font-size:18px; color:var(--text-dim); }
.thought .t-text{ font-family:var(--font-serif); font-style:italic; font-size:21px; line-height:1.4; color:var(--text); font-weight:400;}
.thought .t-date{ font-size:10.5px; color:var(--text-dim); margin-top:8px; letter-spacing:0.1em; text-transform:uppercase;}

footer{
  text-align:center;
  font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-dim); padding:40px 20px 60px;
  border-top:1px solid var(--line);
}

@media(max-width:640px){
  .field-row{ grid-template-columns:1fr; gap:3px; }
  nav.tabs{ overflow-x:auto; flex-wrap:nowrap; gap:20px; }
  .tab{ flex:0 0 auto; }
  .pr-row{ grid-template-columns:1fr 1fr; }
}
</style>
</head>

function loadList(key, fallback){
  try{ const raw = localStorage.getItem(key); if(raw){ const p = JSON.parse(raw); if(Array.isArray(p) && p.length) return p; } }catch(e){}
  return fallback;
}
function loadObj(key, fallback){
  try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
  return fallback;
}
function saveList(key, list){ try{ localStorage.setItem(key, JSON.stringify(list)); }catch(e){ alert('Could not save — your browser storage may be full (this happens with a lot of photos/voice notes).'); } }
function saveObj(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ alert('Could not save — your browser storage may be full.'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---- generic remove ---- */

/* ---- file helpers ---- */
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
function blobToDataURL(blob){ return fileToDataURL(blob); }

let pendingThumb = { wishlist:null, interiors:null };
async function previewFile(kind){
  const input = document.getElementById(kind+'-file');
  const thumb = document.getElementById(kind+'-thumb');
  if(input.files && input.files[0]){
    const durl = await fileToDataURL(input.files[0]);
    pendingThumb[kind] = durl;
    thumb.src = durl; thumb.style.display='block';
  }
}

async function addPin(kind){
  const title = document.getElementById(kind+'-title').value.trim();
  if(!title) return;
  const item = {
    id: uid(), title,
    link: document.getElementById(kind+'-link').value.trim(),
    description: document.getElementById(kind+'-desc').value.trim(),
    img: pendingThumb[kind] || ""
  };
  pendingThumb[kind] = null;
  if(kind==='wishlist'){ wishlist.push(item); saveList(K.wishlist, wishlist); }
  else { interiors.push(item); saveList(K.interiors, interiors); }
  showPanel(kind);
}

function addRecipe(){
  const title = document.getElementById('rc-title').value.trim();
  const body = document.getElementById('rc-body').value.trim();
  if(!title || !body) return;
  if(recipes.length===1 && recipes[0].title==="add your first recipe") recipes = [];
  recipes.push({ id:uid(), title, tag: document.getElementById('rc-tag').value.trim(), body });
  saveList(K.recipes, recipes);

}

function addThought(){

/* ---- journal: pending attachments ---- */
let pendingImages = [];
let pendingAudioDataURL = null;
let mediaRecorder, audioChunks = [], mediaStream = null;

function renderPendingAttachments(){
  const box = document.getElementById('attach-preview');
  if(!box) return;
  let html = pendingImages.map((src,i)=>'<div class="attach-thumb"><img src="'+src+'"><div class="rm" onclick="removePendingImage('+i+')">&times;</div></div>').join('');
  if(pendingAudioDataURL){ html += '<audio controls src="'+pendingAudioDataURL+'" style="height:40px;"></audio>'; }
  box.innerHTML = html;
}
function removePendingImage(i){ pendingImages.splice(i,1); renderPendingAttachments(); }

async function addPendingImages(input){
  for(const f of input.files){ pendingImages.push(await fileToDataURL(f)); }
  input.value = '';
  renderPendingAttachments();
}

async function toggleRecording(){
  const btn = document.getElementById('rec-btn');
  if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('Voice notes need microphone access, which this browser does not support here.');
    return;
  }
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(mediaStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async ()=>{
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      pendingAudioDataURL = await blobToDataURL(blob);
      renderPendingAttachments();
      mediaStream.getTracks().forEach(t=>t.stop());
      btn.textContent = '● record voice note';
      btn.classList.remove('recording');
    };
    mediaRecorder.start();
    btn.textContent = '■ stop recording';
    btn.classList.add('recording');
  }catch(err){
    alert('Microphone access was blocked — check this browser\'s site permissions to record a voice note.');
  }
}

function addJournal(){
  const text = document.getElementById('jr-text').value.trim();
  if(!text && pendingImages.length===0 && !pendingAudioDataURL) return;
  journalEntries.push({ id:uid(), text, date: todayStr(), images: pendingImages.slice(), audio: pendingAudioDataURL });
  saveList(K.journal, journalEntries);
  pendingImages = []; pendingAudioDataURL = null;
  showPanel('journal');
}

function tryUnlock(){
  const val = document.getElementById('journal-pw').value;
  if(val === DATA.journalPassword){ sessionStorage.setItem(K.unlocked,'1'); showPanel('journal'); }
  else{ document.getElementById('journal-err').textContent = 'wrong password — try again'; }
}
function lockJournal(){ sessionStorage.removeItem(K.unlocked); showPanel('journal'); }
