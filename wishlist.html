<style>
:root{

  --burgundy:#7d2230; --brass:#e6cdbf; --sage:#8d9d7d;
  --line:rgba(242,235,223,0.13);
  --sans:'Archivo',system-ui,sans-serif; --display:'Archivo Expanded','Archivo',system-ui,sans-serif; --script:'Pinyon Script',cursive;
}
*{box-sizing:border-box;}
html{background:var(--espresso);}
body{margin:0;background:var(--espresso);color:var(--cream);font-family:var(--sans);font-weight:300;min-height:100vh;text-transform:lowercase;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(23,17,16,0.86) 0%,rgba(23,17,16,0.78) 46%,rgba(23,17,16,0.74) 100%),
    radial-gradient(ellipse 120% 85% at 50% 46%,rgba(23,17,16,0.12) 20%,rgba(23,17,16,0.48) 100%),
    url('assets/wishlist_bg.jpg');
  background-size:cover;background-position:center 56%;background-color:var(--espresso);}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:36px 22px 80px;}
.mark{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.02em;text-transform:uppercase;}
.mark span{font-family:var(--script);font-weight:400;text-transform:none;font-size:30px;color:var(--brass);margin-left:6px;letter-spacing:0;}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.pill{font-size:12px;letter-spacing:.2em;border:1px solid var(--line);color:var(--cream-dim);padding:6px 12px;}
nav.tabs{display:flex;gap:26px;overflow-x:auto;margin-top:26px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
nav.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:lowercase;white-space:nowrap;color:var(--cream-dim);
  background:none;border:0;border-bottom:1px solid transparent;padding:10px 0 12px;margin-bottom:-1px;}
.tab.on{color:var(--cream);border-bottom-color:var(--cream);cursor:default;}
.tab.lock{opacity:.4;cursor:not-allowed;}
.tab svg{width:9px;height:10px;margin-left:7px;vertical-align:-1px;fill:none;stroke:currentColor;stroke-width:1.6;}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:5;background:rgba(34,26,24,.96);border:1px solid var(--line);color:var(--cream);
  font-size:12px;letter-spacing:.1em;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--brass);margin:44px 0 12px;}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,7vw,56px);margin:0 0 10px;line-height:1.04;letter-spacing:-.01em;}
.sub{color:var(--cream-dim);font-size:14px;line-height:1.6;margin:0 0 30px;max-width:520px;}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.gap{width:14px;}
.chip{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.06em;background:none;border:1px solid var(--line);color:var(--cream-dim);
  padding:9px 15px;cursor:pointer;text-transform:lowercase;}
.chip:hover{color:var(--cream);border-color:var(--cream-dim);}
.chip.active{background:var(--burgundy);border-color:var(--burgundy);color:var(--cream);}
.list{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
.row{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border:1px solid rgba(242,235,223,.10);border-radius:12px;
  background:rgba(23,17,16,.14);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:border-color .2s,opacity .2s;}
.row:hover{border-color:rgba(230,205,191,.35);}
.main{flex:1;min-width:0;}
.title{display:inline;font-size:19px;line-height:1.3;color:var(--cream);text-decoration:none;overflow-wrap:anywhere;}
a.title{border-bottom:1px solid rgba(230,205,191,.35);}
a.title:hover{color:var(--brass);border-bottom-color:var(--brass);}
a.title .go{color:var(--brass);margin-left:8px;font-size:15px;}
.dom{font-size:12px;color:var(--brass);letter-spacing:.1em;margin-top:6px;opacity:.85;overflow-wrap:anywhere;}
.note{font-size:13px;color:var(--cream-dim);margin-top:8px;line-height:1.55;overflow-wrap:anywhere;}
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:12px;letter-spacing:.1em;color:var(--sage);border:1px solid rgba(141,157,125,.4);padding:2px 7px;}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none;}
.price{font-size:15px;color:var(--brass);letter-spacing:.04em;white-space:nowrap;}
label.buy{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;color:var(--cream);cursor:pointer;user-select:none;text-align:right;min-height:34px;}
label.buy input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1px solid rgba(242,235,223,.35);border-radius:50%;margin:0;cursor:pointer;display:grid;place-content:center;background:transparent;flex:none;}
label.buy input:checked{border-color:var(--brass);background:rgba(230,205,191,.18);}
label.buy input:checked::after{content:"\2713";color:var(--brass);font-size:13px;line-height:1;}
label.buy input:disabled{cursor:default;opacity:.7;}
label.buy.off{cursor:default;}
.row.done .title,.row.done .dom,.row.done .note,.row.done .tags,.row.done .price{opacity:.45;}
.row.done .title{text-decoration:line-through;text-decoration-thickness:1.5px;}
.row.done:hover .title,.row.done:hover .dom,.row.done:hover .note,.row.done:hover .tags,.row.done:hover .price{opacity:.75;}
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px;margin:8px 0 30px;}
.bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:clamp(128px,38vw,176px);aspect-ratio:1/1;padding:18px;border-radius:50%;
  cursor:pointer;color:var(--cream);font-family:var(--sans);text-transform:lowercase;background:rgba(23,17,16,.38);border:1px solid rgba(242,235,223,.2);border-color:color-mix(in srgb,var(--acc,#f2ebdf) 46%,transparent);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .22s,border-color .22s,transform .22s,opacity .22s;animation:bubbleFloat 7s ease-in-out infinite;}
.bubble:nth-child(2n){animation-duration:8.5s;animation-delay:-2s;}
.bubble:nth-child(3n){animation-duration:9.5s;animation-delay:-4s;}
.bubble:hover{background:rgba(23,17,16,.32);border-color:rgba(230,205,191,.45);transform:translateY(-4px);}
.bubble .bn{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;}
.bubble.empty{opacity:.65;}
.bubble .bc{font-size:12px;color:var(--acc,var(--brass));letter-spacing:.14em;margin-top:8px;}
.bubble.big{width:clamp(176px,56vw,264px);background:rgba(23,17,16,.46);}
.bubble.big .bn{font-size:26px;} .bubble.big .bc{font-size:13px;}
.bubble.arch{border-style:dashed;}
.bubbles{--bmin:112px;--bmax:208px;gap:8px 16px;margin-bottom:40px;}
.bubbles .bubble:not(.big){width:calc(var(--bmin) + (var(--bmax) - var(--bmin)) * var(--s,.5));padding:12px;}
.bubbles .bubble:not(.big) .bn{font-size:calc(13px + 7px * var(--s,.5));}
.bubbles .bubble.big{width:clamp(200px,60vw,290px);}
.bubbles .bubble:nth-child(3n+2){margin-top:26px;}
.bubbles .bubble:nth-child(3n){margin-bottom:22px;}
@media (max-width:520px){.bubbles{--bmin:100px;--bmax:158px;gap:6px 10px;}.bubbles .bubble.big{width:min(62vw,230px);}}
@keyframes bubbleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.views{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--line);width:max-content;max-width:100%;}
.view{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:lowercase;color:var(--cream-dim);background:none;border:0;padding:14px 24px;cursor:pointer;}
.view + .view{border-left:1px solid var(--line);}
.view.on{background:var(--burgundy);color:var(--cream);}
.prio-badge{margin-left:0;}
@media (max-width:640px){ .views{width:100%;} .view{flex:1;padding:14px 10px;} }
.arch-head{display:flex;align-items:baseline;gap:14px;margin:44px 0 6px;padding-top:22px;border-top:1px solid var(--line);}
.arch-head b{font-family:var(--display);font-size:15px;letter-spacing:.22em;color:var(--brass);font-weight:500;}
.arch-head span{font-size:12px;color:var(--cream-dim);letter-spacing:.08em;}
.arch-sub{font-size:12px;color:var(--cream-dim);letter-spacing:.06em;margin:0 0 4px;}
.list.arch{margin-top:16px;}
.row.archived{border-style:dashed;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;}
.badge{display:table;margin:10px 0 0;max-width:100%;font-size:12px;letter-spacing:.1em;line-height:1.4;color:var(--brass);border:1px solid rgba(230,205,191,.45);border-radius:999px;padding:5px 13px;}
.msg{color:var(--cream-dim);font-size:14px;line-height:1.7;margin-top:30px;max-width:460px;}
.foot{margin-top:46px;font-size:12px;color:var(--cream-dim);letter-spacing:.08em;line-height:1.7;}
a:focus-visible, button:focus-visible, input:focus-visible, label.buy:focus-within{ outline:1px solid var(--brass); outline-offset:3px; }
.page-sub, .sub, .foot{ text-shadow:0 1px 12px rgba(10,6,6,.7); }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
@media (max-width:640px){
  .chip{min-height:44px;}
  .tab{padding:14px 0 15px;}
  label.buy{min-height:44px;}
  .wrap{padding:30px 16px 70px;}
  .row{flex-wrap:wrap;padding:16px;}
  .side{flex-direction:row;width:100%;justify-content:space-between;align-items:center;}
  .chip{padding:10px 14px;}
}

/* refinement — softer, lighter, more romantic (matches the owner site) */
:root{--brass:#e6cdbf;--rose:#d9a99e;--cream:#f4ece2;--cream-dim:#bfb2a4;--line:rgba(244,236,226,.12);--display:'Archivo','Helvetica Neue',system-ui,sans-serif;}
html[data-type="serif"]{--display:'Cormorant Garamond','Cormorant',Georgia,serif;}
body{font-weight:350;line-height:1.6;}
.mark{font-weight:400;text-transform:lowercase;letter-spacing:.2em;font-size:16px;}
.mark span{font-size:38px;color:var(--rose);}
html[data-type="serif"] .mark{font-style:italic;letter-spacing:.08em;font-size:22px;}
.tab{font-weight:400;letter-spacing:.18em;}
.eyebrow{font-weight:400;letter-spacing:.32em;color:var(--rose);}
h1{font-weight:300;font-size:clamp(38px,8vw,62px);letter-spacing:.005em;}
html[data-type="serif"] h1{font-style:italic;font-weight:500;font-size:clamp(48px,10vw,80px);letter-spacing:0;}
.sub{font-size:15px;line-height:1.75;}
.chip{border-radius:999px;font-weight:500;padding:8px 16px;}
.chip.active{background:rgba(217,169,158,.16);border-color:var(--rose);color:var(--cream);}
.row{border-radius:18px;border-color:rgba(244,236,226,.11);}
.row:hover{border-color:rgba(217,169,158,.42);}
.title{font-weight:400;font-size:20px;}
.pill{border-radius:999px;}
.bubble .bn{font-weight:500;letter-spacing:.01em;}
.bubble.big .bn{font-weight:300;}
html[data-type="serif"] .bubble .bn{font-style:italic;font-size:1.18em;}
html[data-type="serif"] .bubbles .bubble:not(.big) .bn{font-size:calc(16px + 8px * var(--s,.5));}
html[data-type="serif"] .bubble.big .bn{font-size:34px;}
.bubble .bc{letter-spacing:.2em;}
.views{border-radius:999px;overflow:hidden;}
.view.on{background:rgba(217,169,158,.18);color:var(--cream);}
.arch-head{border-radius:0;}

.bubbles .bubble.arch .sk{ stroke-dasharray:4 3; }
/* view toggle, chips, list rows */
.views{ border:0; border-radius:0; gap:12px; width:auto; overflow:visible; margin-top:6px; }
.view, .view + .view{ font-family:'Reenie Beanie','Archivo',cursive; font-weight:400; font-size:23px; letter-spacing:0.07em; text-transform:uppercase; color:#fff1d6; background:rgba(22,11,7,0.5); border:1.5px solid rgba(255,241,214,0.55); border-radius:3px 7px 4px 8px / 7px 3px 8px 4px; padding:4px 16px 3px; text-shadow:0 1px 4px rgba(20,10,5,0.8); }
.view.on{ background:#f2d04f; color:#2a150c; border-color:#f2d04f; text-shadow:none; }
.chip{ font-family:'Reenie Beanie','Archivo',cursive; font-weight:400; font-size:22px; letter-spacing:0.07em; text-transform:uppercase; color:#fff1d6; background:rgba(22,11,7,0.5); border:1.5px solid rgba(255,241,214,0.55); border-radius:3px 7px 4px 8px / 7px 3px 8px 4px; padding:4px 14px 3px; text-shadow:0 1px 4px rgba(20,10,5,0.8); min-height:0; }
.chip:hover{ color:#fff1d6; border-color:#f2d04f; }
.chip.active{ background:#f2d04f; color:#2a150c; border-color:#f2d04f; text-shadow:none; }
.row{ background:rgba(22,11,7,0.7); border:1.5px solid rgba(255,241,214,0.2); border-radius:4px 8px 5px 9px / 8px 4px 9px 5px; -webkit-backdrop-filter:none; backdrop-filter:none; }
.row:hover{ background:rgba(22,11,7,0.8); border-color:rgba(242,208,79,0.6); }
.title{ font-family:'Archivo',sans-serif; font-weight:500; font-size:18px; color:#fff1d6; }
a.title{ border-bottom:1px solid rgba(242,208,79,0.6); } a.title .go{ color:#f2d04f; }
.dom{ font-family:'Reenie Beanie',cursive; font-size:21px; letter-spacing:0.06em; color:#f2d04f; opacity:1; }
.note{ color:#e9d9c2; font-size:14px; }
.price{ font-family:'Reenie Beanie',cursive; font-size:30px; color:#f2d04f; }
.tag{ font-family:'Reenie Beanie',cursive; font-size:19px; letter-spacing:0.06em; color:#fff1d6; border-color:rgba(255,241,214,0.5); }
label.buy{ font-family:'Reenie Beanie',cursive; font-size:22px; letter-spacing:0.07em; text-transform:uppercase; color:#fff1d6; }
label.buy input{ border-color:rgba(255,241,214,0.7); }
.badge{ font-family:'Reenie Beanie',cursive; font-size:20px; letter-spacing:0.07em; color:#f2d04f; border-color:rgba(242,208,79,0.6); background:rgba(22,11,7,0.4); }
.arch-head b{ font-family:'Reenie Beanie',cursive; font-size:24px; font-weight:400; color:#f2d04f; } .arch-head span, .arch-sub{ color:#fff1d6; font-family:'Reenie Beanie',cursive; font-size:20px; letter-spacing:0.06em; }
.arch-head{ border-top-color:rgba(255,241,214,0.3); }
@media (max-width:640px){ .bubbles .bubble.big{ width:100%; } .bubbles .bubble{ width:100%; max-width:none; } .bubbles .bubble:not(.big){ width:calc(100% - 4px); } .views{ width:100%; } .view{ flex:1; padding:6px 8px 4px; } }
.tab.lock{ opacity:0.75; }
.tab{ color:#f0e3d0; }
.eyebrow{ margin:8px 0 14px; }
.sub{ margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="mark">sam&rsquo;s<span>space</span></div><div class="pill">view only</div></div>
  <nav class="tabs" id="tabs" aria-label="site sections"></nav>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob" x="-8%" y="-25%" width="116%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="1" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="24"/></filter></svg>
  <h1 class="pz-title" id="ttl" aria-label="Wishlist"></h1>
  <div class="eyebrow" id="eb">06</div>
  <p class="sub" id="sub">things i have my eye on. tap a title to go straight to it. if you pick something up, tick &ldquo;purchased&rdquo; so nobody doubles up.</p>
  <div id="bar"></div>
  <div id="out"></div>
  <div class="foot" id="foot"></div>
<div id="toast" role="status"></div>
</div>
<script>
function magSeed(n){ let x=n*9301+49297; return ()=>{ x=(x*9301+49297)%233280; return x/233280; }; }
function magLetters(word){
  const r=magSeed(word.length*13+5);
  return '<span aria-hidden="true">'+word.split("").map(ch=>{
    const dy=(r()*13-6.5).toFixed(1), rot=(r()*9-4.5).toFixed(1), sc=(0.94+r()*0.16).toFixed(2);
    return '<i style="display:inline-block;font-style:normal;transform:translateY('+dy+'px) rotate('+rot+'deg) scale('+sc+');transform-origin:50% 80%">'+ch+'</i>';
  }).join("")+'</span>';
}
function magScribble(seed,col,w,y){
  const r=magSeed(seed); let d="M0 "+y; const n=18;
  for(let i=1;i<=n;i++){ d+=" L"+(i/n*300).toFixed(1)+" "+(y+(r()*2.6-1.3)+Math.sin(i*0.9+seed)*0.9).toFixed(1); }
  return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
}
function magUnder(){
  return '<svg class="pz-under" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">'+magScribble(3,"#5aa0e6",2.2,4)+magScribble(8,"#15100d",1.5,8.5)+'</svg>';
}
function sketchBox(seed){
  const r=magSeed(seed+7), j=(a)=>(r()*a-a/2);
  const f=(v)=>v.toFixed(1);
  const top="M"+f(-3+j(2))+" "+f(2+j(1.6))+" L"+f(50+j(4))+" "+f(1+j(1.6))+" L"+f(104+j(2))+" "+f(2.5+j(1.6));
  const rt="M"+f(98+j(1.4))+" "+f(-3+j(2))+" L"+f(99+j(1.4))+" "+f(50+j(4))+" L"+f(98+j(1.4))+" "+f(104+j(2));
  const bt="M"+f(103+j(2))+" "+f(98+j(1.4))+" L"+f(50+j(4))+" "+f(99+j(1.4))+" L"+f(-2+j(2))+" "+f(98.5+j(1.4));
  const lf="M"+f(2+j(1.4))+" "+f(103+j(2))+" L"+f(1+j(1.4))+" "+f(50+j(4))+" L"+f(2.5+j(1.4))+" "+f(-4+j(2));
  const st=' fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"';
  const t2="M"+f(-6+j(2))+" "+f(-4+j(1.4))+" L"+f(60+j(5))+" "+f(-5+j(1.2))+" L"+f(92+j(3))+" "+f(-4+j(1.2));
  const l2="M"+f(-4+j(1.2))+" "+f(-6+j(2))+" L"+f(-5+j(1.2))+" "+f(40+j(6))+" L"+f(-4+j(1.2))+" "+f(78+j(4));
  return '<svg class="sk" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="'+top+' '+rt+' '+bt+' '+lf+'"'+st+' stroke-width="1.7"/><path d="'+t2+' '+l2+'"'+st+' stroke-width="1.2" opacity="0.6"/></svg>';
}
var SB_URL="https://hruabbqmsmflwdywtvop.supabase.co";
var SB_KEY="sb_publishable_kq0s9s6gFNnN6PyMqnkhQQ_erwXAaVO";
var TOKEN=(new URLSearchParams(location.search).get("t")||"").trim();
function isPrio(i){ return (i.tags||[]).some(function(t){return String(t).toLowerCase()==="priority";}); }
var view=null; // "priority" or "all"; picked automatically until the visitor chooses
var GOTSEC=/got it|do not purchase/i; // anything in a section named like "i got it...do not purchase" counts as already got
var items=null, secFilter=null, sort="manual", busy=false, memStore={};
var TABS=["home","inbox","about me","journal","health","recipes","wishlist","vision boards","photo wall","concerts","travel","travel planner","charles","thoughts"];
var LOCK='<svg viewBox="0 0 10 11" aria-hidden="true"><rect x="1.2" y="4.8" width="7.6" height="5" rx="1"/><path d="M2.9 4.8V3.3a2.1 2.1 0 0 1 4.2 0v1.5"/></svg>';

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ if(v===undefined) return memStore[k]||null; memStore[k]=v; } return v; }
function myToken(){
  var t=store("wl_ct");
  if(!t||t.length<16){ var a=new Uint8Array(16); crypto.getRandomValues(a); t=Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join(""); store("wl_ct",t); }
  return t;
}
function mine(){ try{ return JSON.parse(store("wl_mine")||"{}"); }catch(e){ return {}; } }
function setMine(id,on){ var m=mine(); if(on) m[id]=1; else delete m[id]; store("wl_mine",JSON.stringify(m)); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function safeUrl(u){
  u=(u||"").trim(); if(!u||/\s/.test(u)) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u="https://"+u.replace(/^\/+/,"");
  return /^https?:\/\/[^\/]*\./i.test(u)?u:"";
}
function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function priceNum(p){ var m=String(p||"").replace(/,/g,"").match(/\d+(?:\.\d+)?/); return m?parseFloat(m[0]):null; }
function priceLabel(p){ p=(p||"").trim(); if(!p) return ""; return /^[\d.,\s]+$/.test(p)?"$"+p:p; }

function drawTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return t==="wishlist"?'<button class="tab on" aria-current="page">wishlist</button>'
      :'<button class="tab lock" data-lock="1" aria-disabled="true">'+t+LOCK+'</button>';
  }).join("");
}
var toastT=null;
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.className="show"; clearTimeout(toastT); toastT=setTimeout(function(){ t.className=""; },2000); }
function rpc(fn,body){
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); });
}
function load(){
  if(TOKEN.length<24){ show("this link is missing its code. ask sam for a fresh one."); return Promise.resolve(); }
  return rpc("wl_view",{p_token:TOKEN}).then(function(a){
    items=Array.isArray(a)?a:[];
    items.forEach(function(i){ if(GOTSEC.test(i.section||"")) i.got=true; });
    // drop local ticks that someone else (or sam) has since cleared
    var m=mine(); items.forEach(function(i){ if(m[i.id]&&!i.claimed) setMine(i.id,false); });
    render();
  }).catch(function(){
    if(items===null) show("couldn&rsquo;t load the list. check your connection and try again.");
  });
}
function show(html){ document.getElementById("bar").innerHTML=""; document.getElementById("out").innerHTML='<p class="msg">'+html+'</p>'; }

function render(){
  if(!items||!items.length){ show("nothing here. the link may have been turned off, or the list is empty."); return; }
  var prioItems=items.filter(function(i){return isPrio(i)&&!i.got;});
  if(view===null||(view==="priority"&&!prioItems.length)){ view=prioItems.length?"priority":"all"; if(view==="priority") secFilter="all"; }
  var pool=view==="priority"?prioItems:items;
  var views=prioItems.length?'<div class="views">'+
    '<button class="view '+(view==="priority"?"on":"")+'" data-view="priority">priority ('+prioItems.length+')</button>'+
    '<button class="view '+(view==="all"?"on":"")+'" data-view="all">everything ('+items.length+')</button></div>':"";
  document.getElementById("sub").innerHTML=view==="priority"?"the few i want most right now. start here.":"pick a category. tap a title to go there. tick &ldquo;purchased&rdquo; if you pick something up, so nobody doubles up.";
  var secs=[], seen={};
  pool.slice().sort(function(a,b){return a.sec_pos-b.sec_pos;}).forEach(function(i){ if(i.section&&!seen[i.section]){ seen[i.section]=1; secs.push(i.section); } });
  secs=secs.filter(function(x){return !GOTSEC.test(x);}).concat(secs.filter(function(x){return GOTSEC.test(x);}));
  if(secFilter!==null&&secFilter!=="all"&&secs.indexOf(secFilter)<0) secFilter=null;
  var open=items.filter(function(i){return !i.got&&!i.claimed;}).length, nArch=items.filter(function(i){return i.got;}).length;
  document.getElementById("eb").innerHTML='<span class="pz-oval">'+esc(secFilter===null?"everything i have my eye on":(secFilter==="all"?"all items":(GOTSEC.test(secFilter)?"archived":secFilter)))+magUnder()+'</span>';
  if(secFilter===null){
    var mxc=Math.max.apply(null,[0].concat(secs.map(function(sc){return pool.filter(function(i){return i.section===sc;}).length;})));
    var bub='<button class="bubble big" data-sec="all">'+sketchBox(3+pool.length)+'<span class="bn">all</span><span class="bc">'+pool.length+'</span></button>'+
      secs.map(function(sc,ix){ var n=pool.filter(function(i){return i.section===sc;}).length;
        return '<button class="bubble'+(GOTSEC.test(sc)?" arch":"")+(n===0?" empty":"")+'" style="--acc:'+["#8d9d7d","#a9c5de","#c98a93","#c9a27e","#b4a7c9","#e6cdbf"][ix%6]+';--s:'+(mxc?Math.sqrt(n/mxc).toFixed(2):0)+'" data-sec="'+esc(sc)+'" title="'+esc(sc)+'">'+sketchBox(sc.length*5+n)+'<span class="bn">'+(GOTSEC.test(sc)?"archived":esc(sc))+'</span><span class="bc">'+n+'</span></button>'; }).join("");
    document.getElementById("bar").innerHTML=views+'<div class="bubbles">'+bub+'</div>';
    document.getElementById("out").innerHTML="";
    document.getElementById("foot").textContent=view==="priority"
      ?prioItems.filter(function(i){return !i.claimed;}).length+" of "+prioItems.length+" priority items still wanted"
      :open+" of "+(items.length-nArch)+" still wanted"+(nArch?" \u00b7 "+nArch+" archived":"");
    return;
  }
  var bar='<div class="bar"><button class="chip" data-back="1">&larr; browse by category</button></div>'+
    '<div class="bar">'+
    [["low","price: low to high"],["high","price: high to low"]].map(function(o){
      return '<button class="chip '+(sort===o[0]?"active":"")+'" data-sort="'+o[0]+'">'+o[1]+'</button>'; }).join("")+'</div>';
  document.getElementById("bar").innerHTML=views+bar;

  var list=pool.filter(function(i){return secFilter==="all"||i.section===secFilter;});
  if(sort!=="manual"){
    var dir=sort==="low"?1:-1;
    list=list.map(function(w,i){return {w:w,i:i,p:priceNum(w.price)};}).sort(function(a,b){
      if(a.p===null&&b.p===null) return a.i-b.i; if(a.p===null) return 1; if(b.p===null) return -1;
      return a.p===b.p?a.i-b.i:(a.p-b.p)*dir; }).map(function(x){return x.w;});
  }
  // purchased-by-a-visitor items sink below what is still available; "got it" items go to the archive below
  var arch=list.filter(function(i){return i.got;});
  list=list.filter(function(i){return !i.got&&!i.claimed;}).concat(list.filter(function(i){return !i.got&&i.claimed;}));

  var m=mine();
  function rowHTML(w){
    var url=safeUrl(w.link), t=esc(w.title||domain(url)||"untitled");
    var head=url?'<a class="title" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+t+'<span class="go">&nearr;</span></a>':'<span class="title">'+t+'</span>';
    var done=w.got||w.claimed, mineOn=!!m[w.id]&&w.claimed&&!w.got;
    var dis=w.claimed&&!mineOn;
    return '<div class="row'+(done?" done":"")+(w.got?" archived":"")+'"><div class="main">'+head+
      (url?'<div class="dom">'+esc(domain(url))+'</div>':"")+
      (w.note?'<div class="note">'+esc(w.note)+'</div>':"")+
      (w.got?'<div class="badge">archived: already got</div>':"")+
      (isPrio(w)&&!w.got&&view!=="priority"?'<div class="badge prio-badge">priority</div>':"")+
      (function(){ var tg=(w.tags||[]).filter(function(x){return String(x).toLowerCase()!=="priority";}); return tg.length?'<div class="tags">'+tg.map(function(x){return '<span class="tag">#'+esc(x)+'</span>';}).join("")+'</div>':""; })()+
      '</div><div class="side">'+(w.price?'<div class="price">'+esc(priceLabel(w.price))+'</div>':"")+
      (w.got?"":'<label class="buy'+(dis?" off":"")+'"><input type="checkbox" data-id="'+esc(w.id)+'"'+(done?" checked":"")+(dis?" disabled":"")+'>purchased</label>')+'</div></div>';
  }
  document.getElementById("out").innerHTML=
    (list.length?'<div class="list">'+list.map(rowHTML).join("")+'</div>':"")+
    (arch.length?'<div class="arch-head"><b>archived</b><span>'+arch.length+' item'+(arch.length===1?"":"s")+'</span></div>'+
      '<p class="arch-sub">already got. nothing to buy here.</p><div class="list arch">'+arch.map(rowHTML).join("")+'</div>':"");
  document.getElementById("foot").textContent=view==="priority"
    ?prioItems.filter(function(i){return !i.claimed;}).length+" of "+prioItems.length+" priority items still wanted"
    :open+" of "+(items.length-nArch)+" still wanted"+(nArch?" \u00b7 "+nArch+" archived":"");
}

document.addEventListener("click",function(e){
  if(e.target.closest&&e.target.closest("button.tab.lock")){ toast("private. sam only."); return; }
  var vb=e.target.closest&&e.target.closest("button.view"); if(vb){ view=vb.getAttribute("data-view"); secFilter=(view==="priority")?"all":null; render(); return; }
  var bb=e.target.closest&&e.target.closest("button.bubble"); if(bb){ secFilter=bb.getAttribute("data-sec"); render(); window.scrollTo(0,0); return; }
  var b=e.target.closest&&e.target.closest("button.chip"); if(!b) return;
  if(b.hasAttribute("data-back")){ secFilter=null; render(); return; }
  else if(b.hasAttribute("data-sort")){ var v=b.getAttribute("data-sort"); sort=(sort===v)?"manual":v; }
  render();
});
document.addEventListener("change",function(e){
  var c=e.target; if(!c||c.type!=="checkbox"||!c.hasAttribute("data-id")||busy) return;
  var id=c.getAttribute("data-id"), want=c.checked, it=items.filter(function(i){return i.id===id;})[0]; if(!it) return;
  if(want&&!confirm("mark “"+(it.title||"this")+"” as purchased? sam will see that someone has it, so nobody else doubles up.")){ c.checked=false; return; }
  busy=true;
  rpc(want?"wl_claim":"wl_unclaim",{p_token:TOKEN,p_id:id,p_ct:myToken()}).then(function(res){
    if(want&&res==="ok"){ setMine(id,true); }
    else if(!want&&res==="ok"){ setMine(id,false); }
    else if(want&&res==="taken"){ alert("someone just marked that one as purchased. refreshing."); }
    else if(res==="off"){ alert("this link has been turned off."); }
  }).catch(function(){ alert("couldn’t save that. check your connection and try again."); })
    .then(function(){ busy=false; return load(); });
});
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
setInterval(function(){ if(!document.hidden&&!busy) load(); },90000);
document.getElementById("ttl").innerHTML=magLetters("Wishlist");
drawTabs();
load();
</script>
</body>
</html>
