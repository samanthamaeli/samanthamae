<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#171110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171110'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-style='italic' font-size='44' text-anchor='middle' fill='%23e8dcae'%3Es%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://hruabbqmsmflwdywtvop.supabase.co; base-uri 'none'; form-action 'none'">
<title>sam's wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Archivo+Expanded:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#171110; --cream:#f2ebdf; --cream-dim:#a89c8e;
  --burgundy:#7d2230; --brass:#e8dcae; --sage:#8d9d7d;
  --line:rgba(242,235,223,0.13);
  --sans:'Archivo',system-ui,sans-serif; --display:'Archivo Expanded','Archivo',system-ui,sans-serif; --script:'Pinyon Script',cursive;
}
*{box-sizing:border-box;}
html{background:var(--espresso);}
body{margin:0;background:var(--espresso);color:var(--cream);font-family:var(--sans);font-weight:300;min-height:100vh;text-transform:lowercase;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(180deg,rgba(23,17,16,0.86) 0%,rgba(23,17,16,0.78) 46%,rgba(23,17,16,0.74) 100%),
    radial-gradient(ellipse 120% 85% at 50% 46%,rgba(23,17,16,0.12) 20%,rgba(23,17,16,0.48) 100%),
    url('assets/wishlist_bg.jpg');
  background-size:cover;background-position:center 56%;background-color:var(--espresso);}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:36px 22px 80px;}
.mark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;}
.mark span{font-family:var(--script);font-weight:400;text-transform:none;font-size:30px;color:var(--brass);margin-left:6px;letter-spacing:0;}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.pill{font-size:12px;letter-spacing:.2em;border:1px solid var(--line);color:var(--cream-dim);padding:6px 12px;}
nav.tabs{display:flex;gap:26px;overflow-x:auto;margin-top:26px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
nav.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:lowercase;white-space:nowrap;color:var(--cream-dim);
  background:none;border:0;border-bottom:1px solid transparent;padding:10px 0 12px;margin-bottom:-1px;}
.tab.on{color:var(--cream);border-bottom-color:var(--cream);cursor:default;}
.tab.lock{opacity:.4;cursor:not-allowed;}
.tab svg{width:9px;height:10px;margin-left:7px;vertical-align:-1px;fill:none;stroke:currentColor;stroke-width:1.6;}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:5;background:rgba(34,26,24,.96);border:1px solid var(--line);color:var(--cream);
  font-size:12px;letter-spacing:.1em;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--brass);margin:44px 0 12px;}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,56px);margin:0 0 10px;line-height:1.04;letter-spacing:-.01em;}
.sub{color:var(--cream-dim);font-size:14px;line-height:1.6;margin:0 0 30px;max-width:520px;}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.gap{width:14px;}
.chip{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.06em;background:none;border:1px solid var(--line);color:var(--cream-dim);
  padding:9px 15px;cursor:pointer;text-transform:lowercase;}
.chip:hover{color:var(--cream);border-color:var(--cream-dim);}
.chip.active{background:var(--burgundy);border-color:var(--burgundy);color:var(--cream);}
.list{display:flex;flex-direction:column;gap:12px;margin-top:26px;}
.row{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border:1px solid rgba(242,235,223,.10);border-radius:12px;
  background:rgba(23,17,16,.14);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:border-color .2s,opacity .2s;}
.row:hover{border-color:rgba(232,220,174,.35);}
.main{flex:1;min-width:0;}
.title{display:inline;font-size:19px;line-height:1.3;color:var(--cream);text-decoration:none;overflow-wrap:anywhere;}
a.title{border-bottom:1px solid rgba(232,220,174,.35);}
a.title:hover{color:var(--brass);border-bottom-color:var(--brass);}
a.title .go{color:var(--brass);margin-left:8px;font-size:15px;}
.dom{font-size:12px;color:var(--brass);letter-spacing:.1em;margin-top:6px;opacity:.85;overflow-wrap:anywhere;}
.note{font-size:13px;color:var(--cream-dim);margin-top:8px;line-height:1.55;overflow-wrap:anywhere;}
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:12px;letter-spacing:.1em;color:var(--sage);border:1px solid rgba(141,157,125,.4);padding:2px 7px;}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none;}
.price{font-size:15px;color:var(--brass);letter-spacing:.04em;white-space:nowrap;}
label.buy{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;color:var(--cream);cursor:pointer;user-select:none;text-align:right;min-height:34px;}
label.buy input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1px solid rgba(242,235,223,.35);border-radius:50%;margin:0;cursor:pointer;display:grid;place-content:center;background:transparent;flex:none;}
label.buy input:checked{border-color:var(--brass);background:rgba(232,220,174,.18);}
label.buy input:checked::after{content:"\2713";color:var(--brass);font-size:13px;line-height:1;}
label.buy input:disabled{cursor:default;opacity:.7;}
label.buy.off{cursor:default;}
.row.done .title,.row.done .dom,.row.done .note,.row.done .tags,.row.done .price{opacity:.45;}
.row.done .title{text-decoration:line-through;text-decoration-thickness:1.5px;}
.row.done:hover .title,.row.done:hover .dom,.row.done:hover .note,.row.done:hover .tags,.row.done:hover .price{opacity:.75;}
.views{display:flex;gap:0;margin:0 0 20px;border:1px solid var(--line);width:max-content;max-width:100%;}
.view{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:lowercase;color:var(--cream-dim);background:none;border:0;padding:14px 24px;cursor:pointer;}
.view + .view{border-left:1px solid var(--line);}
.view.on{background:var(--burgundy);color:var(--cream);}
.prio-badge{margin-left:0;}
@media (max-width:640px){ .views{width:100%;} .view{flex:1;padding:14px 10px;} }
.arch-head{display:flex;align-items:baseline;gap:14px;margin:44px 0 6px;padding-top:22px;border-top:1px solid var(--line);}
.arch-head b{font-family:var(--display);font-size:15px;letter-spacing:.22em;color:var(--brass);font-weight:700;}
.arch-head span{font-size:12px;color:var(--cream-dim);letter-spacing:.08em;}
.arch-sub{font-size:12px;color:var(--cream-dim);letter-spacing:.06em;margin:0 0 4px;}
.list.arch{margin-top:16px;}
.row.archived{border-style:dashed;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;}
.badge{display:table;margin:10px 0 0;max-width:100%;font-size:12px;letter-spacing:.1em;line-height:1.4;color:var(--brass);border:1px solid rgba(232,220,174,.45);border-radius:999px;padding:5px 13px;}
.msg{color:var(--cream-dim);font-size:14px;line-height:1.7;margin-top:30px;max-width:460px;}
.foot{margin-top:46px;font-size:12px;color:var(--cream-dim);letter-spacing:.08em;line-height:1.7;}
a:focus-visible, button:focus-visible, input:focus-visible, label.buy:focus-within{ outline:1px solid var(--brass); outline-offset:3px; }
.page-sub, .sub, .foot{ text-shadow:0 1px 12px rgba(10,6,6,.7); }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
@media (max-width:640px){
  .chip{min-height:44px;}
  .tab{padding:14px 0 15px;}
  label.buy{min-height:44px;}
  .wrap{padding:30px 16px 70px;}
  .row{flex-wrap:wrap;padding:16px;}
  .side{flex-direction:row;width:100%;justify-content:space-between;align-items:center;}
  .chip{padding:10px 14px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="mark">sam&rsquo;s<span>space</span></div><div class="pill">view only</div></div>
  <nav class="tabs" id="tabs" aria-label="site sections"></nav>
  <div class="eyebrow">06</div>
  <h1>wishlist</h1>
  <p class="sub" id="sub">things i have my eye on. tap a title to go straight to it. if you pick something up, tick &ldquo;purchased&rdquo; so nobody doubles up.</p>
  <div id="bar"></div>
  <div id="out"></div>
  <div class="foot" id="foot"></div>
<div id="toast" role="status"></div>
</div>
<script>
var SB_URL="https://hruabbqmsmflwdywtvop.supabase.co";
var SB_KEY="sb_publishable_kq0s9s6gFNnN6PyMqnkhQQ_erwXAaVO";
var TOKEN=(new URLSearchParams(location.search).get("t")||"").trim();
function isPrio(i){ return (i.tags||[]).some(function(t){return String(t).toLowerCase()==="priority";}); }
var view=null; // "priority" or "all"; picked automatically until the visitor chooses
var GOTSEC=/got it|do not purchase/i; // anything in a section named like "i got it...do not purchase" counts as already got
var items=null, secFilter="all", sort="manual", busy=false, memStore={};
var TABS=["home","inbox","about me","journal","health","recipes","wishlist","vision boards","photo wall","concerts","travel","travel planner","charles","thoughts"];
var LOCK='<svg viewBox="0 0 10 11" aria-hidden="true"><rect x="1.2" y="4.8" width="7.6" height="5" rx="1"/><path d="M2.9 4.8V3.3a2.1 2.1 0 0 1 4.2 0v1.5"/></svg>';

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ if(v===undefined) return memStore[k]||null; memStore[k]=v; } return v; }
function myToken(){
  var t=store("wl_ct");
  if(!t||t.length<16){ var a=new Uint8Array(16); crypto.getRandomValues(a); t=Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join(""); store("wl_ct",t); }
  return t;
}
function mine(){ try{ return JSON.parse(store("wl_mine")||"{}"); }catch(e){ return {}; } }
function setMine(id,on){ var m=mine(); if(on) m[id]=1; else delete m[id]; store("wl_mine",JSON.stringify(m)); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function safeUrl(u){
  u=(u||"").trim(); if(!u||/\s/.test(u)) return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u="https://"+u.replace(/^\/+/,"");
  return /^https?:\/\/[^\/]*\./i.test(u)?u:"";
}
function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function priceNum(p){ var m=String(p||"").replace(/,/g,"").match(/\d+(?:\.\d+)?/); return m?parseFloat(m[0]):null; }
function priceLabel(p){ p=(p||"").trim(); if(!p) return ""; return /^[\d.,\s]+$/.test(p)?"$"+p:p; }

function drawTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return t==="wishlist"?'<button class="tab on" aria-current="page">wishlist</button>'
      :'<button class="tab lock" data-lock="1" aria-disabled="true">'+t+LOCK+'</button>';
  }).join("");
}
var toastT=null;
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.className="show"; clearTimeout(toastT); toastT=setTimeout(function(){ t.className=""; },2000); }
function rpc(fn,body){
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); });
}
function load(){
  if(TOKEN.length<24){ show("this link is missing its code. ask sam for a fresh one."); return Promise.resolve(); }
  return rpc("wl_view",{p_token:TOKEN}).then(function(a){
    items=Array.isArray(a)?a:[];
    items.forEach(function(i){ if(GOTSEC.test(i.section||"")) i.got=true; });
    // drop local ticks that someone else (or sam) has since cleared
    var m=mine(); items.forEach(function(i){ if(m[i.id]&&!i.claimed) setMine(i.id,false); });
    render();
  }).catch(function(){
    if(items===null) show("couldn&rsquo;t load the list. check your connection and try again.");
  });
}
function show(html){ document.getElementById("bar").innerHTML=""; document.getElementById("out").innerHTML='<p class="msg">'+html+'</p>'; }

function render(){
  if(!items||!items.length){ show("nothing here. the link may have been turned off, or the list is empty."); return; }
  var prioItems=items.filter(function(i){return isPrio(i)&&!i.got;});
  if(view===null||(view==="priority"&&!prioItems.length)) view=prioItems.length?"priority":"all";
  var pool=view==="priority"?prioItems:items;
  var views=prioItems.length?'<div class="views">'+
    '<button class="view '+(view==="priority"?"on":"")+'" data-view="priority">priority ('+prioItems.length+')</button>'+
    '<button class="view '+(view==="all"?"on":"")+'" data-view="all">everything ('+items.length+')</button></div>':"";
  document.getElementById("sub").innerHTML=view==="priority"?"the few i want most right now. start here.":"things i have my eye on. tap a title to go straight to it. if you pick something up, tick &ldquo;purchased&rdquo; so nobody doubles up.";
  var secs=[], seen={};
  pool.slice().sort(function(a,b){return a.sec_pos-b.sec_pos;}).forEach(function(i){ if(i.section&&!seen[i.section]){ seen[i.section]=1; secs.push(i.section); } });
  secs=secs.filter(function(x){return !GOTSEC.test(x);}).concat(secs.filter(function(x){return GOTSEC.test(x);}));
  if(secFilter!=="all"&&secs.indexOf(secFilter)<0) secFilter="all";
  var open=items.filter(function(i){return !i.got&&!i.claimed;}).length, nArch=items.filter(function(i){return i.got;}).length;
  var bar='<div class="bar">'+
    '<button class="chip '+(secFilter==="all"?"active":"")+'" data-sec="all">all ('+pool.length+')</button>'+
    secs.map(function(s){ var n=pool.filter(function(i){return i.section===s;}).length;
      return '<button class="chip '+(secFilter===s?"active":"")+'" data-sec="'+esc(s)+'">'+(GOTSEC.test(s)?"archived":esc(s))+' ('+n+')</button>'; }).join("")+'</div>'+
    '<div class="bar">'+
    [["low","price: low to high"],["high","price: high to low"]].map(function(o){
      return '<button class="chip '+(sort===o[0]?"active":"")+'" data-sort="'+o[0]+'">'+o[1]+'</button>'; }).join("")+'</div>';
  document.getElementById("bar").innerHTML=views+bar;

  var list=pool.filter(function(i){return secFilter==="all"||i.section===secFilter;});
  if(sort!=="manual"){
    var dir=sort==="low"?1:-1;
    list=list.map(function(w,i){return {w:w,i:i,p:priceNum(w.price)};}).sort(function(a,b){
      if(a.p===null&&b.p===null) return a.i-b.i; if(a.p===null) return 1; if(b.p===null) return -1;
      return a.p===b.p?a.i-b.i:(a.p-b.p)*dir; }).map(function(x){return x.w;});
  }
  // purchased-by-a-visitor items sink below what is still available; "got it" items go to the archive below
  var arch=list.filter(function(i){return i.got;});
  list=list.filter(function(i){return !i.got&&!i.claimed;}).concat(list.filter(function(i){return !i.got&&i.claimed;}));

  var m=mine();
  function rowHTML(w){
    var url=safeUrl(w.link), t=esc(w.title||domain(url)||"untitled");
    var head=url?'<a class="title" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+t+'<span class="go">&nearr;</span></a>':'<span class="title">'+t+'</span>';
    var done=w.got||w.claimed, mineOn=!!m[w.id]&&w.claimed&&!w.got;
    var dis=w.claimed&&!mineOn;
    return '<div class="row'+(done?" done":"")+(w.got?" archived":"")+'"><div class="main">'+head+
      (url?'<div class="dom">'+esc(domain(url))+'</div>':"")+
      (w.note?'<div class="note">'+esc(w.note)+'</div>':"")+
      (w.got?'<div class="badge">archived: already got</div>':"")+
      (isPrio(w)&&!w.got&&view!=="priority"?'<div class="badge prio-badge">priority</div>':"")+
      (function(){ var tg=(w.tags||[]).filter(function(x){return String(x).toLowerCase()!=="priority";}); return tg.length?'<div class="tags">'+tg.map(function(x){return '<span class="tag">#'+esc(x)+'</span>';}).join("")+'</div>':""; })()+
      '</div><div class="side">'+(w.price?'<div class="price">'+esc(priceLabel(w.price))+'</div>':"")+
      (w.got?"":'<label class="buy'+(dis?" off":"")+'"><input type="checkbox" data-id="'+esc(w.id)+'"'+(done?" checked":"")+(dis?" disabled":"")+'>purchased</label>')+'</div></div>';
  }
  document.getElementById("out").innerHTML=
    (list.length?'<div class="list">'+list.map(rowHTML).join("")+'</div>':"")+
    (arch.length?'<div class="arch-head"><b>archived</b><span>'+arch.length+' item'+(arch.length===1?"":"s")+'</span></div>'+
      '<p class="arch-sub">already got. nothing to buy here.</p><div class="list arch">'+arch.map(rowHTML).join("")+'</div>':"");
  document.getElementById("foot").textContent=view==="priority"
    ?prioItems.filter(function(i){return !i.claimed;}).length+" of "+prioItems.length+" priority items still wanted"
    :open+" of "+(items.length-nArch)+" still wanted"+(nArch?" \u00b7 "+nArch+" archived":"");
}

document.addEventListener("click",function(e){
  if(e.target.closest&&e.target.closest("button.tab.lock")){ toast("private. sam only."); return; }
  var vb=e.target.closest&&e.target.closest("button.view"); if(vb){ view=vb.getAttribute("data-view"); secFilter="all"; render(); return; }
  var b=e.target.closest&&e.target.closest("button.chip"); if(!b) return;
  if(b.hasAttribute("data-sec")) secFilter=b.getAttribute("data-sec");
  else if(b.hasAttribute("data-sort")){ var v=b.getAttribute("data-sort"); sort=(sort===v)?"manual":v; }
  render();
});
document.addEventListener("change",function(e){
  var c=e.target; if(!c||c.type!=="checkbox"||!c.hasAttribute("data-id")||busy) return;
  var id=c.getAttribute("data-id"), want=c.checked, it=items.filter(function(i){return i.id===id;})[0]; if(!it) return;
  if(want&&!confirm("mark “"+(it.title||"this")+"” as purchased? sam will see that someone has it, so nobody else doubles up.")){ c.checked=false; return; }
  busy=true;
  rpc(want?"wl_claim":"wl_unclaim",{p_token:TOKEN,p_id:id,p_ct:myToken()}).then(function(res){
    if(want&&res==="ok"){ setMine(id,true); }
    else if(!want&&res==="ok"){ setMine(id,false); }
    else if(want&&res==="taken"){ alert("someone just marked that one as purchased. refreshing."); }
    else if(res==="off"){ alert("this link has been turned off."); }
  }).catch(function(){ alert("couldn’t save that. check your connection and try again."); })
    .then(function(){ busy=false; return load(); });
});
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(); });
setInterval(function(){ if(!document.hidden&&!busy) load(); },90000);
drawTabs();
load();
</script>
</body>
</html>
